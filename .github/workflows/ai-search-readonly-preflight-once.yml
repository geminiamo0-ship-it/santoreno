name: Santo AI Search Readonly Corpus Preflight

on:
  push:
    branches:
      - ops/ai-search-readonly-preflight-20261014
    paths:
      - .github/workflows/ai-search-readonly-preflight-once.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect existing AI Search instance inventory (GET-only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          python - <<'PY'
          import json, os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          base=f"https://api.cloudflare.com/client/v4/accounts/{account}/ai-search/namespaces/default"
          names=["amboss","usmle","passmedicine","pastest","one-examination"]
          def get(path):
              req=Request(base+path,headers={"Authorization": "Bearer "+token,
                                             "Accept":"application/json"},method="GET")
              try:
                  with urlopen(req,timeout=35) as response:
                      result=json.load(response)
                      if not result.get("success",False):
                          raise RuntimeError("Cloudflare returned success=false")
                      return response.status,result.get("result")
              except HTTPError as exc:
                  return exc.code,None
              except (URLError,TimeoutError):
                  return 0,None

          status,items=get("/instances")
          if status != 200 or not isinstance(items,list):
              raise SystemExit(f"Cannot read AI Search instances, HTTP={status}; no write attempted")
          inventory={i.get("id"):i for i in items if isinstance(i,dict) and isinstance(i.get("id"),str)}
          print(f"AI_SEARCH_DEFAULT_NAMESPACE_INSTANCES={len(inventory)}")
          for name in sorted(inventory):
              inst=inventory[name]
              origin=inst.get("source") or ""
              kind=inst.get("type") or ""
              print(f"INSTANCE name={name!r} source={origin!r} type={kind!r}")
          for name in names:
              instance=inventory.get(name)
              if instance is None:
                  print(f"TARGET name={name} status=MISSING")
                  continue
              status,detail=get("/instances/"+name)
              if status!=200 or not isinstance(detail,dict):
                  print(f"TARGET name={name} status=DETAIL_UNAVAILABLE http={status}")
                  continue
              params=detail.get("source_params") or {}
              filters=params.get("include_items") or []
              print(f"TARGET name={name} bucket={detail.get('source')!r} type={detail.get('type')!r} prefix={params.get('prefix')!r} include_count={len(filters)} include_items={filters!r}")
              code,stats=get("/instances/"+name+"/stats")
              if code==200 and isinstance(stats,dict):
                  print(f"TARGET_STATS name={name} "+json.dumps({k:stats.get(k) for k in ("completed","queued","running","error","skipped")},separators=(",",":")))
              else:
                  print(f"TARGET_STATS name={name} unavailable_http={code}")
          print("READ_ONLY_PREFLIGHT_COMPLETED; no new index or R2 write")
          PY
