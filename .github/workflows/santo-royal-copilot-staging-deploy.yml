name: Santo Royal-Style Copilot — Staging Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/santo-royal-copilot-staging-deploy.yml

permissions:
  contents: read
  checks: read

concurrency:
  group: santo-pilot-staging-deploy
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Wait for both exact-main-commit Verify gates
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")"
            policy="$(jq -r '[.check_runs[] | select(.name == "repository-policy") | .conclusion] | map(select(. != null)) | .[0] // ""' <<< "$checks")"
            quality="$(jq -r '[.check_runs[] | select(.name == "code-quality") | .conclusion] | map(select(. != null)) | .[0] // ""' <<< "$checks")"
            if [[ "$policy" == success && "$quality" == success ]]; then
              echo "Exact deployed source commit verification passed."
              exit 0
            fi
            for state in "$policy" "$quality"; do
              case "$state" in
                failure|cancelled|timed_out|action_required|startup_failure|stale) echo "Verify failed"; exit 1 ;;
              esac
            done
            sleep 10
          done
          echo "Timed out waiting for Verify"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Santo packages and build widget
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @santo/widget build
      - name: Deploy Santo Staging Worker only with existing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Verify health, source browser and unauthenticated request denial
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent "$WORKER_URL/health")"
          jq -e '.service == "santo-api" and .status == "ok"' <<< "$health" >/dev/null
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/v1/ai/query" -H "content-type: application/json" --data '{"query":"Explain sodium","idempotency_key":"santo-no-auth-royal-copilot"}')"
          test "$status" = 401
          echo "Santo staging health and unauthorized AI protection passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Real tenant medical RAG/fallback browser acceptance and source citations still require testing" >> "$GITHUB_STEP_SUMMARY"
          echo "Production is unchanged" >> "$GITHUB_STEP_SUMMARY"
