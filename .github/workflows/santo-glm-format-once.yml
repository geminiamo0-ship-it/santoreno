name: Format GLM Staging Candidate Once

on:
  push:
    branches:
      - feat/santo-glm-47-flash-staging-20261020
    paths:
      - .github/workflows/santo-glm-format-once.yml

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.repository == 'geminiamo0-ship-it/santoreno'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Format only GLM implementation changes
        run: |
          set -euo pipefail
          pnpm exec prettier --write workers/api/src/ai/glm-event-stream.test.ts workers/api/src/ai/glm-event-stream.ts workers/api/src/ai/glm-model.test.ts workers/api/src/ai/model.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/api/src/ai/glm-event-stream.test.ts workers/api/src/ai/glm-event-stream.ts workers/api/src/ai/glm-model.test.ts workers/api/src/ai/model.ts
            git commit -m "style(staging): format GLM model and SSE adapters"
            git push origin HEAD:feat/santo-glm-47-flash-staging-20261020
          fi
      - name: Validate candidate without deployment
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
