name: P2 Fix Fixture Domain Once

on:
  push:
    branches:
      - feat/issue-3-tenant-auth

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/issue-3-tenant-auth

      - name: Replace seeded SSO fixture domain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/p2-live-acceptance.mjs')
          text = path.read_text()
          old = '@example.com'
          new = '@example.net'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 fixture email domains, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit fixture fix if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/p2-live-acceptance.mjs; then
            echo "Fixture domain already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p2-live-acceptance.mjs
          git commit -m "fix: avoid seeded WorkOS SSO domain in P2 fixtures"
          git push origin HEAD:feat/issue-3-tenant-auth
