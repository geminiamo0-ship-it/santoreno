name: Format Santo Copilot Final Changes
on:
  push:
    branches: [feat/91-royal-style-santo-copilot]
    paths: [".github/workflows/santo-copilot-format-final.yml"]
permissions: {contents: write}
jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Format retrieval tests and status
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write workers/api/src/ai/retrieval.test.ts PROJECT_STATUS.md workers/api/src/ai/library-catalog.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/api/src/ai/retrieval.test.ts PROJECT_STATUS.md workers/api/src/ai/library-catalog.ts
            git commit -m "style(santo): format isolated-index routing tests and status"
            git push origin HEAD:refs/heads/feat/91-royal-style-santo-copilot
          fi
