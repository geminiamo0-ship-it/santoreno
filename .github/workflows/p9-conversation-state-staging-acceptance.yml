name: P9 Conversation State Staging Acceptance

on:
  push:
    branches:
      - feat/p9-conversation-state
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: p9-conversation-state-staging-acceptance
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
  P2_WORKOS_STATE_PATH: /tmp/santo-p2-workos-state.json
  GH_TOKEN: ${{ github.token }}
  NO_COLOR: "1"

jobs:
  p9-conversation-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Verify on this commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")"
            policy="$(jq -r '[.check_runs[] | select(.name == "repository-policy") | .conclusion] | map(select(. != null)) | .[0] // ""' <<<"$checks")"
            quality="$(jq -r '[.check_runs[] | select(.name == "code-quality") | .conclusion] | map(select(. != null)) | .[0] // ""' <<<"$checks")"
            if [[ "$policy" == "success" && "$quality" == "success" ]]; then
              echo "Verify is green for ${GITHUB_SHA}."
              exit 0
            fi
            for conclusion in "$policy" "$quality"; do
              case "$conclusion" in
                failure|cancelled|timed_out|action_required|startup_failure|stale)
                  echo "Verify failed: repository-policy=${policy}, code-quality=${quality}"
                  exit 1
                  ;;
              esac
            done
            sleep 5
          done
          echo "Timed out waiting for Verify."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load WorkOS staging config
        shell: bash
        run: |
          set -euo pipefail
          client_id="$(jq -r '.workos.clientId // empty' config/environments/staging.json)"
          issuer="$(jq -r '.workos.issuer // empty' config/environments/staging.json)"
          test -n "$client_id"
          test -n "$issuer"
          echo "WORKOS_CLIENT_ID=$client_id" >> "$GITHUB_ENV"
          echo "WORKOS_ISSUER=$issuer" >> "$GITHUB_ENV"

      - name: Validate Cloudflare and WorkOS credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${WORKOS_CLIENT_ID:-}"
          test -n "${WORKOS_ISSUER:-}"
          test -n "${WORKOS_API_KEY:-}"
          cd workers/api
          pnpm exec wrangler whoami

      - name: Apply staging migrations
        shell: bash
        run: |
          set -euo pipefail
          cd workers/api
          pnpm exec wrangler d1 migrations apply CONTROL_DB --env staging --remote

      - name: Seed and authenticate WorkOS staging identities
        shell: bash
        run: node scripts/p2-live-acceptance.mjs seed

      - name: Deploy P9 staging Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          smoke_token="$(openssl rand -hex 32)"
          session_signing_key="$(openssl rand -hex 48)"
          echo "::add-mask::$smoke_token"
          echo "::add-mask::$session_signing_key"
          echo "INFRA_SMOKE_TOKEN=$smoke_token" >> "$GITHUB_ENV"
          jq -n \
            --arg smoke "$smoke_token" \
            --arg client "$WORKOS_CLIENT_ID" \
            --arg issuer "$WORKOS_ISSUER" \
            --arg admins "$SANTO_SUPER_ADMIN_USER_IDS" \
            --arg sessionKey "$session_signing_key" \
            '{
              INFRA_SMOKE_TOKEN: $smoke,
              WORKOS_CLIENT_ID: $client,
              WORKOS_ISSUER: $issuer,
              SANTO_SUPER_ADMIN_USER_IDS: $admins,
              SANTO_SESSION_SIGNING_KEY: $sessionKey
            }' > /tmp/p33-secrets.json
          chmod 600 /tmp/p33-secrets.json
          trap 'rm -f /tmp/p33-secrets.json' EXIT
          cd workers/api
          pnpm exec wrangler deploy --env staging --secrets-file /tmp/p33-secrets.json | tee /tmp/p33-deploy.txt
          worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/p33-deploy.txt | tail -n 1)"
          test -n "$worker_url"
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Wait for P9 Worker readiness
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          health=""
          smoke_status=""
          for attempt in $(seq 1 60); do
            health="$(curl --silent --show-error "${WORKER_URL}/health" || true)"
            smoke_status="$(curl --silent --show-error \
              --output /tmp/p33-smoke.json \
              --write-out '%{http_code}' \
              -H "x-santo-infra-smoke-token: ${INFRA_SMOKE_TOKEN}" \
              "${WORKER_URL}/__infra/smoke" || true)"
            if jq -e '.service == "santo-api" and .status == "ok"' <<<"$health" >/dev/null 2>&1 && \
              [[ "$smoke_status" == "200" ]] && \
              jq -e '.environment == "staging" and .bindings.controlDatabase == "ok" and .bindings.tenantMeterDo == "ok" and .bindings.aiSearch == "ok"' /tmp/p33-smoke.json >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "P33 Worker did not become ready."
          cat /tmp/p33-smoke.json || true
          exit 1

      - name: Create real P2 tenant fixtures
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: node scripts/p2-live-acceptance.mjs verify

      - name: Verify real SQLite ConversationDO and 100 concurrent appends
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: node scripts/p9-conversation-live-acceptance.mjs

      - name: Record P9 staging summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          {
            echo "## P9 conversation state staging acceptance"
            echo
            echo "- Commit: `${GITHUB_SHA}`"
            echo "- Worker: `${WORKER_URL}`"
            echo "- WorkOS authentication and real SQLite DO state: verified"
            echo "- 100 competing ordered writes; single winner: verified"
            echo "- Idempotent retry, owner isolation and cleanup: verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Santo staging fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$P2_WORKOS_STATE_PATH" ]]; then
            exit 0
          fi
          node scripts/p2-live-acceptance.mjs cleanup-sql > /tmp/p33-cleanup.sql
          if [[ -s /tmp/p33-cleanup.sql ]]; then
            cd workers/api
            pnpm exec wrangler d1 execute CONTROL_DB --env staging --remote --file /tmp/p33-cleanup.sql
          fi

      - name: Cleanup WorkOS staging fixtures
        if: always()
        shell: bash
        run: node scripts/p2-live-acceptance.mjs cleanup-workos

      - name: Remove P33 staging state
        if: always()
        shell: bash
        run: rm -f "$P2_WORKOS_STATE_PATH" /tmp/p33-cleanup.sql /tmp/p33-secrets.json /tmp/p33-deploy.txt /tmp/p33-smoke.json
