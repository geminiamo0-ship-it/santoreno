name: P5 Acceptance Format

on:
  push:
    branches:
      - feat/issue-6-atomic-quota
    paths:
      - .github/workflows/p5-acceptance-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/issue-6-atomic-quota

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format P5 acceptance handler
        run: pnpm exec prettier --write workers/api/src/infrastructure/p5-quota-acceptance.ts

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/api/src/infrastructure/p5-quota-acceptance.ts
          if git diff --cached --quiet; then
            echo "No formatter changes needed"
          else
            git commit -m "style: format P5 acceptance handler"
            git push origin HEAD:feat/issue-6-atomic-quota
          fi
