name: Verify Santo Qwen Planner Candidate (NO DEPLOY)
on:
  push:
    branches:
      - feat/qwen-medical-search-planner-20261021
permissions:
  contents: write
  issues: write
concurrency:
  group: santo-qwen-planner-candidate
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned workspace
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Format changed TypeScript safely
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            packages/contracts/src/ai.ts packages/contracts/src/conversation.ts \
            packages/contracts/src/source.ts \
            workers/api/src/ai/service.ts workers/api/src/ai/types.ts \
            workers/api/src/ai/medical-query-rewrite.ts \
            workers/api/src/ai/medical-query-rewrite.test.ts \
            workers/api/src/ai/retrieval.ts workers/api/src/ai/retrieval.test.ts \
            workers/api/src/ai/prompt.ts workers/api/src/ai/model.ts \
            workers/api/src/ai/plain-luna.ts workers/api/src/ai/citations.ts \
            workers/api/src/ai/amboss-adjacent.ts \
            workers/api/src/ai/handler.ts \
            workers/api/src/conversation/ask-service.ts \
            workers/api/src/durable-objects/conversation-turn-core.ts \
            workers/api/src/durable-objects/conversation-turn-core.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/contracts/src/ai.ts packages/contracts/src/conversation.ts packages/contracts/src/source.ts workers/api/src/ai workers/api/src/conversation/ask-service.ts workers/api/src/durable-objects/conversation-turn-core.ts workers/api/src/durable-objects/conversation-turn-core.test.ts
            git commit -m "style(qwen): format medical planner and trusted conversation context"
            git push origin HEAD:feat/qwen-medical-search-planner-20261021
          fi
      - name: Lint Typecheck Test Build Smoke (NO DEPLOY)
        id: verify
        run: |
          set -euo pipefail
          for stage in lint typecheck test build smoke; do
            echo "STAGE=$stage"
            if ! pnpm "$stage" > /tmp/qwen_stage.log 2>&1; then
              cp /tmp/qwen_stage.log /tmp/qwen_failure.log
              echo "$stage" > /tmp/qwen_failure_stage
              tail -n 90 /tmp/qwen_failure.log
              exit 1
            fi
            tail -n 5 /tmp/qwen_stage.log
          done
      - name: Record verification and failure reason on Issue 209
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          {
            echo "Qwen medical planner verification SHA $(git rev-parse HEAD): job=$JOB_RESULT, full_check=$VERIFY_RESULT."
            if test "$VERIFY_RESULT" != success; then
              echo "Failed stage: $(cat /tmp/qwen_failure_stage 2>/dev/null || echo unknown)"
              echo '~~~'
              tail -n 65 /tmp/qwen_failure.log 2>/dev/null || echo "No failure log"
              echo '~~~'
            fi
            echo "Cloudflare Staging and Production were NOT deployed by this job."
          } > /tmp/qwen_issue.md
          gh issue comment 209 --repo geminiamo0-ship-it/santoreno --body-file /tmp/qwen_issue.md
