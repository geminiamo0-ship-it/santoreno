name: Santo Staging AI Failure Codes — Read Only

on:
  push:
    branches: [feat/96-draft-disappears-diagnosis-20261015]
    paths: [.github/workflows/staging-ai-failure-codes-once.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Aggregate error codes only, no tenant identities, questions, or personal data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          acct=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          url="https://api.cloudflare.com/client/v4/accounts/"+acct+"/analytics_engine/sql"
          query="SELECT blob6 AS error_code, blob2 AS request_status, count() AS events FROM santo_usage_staging WHERE timestamp >= NOW() - INTERVAL '12' HOUR AND blob1 = 'ai.query' GROUP BY blob6, blob2 ORDER BY events DESC LIMIT 20"
          request=urllib.request.Request(url,method="POST",data=query.encode(),headers={"Authorization":"Bearer "+token,"Content-Type":"text/plain"})
          try:
            with urllib.request.urlopen(request,timeout=30) as response:
              obj=json.load(response)
          except urllib.error.HTTPError as exc:
            print("ANALYTICS_HTTP",exc.code)
            raise SystemExit(1)
          rows=obj if isinstance(obj,list) else obj.get("data",obj.get("results",[]))
          if isinstance(rows,dict):rows=rows.get("data",[])
          safe=[]
          for row in rows:
            if isinstance(row,dict):safe.append({"error_code":str(row.get("error_code",""))[:90],"request_status":str(row.get("request_status",""))[:10],"events":int(row.get("events",0))})
          print("AI_AGGREGATE",json.dumps(safe))
          PY
