name: Research Viewer Formatting (Temporary)
on:
  push:
    branches: [feat/pubmed-research-mode-203]
    paths: [.github/workflows/research-viewer-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write packages/contracts/src/library-reader.ts workers/api/src/library/handler.ts workers/api/src/library/reader.test.ts workers/api/src/library/research-article.ts workers/api/src/library/research-article.test.ts workers/api/src/index.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/library-reader.ts workers/api/src/library/handler.ts workers/api/src/library/reader.test.ts workers/api/src/library/research-article.ts workers/api/src/library/research-article.test.ts workers/api/src/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(viewer): format verified medical article reader fixes"
            git push origin HEAD:feat/pubmed-research-mode-203
          fi
