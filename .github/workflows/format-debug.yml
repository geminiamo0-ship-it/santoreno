name: Format Debug

on:
  push:
    branches:
      - feat/issue-3-tenant-auth

permissions:
  contents: read

jobs:
  format-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Show Prettier diff
        run: |
          pnpm exec prettier workers/api/src/auth/workos.ts --write
          git diff -- workers/api/src/auth/workos.ts
