name: P33 Temporary Handoff Formatter

on:
  push:
    branches:
      - feat/issue-33-global-search-catalog
    paths:
      - .github/workflows/p33-temp-project-status-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-33-global-search-catalog
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write PROJECT_STATUS.md
      - name: Commit formatting only
        run: |
          set -euo pipefail
          if git diff --quiet -- PROJECT_STATUS.md; then
            echo "PROJECT_STATUS.md already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "style: format P33 project status"
          git push origin HEAD:feat/issue-33-global-search-catalog
