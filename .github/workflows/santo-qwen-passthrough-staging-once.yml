name: Verify and Deploy Qwen Dedup-Only Passthrough STAGING
on:
  push:
    branches:
      - fix/qwen-passthrough-dedup-no-ranking-20261021
    paths:
      - .github/workflows/santo-qwen-passthrough-staging-once.yml
permissions:
  contents: write
  issues: write
concurrency:
  group: santo-qwen-dedup-only-staging-20261021
  cancel-in-progress: true
jobs:
  verified-deploy:
    if: github.repository == 'geminiamo0-ship-it/santoreno'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned workspace
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Format only passthrough files and commit deterministic output
        id: formatting
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            PROJECT_STATUS.md .github/workflows/santo-qwen-passthrough-staging-once.yml \
            packages/contracts/src/ai.ts \
            workers/api/src/ai/retrieval.ts workers/api/src/ai/retrieval.test.ts \
            workers/api/src/ai/prompt.ts workers/api/src/ai/prompt.test.ts \
            workers/api/src/ai/model.ts workers/api/src/ai/model.test.ts \
            workers/api/src/ai/amboss-adjacent.ts workers/api/src/ai/amboss-adjacent.test.ts
          # GitHub Actions cannot push .github/workflows via its restricted token.
          # Format that file only in the checkout; it is a disposable CI job.
          git add PROJECT_STATUS.md packages/contracts/src/ai.ts workers/api/src/ai/retrieval.ts workers/api/src/ai/retrieval.test.ts workers/api/src/ai/prompt.ts workers/api/src/ai/prompt.test.ts workers/api/src/ai/model.ts workers/api/src/ai/model.test.ts workers/api/src/ai/amboss-adjacent.ts workers/api/src/ai/amboss-adjacent.test.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(libraries): format exact-dedup passthrough implementation"
            git push origin HEAD:fix/qwen-passthrough-dedup-no-ranking-20261021
          fi
      - name: Full lint typecheck tests build smoke
        id: verify
        run: |
          set -euo pipefail
          for check in lint typecheck test build smoke; do
            if ! pnpm "$check" > "/tmp/no_rank_$check.log" 2>&1; then
              printf '%s\n' "$check" > /tmp/no_rank_failed_stage
              tail -n 95 "/tmp/no_rank_$check.log"
              exit 1
            fi
            tail -n 3 "/tmp/no_rank_$check.log"
          done
      - name: Guard code and unchanged medical/Luna policies
        id: guard
        run: |
          set -euo pipefail
          grep -Fq 'SANTO_ENV = "staging"' workers/api/wrangler.toml
          grep -Fq 'SANTO_LUNA_PREVIEW = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_RESEARCH_ENABLED = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_QWEN_ROUTING_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_GENERAL_MEDICAL_FALLBACK = "true"' workers/api/wrangler.toml
          grep -Fq 'MAX_VERIFIED_EVIDENCE_SOURCES = 220' packages/contracts/src/ai.ts
          grep -Fq 'MAX_GROUNDED_CITATIONS = 60' packages/contracts/src/ai.ts
          grep -Fq 'santo_medical_search_passthrough' workers/api/src/ai/retrieval.ts
          grep -Fq 'seenSources' workers/api/src/ai/retrieval.ts
          grep -Fq 'seenText' workers/api/src/ai/retrieval.ts
          grep -Fq 'MAX_LIBRARY_EVIDENCE_JSON_CHARS' workers/api/src/ai/prompt.ts
          grep -Fq 'pmcid|pmc' workers/api/src/ai/research-retrieval.ts
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
      - name: Real Qwen medical queries and seven-index Cloudflare lookup
        id: provider
        run: |
          set -euo pipefail
          python -u scripts/smoke_santo_qwen_search_planner_staging.py > /tmp/no_rank_provider.log 2>&1 || {
            tail -n 50 /tmp/no_rank_provider.log
            exit 1
          }
          tail -n 12 /tmp/no_rank_provider.log
      - name: Guard exact SHA before shared Staging deployment
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/qwen-passthrough-dedup-no-ranking-20261021 | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Deploy Santo STAGING only (keep production and all secrets)
        id: deploy
        run: |
          set -euo pipefail
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars > /tmp/no_rank_deploy.log 2>&1 || {
            tail -n 70 /tmp/no_rank_deploy.log
            exit 1
          }
          tail -n 30 /tmp/no_rank_deploy.log
      - name: Verify Staging health and authentication
        id: health
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5 6 7 8; do
            health="$(curl -sS --max-time 12 "$WORKER_URL/health" || true)"
            if jq -e '.service=="santo-api" and .status=="ok"' <<< "$health" >/dev/null 2>&1; then break; fi
            sleep 3
          done
          jq -e '.service=="santo-api" and .status=="ok"' <<< "$health" >/dev/null
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/v1/ai/query" -H 'content-type: application/json' --data '{"query":"aortic stenosis","idempotency_key":"dedup-only-unauth-smoke"}')"
          test "$code" = 401
          echo "Santo Staging exact source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Qwen provider/real search and 200-source contract verified. Signed-in E2E Luna still pending." >> "$GITHUB_STEP_SUMMARY"
      - name: Report result to Issue 209
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          CHECKS: ${{ steps.verify.outcome }}
          GUARDS: ${{ steps.guard.outcome }}
          PROVIDER: ${{ steps.provider.outcome }}
          DEPLOYED: ${{ steps.deploy.outcome }}
          HEALTH: ${{ steps.health.outcome }}
        run: |
          {
            echo "Dedup-only libraries passthrough Staging SHA $(git rev-parse HEAD): job=$STATUS, all_checks=$CHECKS, policy_guard=$GUARDS, real_qwen_search=$PROVIDER, staging_deploy=$DEPLOYED, health_auth=$HEALTH."
            if test "$STATUS" != success; then
              echo "Failed stage: $(cat /tmp/no_rank_failed_stage 2>/dev/null || echo unknown)"
              echo '~~~'
              for f in /tmp/no_rank_typecheck.log /tmp/no_rank_test.log /tmp/no_rank_provider.log /tmp/no_rank_deploy.log; do
                if test -f "$f"; then echo "LOG $f"; tail -n 50 "$f"; fi
              done
              echo '~~~'
            fi
            echo "Staging only. Production unchanged. Authenticated Luna answer/source rendering acceptance is still pending."
          } > /tmp/no_rank_report.md
          gh issue comment 209 --repo geminiamo0-ship-it/santoreno --body-file /tmp/no_rank_report.md
