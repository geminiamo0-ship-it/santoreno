name: Resume AMBOSS AI Search Sync Once
on:
  push:
    branches:
      - diagnostic/amboss-stalled-index-20261015
    paths:
      - .github/workflows/amboss-safe-resume-once.yml
permissions:
  contents: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Safely restart one timed-out AMBOSS indexing sync and observe counters
        run: |
          python3 - <<'PY'
          import os,urllib.request,urllib.error,json,time
          account=os.environ.get('CF_ACCOUNT'); token=os.environ.get('CF_TOKEN')
          if not account or not token: raise SystemExit('Missing Cloudflare service credentials')
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/ai-search/namespaces/default/instances/amboss'
          headers={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'application/json'}
          def api(url, method='GET'):
            request=urllib.request.Request(url,headers=headers,method=method)
            try:
              with urllib.request.urlopen(request,timeout=40) as response:
                value=json.load(response)
              if not value.get('success'):
                print('CLOUDFLARE_API_ERRORS',method,[e.get('code') for e in value.get('errors',[])][:4])
                return None
              return value.get('result')
            except urllib.error.HTTPError as exc:
              print('CLOUDFLARE_HTTP',method,exc.code)
              return None
          config=api(base)
          if not isinstance(config,dict) or config.get('enable') is not True or config.get('paused') is True:
            raise SystemExit('Refusing to alter disabled or paused instance')
          jobs=api(base+'/jobs?per_page=15')
          if not isinstance(jobs,list): raise SystemExit('Cannot inspect current jobs; refusing sync')
          active=[j for j in jobs if isinstance(j,dict) and not j.get('ended_at')]
          if active:
            print('ACTIVE_JOB_PRESENT',len(active),'not triggering another')
            raise SystemExit(0)
          before=api(base+'/stats')
          if not isinstance(before,dict): raise SystemExit('Cannot read index counters')
          print('BEFORE',json.dumps({k:before.get(k) for k in ('completed','queued','running','error','last_activity')}))
          result=api(base+'/jobs',method='POST')
          if not isinstance(result,dict) or not result.get('id'):
            raise SystemExit('New sync job not accepted. No index mutation beyond attempted job.')
          print('TRIGGERED_ONE_SYNC',result.get('id'),'started_at',result.get('started_at'))
          for i in range(8):
            time.sleep(25)
            stats=api(base+'/stats')
            if not isinstance(stats,dict): continue
            print('AFTER_SAMPLE',i+1,json.dumps({k:stats.get(k) for k in ('completed','queued','running','error','last_activity')}))
          PY
