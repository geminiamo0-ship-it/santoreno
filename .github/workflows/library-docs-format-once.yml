name: Temporary Library Docs Format
on:
  push:
    branches:
      - feat/82-source-explorer-library-reader
    paths:
      - .github/workflows/library-docs-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format docs only
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write docs/SOURCE_EXPLORER_RUNBOOK.md
          if ! git diff --quiet -- docs/SOURCE_EXPLORER_RUNBOOK.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/SOURCE_EXPLORER_RUNBOOK.md
            git commit -m 'style(library): format Source Explorer runbook'
            git push origin HEAD:refs/heads/feat/82-source-explorer-library-reader
          fi
