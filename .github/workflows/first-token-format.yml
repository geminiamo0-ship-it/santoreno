name: First Token Format
on:
  push:
    branches: [fix/luna-first-token-stream-staging-20261016]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write workers/api/src/ai/luna-event-stream.ts workers/api/src/ai/luna-event-stream.test.ts workers/api/src/conversation/native-stream.ts workers/api/src/conversation/native-stream.test.ts
      - run: |
          if ! git diff --quiet; then
            git config user.name github-actions
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add workers/api/src/ai/luna-event-stream.ts workers/api/src/ai/luna-event-stream.test.ts workers/api/src/conversation/native-stream.ts workers/api/src/conversation/native-stream.test.ts
            git commit -m 'style: format first-token streaming'
            git push origin HEAD:fix/luna-first-token-stream-staging-20261016
          fi
