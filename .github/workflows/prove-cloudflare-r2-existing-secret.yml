name: Verify Existing Cloudflare Secret Can Write Private R2

on:
  push:
    branches:
      - feat/86-github-existing-cloudflare-r2-upload
    paths:
      - .github/workflows/prove-cloudflare-r2-existing-secret.yml

permissions:
  contents: read

jobs:
  private-r2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_OBJECT: santo-content-staging/_santo-gh-import-smoke/${{ github.sha }}.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Prove existing account-wide Cloudflare token can put, get, delete private R2 object
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          printf 'santo-staging-r2-smoke:%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/santo-r2-smoke.txt"
          cleanup() {
            cd "$GITHUB_WORKSPACE/workers/api"
            pnpm exec wrangler r2 object delete "$R2_OBJECT" --remote --force || true
          }
          trap cleanup EXIT
          cd workers/api
          pnpm exec wrangler r2 object put "$R2_OBJECT" --remote --file="$RUNNER_TEMP/santo-r2-smoke.txt"
          pnpm exec wrangler r2 object get "$R2_OBJECT" --remote --file="$RUNNER_TEMP/santo-r2-readback.txt"
          cmp "$RUNNER_TEMP/santo-r2-smoke.txt" "$RUNNER_TEMP/santo-r2-readback.txt"
          echo 'Existing CLOUDFLARE_API_TOKEN successfully wrote and read private santo-content-staging.' >> "$GITHUB_STEP_SUMMARY"
