name: Temporary Phase 7 Formatter

on:
  push:
    branches:
      - feat/issue-36-validated-stream-lifecycle
    paths:
      - .github/workflows/p7-temp-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/issue-36-validated-stream-lifecycle
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format using the pinned repository Prettier
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write workers/api/src/ai/deadline.ts workers/api/src/ai/handler.test.ts workers/api/src/ai/handler.ts workers/api/src/ai/stream.test.ts
      - name: Commit formatting and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/api/src/ai/deadline.ts workers/api/src/ai/handler.test.ts workers/api/src/ai/handler.ts workers/api/src/ai/stream.test.ts
          git rm .github/workflows/p7-temp-formatter.yml
          git commit -m "style(ai): normalize verified stream phase formatting"
          git push origin HEAD:feat/issue-36-validated-stream-lifecycle
