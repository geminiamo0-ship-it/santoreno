name: Temporary P7 Acceptance Formatter

on:
  push:
    branches:
      - feat/issue-36-validated-stream-lifecycle
    paths:
      - .github/workflows/p7-temp-acceptance-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-36-validated-stream-lifecycle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write scripts/p33-global-search-live-acceptance.mjs
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p33-global-search-live-acceptance.mjs
          git rm .github/workflows/p7-temp-acceptance-formatter.yml
          git commit -m "style(ai): normalize P7 staging verifier"
          git push origin HEAD:feat/issue-36-validated-stream-lifecycle
