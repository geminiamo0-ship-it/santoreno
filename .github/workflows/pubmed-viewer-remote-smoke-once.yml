name: PubMed Viewer Remote Provider Smoke (No Deployment)
on:
  push:
    branches: [fix/pubmed-citation-internal-viewer-20261020]
    paths: [.github/workflows/pubmed-viewer-remote-smoke-once.yml]
permissions:
  contents: read
jobs:
  actual-cloudflare-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Exercise actual PubMed citation reader against Europe PMC within Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          corepack enable
          pnpm install --frozen-lockfile
          cat > workers/api/src/__pubmed_viewer_probe.ts <<'TS'
          import { PubMedResearchRetrieval } from "./ai/research-retrieval";
          import { PubMedArticleViewerService } from "./library/research-article";
          import { R2VerifiedSourceStore } from "./sources/store";
          import type { R2BucketLike, R2ObjectBodyLike } from "./runtime/bindings";
          class MemoryBucket {
            data = new Map<string, string>();
            async get(key: string): Promise<R2ObjectBodyLike | null> {
              const text = this.data.get(key);
              return text ? {text: async () => text} : null;
            }
            async put(key: string, data: string): Promise<unknown> {
              this.data.set(key, data);
              return undefined;
            }
            async delete(key: string) { this.data.delete(key); }
          }
          export default {
            async fetch() {
              const start = Date.now();
              try {
                const query = "Aortic stenosis transcatheter valve randomized trial";
                const evidence = await new PubMedResearchRetrieval().retrieve({
                  query, sourceMode:"research", libraryId: null
                });
                if (evidence.length === 0) throw Error("NO_RESEARCH_RESULTS");
                const sample = evidence.find(e => /^pubmed:\d+$/.test(e.sourceId));
                if (!sample) throw Error("NO_VALID_PUBMED_SOURCE");
                const bucket = new MemoryBucket() as R2BucketLike;
                const snapshots = new R2VerifiedSourceStore(bucket);
                const tenantId = "11111111-1111-4111-8111-111111111111";
                const messageId = "22222222-2222-4222-8222-222222222222";
                const externalUserId = "isolated-smoke";
                await snapshots.save({tenantId,externalUserId,messageId}, [{
                  sourceId: sample.sourceId,libraryId:sample.libraryId,
                  instanceId:sample.instanceId,itemKey:sample.itemKey,
                  title:sample.title,page:sample.page,section:sample.section,
                }]);
                const result = await new PubMedArticleViewerService(snapshots).fromCitation(
                  {tenantId,externalUserId,sessionId:"33333333-3333-4333-8333-333333333333",expiresAt:new Date(Date.now()+60000).toISOString()},
                  {messageId,sourceId:sample.sourceId}
                );
                return Response.json({
                  success:true, sourceMatch:result.source.sourceId===sample.sourceId,
                  abstractExists:result.article.sections.some(s=>s.heading==="Abstract" && s.text.length>40),
                  sectionNames:result.article.sections.map(s=>s.heading),
                  isInternalArticle:result.article.libraryId==="pubmed",
                  elapsedMs:Date.now()-start,
                });
              } catch(error) {
                const e=error as {code?:string,name?:string};
                return Response.json({success:false,code:e.code??"PROBE_FAILED",name:e.name??"Error",elapsedMs:Date.now()-start});
              }
            }
          };
          TS
          cat > workers/api/wrangler.pubmed-viewer-probe.toml <<'TOML'
          name = "santo-pubmed-viewer-isolated"
          main = "src/__pubmed_viewer_probe.ts"
          compatibility_date = "2026-10-01"
          workers_dev = false
          TOML
          cd workers/api
          pnpm exec wrangler dev --remote --config wrangler.pubmed-viewer-probe.toml --ip 127.0.0.1 --port 8789 >/tmp/pubmed-viewer-probe.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl -fsS --max-time 5 http://127.0.0.1:8789/ > /tmp/pubmed-viewer-probe.json 2>/dev/null; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then tail -30 /tmp/pubmed-viewer-probe.log; exit 1; fi
            sleep 2
          done
          jq -c '{success,sourceMatch,abstractExists,sectionNames,isInternalArticle,elapsedMs,code,name}' /tmp/pubmed-viewer-probe.json
          jq -e '.success == true and .sourceMatch == true and .abstractExists == true and .isInternalArticle == true' /tmp/pubmed-viewer-probe.json
          echo 'Authenticated citation reader verified with real Europe PMC data in isolated Cloudflare runtime.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary probe files from runner
        if: always()
        shell: bash
        run: rm -f workers/api/src/__pubmed_viewer_probe.ts workers/api/wrangler.pubmed-viewer-probe.toml /tmp/pubmed-viewer-probe.log /tmp/pubmed-viewer-probe.json
