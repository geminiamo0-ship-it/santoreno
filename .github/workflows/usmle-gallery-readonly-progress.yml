name: USMLE Gallery — Readonly Live Import Counters
on:
  push:
    branches: [feat/medical-gallery-usmle-review-20261025]
    paths: [.github/workflows/usmle-gallery-readonly-progress.yml]
permissions:
  contents: read
jobs:
  readonly-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read live indexing counters (no writes)
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          root=("https://api.cloudflare.com/client/v4/accounts/"+os.environ["CLOUDFLARE_ACCOUNT_ID"]+
             "/ai-search/namespaces/default/instances/santo-medical-images/stats")
          req=urllib.request.Request(root,headers={"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"]})
          with urllib.request.urlopen(req,timeout=40) as f: result=json.load(f)
          if result.get("success") is not True: raise SystemExit("Cloudflare stats unavailable")
          d=result.get("result") or {}
          print("READ_ONLY_LIVE_GALLERY_STATS", {k:d.get(k) for k in ("completed","queued","running","error","skipped","degraded")})
          PY
