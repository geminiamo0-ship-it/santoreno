name: Format PubMed Failover Fix (Temporary)
on:
  push:
    branches:
      - feat/pubmed-research-mode-203
    paths:
      - .github/workflows/research-failover-format-once.yml
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write workers/api/src/ai/research-retrieval.ts workers/api/src/ai/research-retrieval.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/api/src/ai/research-retrieval.ts workers/api/src/ai/research-retrieval.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(research): format resilient provider fallback"
            git push origin HEAD:feat/pubmed-research-mode-203
          fi
