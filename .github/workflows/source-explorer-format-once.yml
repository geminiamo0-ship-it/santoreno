name: Temporary Source Explorer Format
on:
  push:
    branches:
      - feat/82-source-explorer-library-reader
    paths:
      - .github/workflows/source-explorer-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply repository Prettier formatting
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write packages/contracts/src/library-reader.ts workers/api/src/library/reader.ts workers/api/src/library/reader.test.ts workers/api/src/library/handler.ts workers/api/src/library/handler.test.ts workers/api/src/index.ts workers/api/src/runtime/bindings.ts
          if ! git diff --quiet -- packages/contracts/src/library-reader.ts workers/api/src/library/reader.ts workers/api/src/library/reader.test.ts workers/api/src/library/handler.ts workers/api/src/library/handler.test.ts workers/api/src/index.ts workers/api/src/runtime/bindings.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add packages/contracts/src/library-reader.ts workers/api/src/library/reader.ts workers/api/src/library/reader.test.ts workers/api/src/library/handler.ts workers/api/src/library/handler.test.ts workers/api/src/index.ts workers/api/src/runtime/bindings.ts
            git commit -m 'style(library): format source explorer files'
            git push origin HEAD:refs/heads/feat/82-source-explorer-library-reader
          fi
