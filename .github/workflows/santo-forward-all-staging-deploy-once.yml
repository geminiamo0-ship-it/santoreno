name: Verify All Hits and Deploy Santo Staging Only

on:
  push:
    branches:
      - feat/santo-forward-all-search-hits-staging-20261020
    paths:
      - .github/workflows/santo-forward-all-staging-deploy-once.yml

permissions:
  contents: read

concurrency:
  group: santo-forward-all-hits-staging-20261020
  cancel-in-progress: true

jobs:
  verify-search-deploy:
    if: github.repository == 'geminiamo0-ship-it/santoreno'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - name: Checkout exact staging candidate
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Full lint, TypeScript, tests, build, smoke
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
      - name: Check Staging-only guarded source configuration
        run: |
          set -euo pipefail
          grep -Fq 'SANTO_FORWARD_ALL_SEARCH_HITS_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_SEARCH_FAST_PATH_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_ANKING_V12_FULL_SEARCH_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'const MAX_EVIDENCE_ITEMS = 60;' workers/api/src/ai/prompt.ts
          grep -Fq 'max_num_results: this.forwardAllSearchHitsV1' workers/api/src/ai/retrieval.ts
          grep -Fq 'const LEGACY_MAX_TOTAL_EVIDENCE = 15;' workers/api/src/ai/amboss-adjacent.ts
          grep -Fq 'SANTO_LUNA_UNIFIED_PROMPT_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_PLAIN_TEXT_LUNA_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_AI_SEARCH_SINGLE_REQUEST_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_ENV = "staging"' workers/api/wrangler.toml
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One-call 50-result live Cloudflare speed and AnKing smoke (READ ONLY)
        run: |
          set -euo pipefail
          python -m pip install requests==2.32.3
          python scripts/smoke_santo_all_results_staging.py
      - name: Verify this branch is still exact approved source SHA
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/santo-forward-all-search-hits-staging-20261020 | cut -f1)" = "$(git rev-parse HEAD)"
          echo "STAGING_DEPLOY_SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Deploy Santo STAGING only, preserving secrets
        run: |
          set -euo pipefail
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Check Staging Worker health and unauthorized rejection
        run: |
          set -euo pipefail
          health="$(curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$WORKER_URL/health")"
          jq -e '.service=="santo-api" and .status=="ok"' <<< "$health" >/dev/null
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/v1/ai/query" -H 'content-type: application/json' --data '{"query":"aortic stenosis","idempotency_key":"santo-all-hits-unauth-smoke"}')"
          test "$status" = 401
          echo "SANTO_ALL_HITS_STAGING_DEPLOYED" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Production untouched; authenticated Royal Preview source-card acceptance pending." >> "$GITHUB_STEP_SUMMARY"
