name: Temporary Batch R2 Code Format
on:
  push:
    branches:
      - fix/88-batched-cloudflare-r2-import
    paths:
      - .github/workflows/batch-r2-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format with project pinned Prettier
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write scripts/test_medical_library_batch.mjs workers/medical-import/src/index.js
          if ! git diff --quiet -- scripts/test_medical_library_batch.mjs workers/medical-import/src/index.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/test_medical_library_batch.mjs workers/medical-import/src/index.js
            git commit -m 'style(ingest): format temporary R2 batch worker and tests'
            git push origin HEAD:refs/heads/fix/88-batched-cloudflare-r2-import
          fi
