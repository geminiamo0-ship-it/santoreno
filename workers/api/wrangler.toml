name = "santo-api"
main = "src/index.ts"
compatibility_date = "2026-09-14"

[dev]
port = 8787

[vars]
SANTO_ENV = "local"
SANTO_SESSION_TTL_SECONDS = "900"

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "santo-control-plane-local"
database_id = "00000000-0000-0000-0000-000000000001"
preview_database_id = "CONTROL_DB"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "santo-content-local"
preview_bucket_name = "santo-content-local"

[durable_objects]
bindings = [
  { name = "TENANT_METER", class_name = "TenantMeterDO" },
  { name = "CONVERSATION", class_name = "ConversationDO" },
]

[exports.TenantMeterDO]
type = "durable-object"
storage = "sqlite"

[exports.ConversationDO]
type = "durable-object"
storage = "sqlite"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "santo-events-local"

[[queues.consumers]]
queue = "santo-events-local"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 2

[[analytics_engine_datasets]]
binding = "USAGE_ANALYTICS"
dataset = "santo_usage_local"

[env.staging]
name = "santo-api-staging"
workers_dev = true

[env.staging.vars]
SANTO_ENV = "staging"
SANTO_NATIVE_STREAMING_V1 = "true"
SANTO_SESSION_TTL_SECONDS = "900"
SANTO_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
SANTO_LUNA_PREVIEW = "true"
# Staging model selection: GLM-4.7-Flash (Cloudflare-hosted). Switch false to restore Luna.
SANTO_GLM_47_FLASH_V1 = "true"
# One provider response per user generation attempt; no silent paid fallback.
SANTO_SINGLE_PASS_GENERATION_V1 = "true"
SANTO_COMPACT_CITATION_ALIASES_V1 = "true"
SANTO_PLAIN_TEXT_LUNA_V1 = "true"
# Single unified Luna instruction; staged rollback preserves prior prompt behaviour.
SANTO_LUNA_UNIFIED_PROMPT_V1 = "true"
SANTO_COPILOT_ROUTING_V1 = "true"
SANTO_GENERAL_MEDICAL_FALLBACK = "true"
# Staging-only rollback switch for precision-first medical retrieval.
SANTO_MEDICAL_RETRIEVAL_V2 = "true"
# One namespace-level multi-instance Hybrid/RRF + native rerank search; rollback by setting false.
SANTO_AI_SEARCH_SINGLE_REQUEST_V1 = "true"
# AMBOSS-only following 3 sections from private R2; staging rollback switch.
SANTO_AMBOSS_ADJACENT_R2_V1 = "true"
# Staging-only Qwen3 30B-A3B medical search query normalizer (512 max output tokens); no MeSH dictionary.
SANTO_MEDICAL_QUERY_REWRITE_V1 = "true"
# Qwen classifies CHAT vs MEDICAL and rewrites the medical query in one call.
SANTO_QWEN_ROUTING_V1 = "true"
SANTO_LUNA_RICH_IMAGES_V1 = "true"
# Set true on staging only; the gallery deploy job verifies the sixth index first.
SANTO_GALLERY_IMAGES_V1 = "true"
# Owner-confirmed commercial text rights. CIDs can be suggested; unreviewed medical facts are excluded from Luna.
SANTO_ANKING_CARDS_V1 = "true"
# Full 30,477-note AnKing v12 index replaces cardio inside the same one-call search.
SANTO_ANKING_V12_FULL_SEARCH_V1 = "true"
# Owner-approved measured fast route: one 7-index hybrid RRF search, top 30,
# no native reranking. Staging rollback: set false and redeploy.
SANTO_SEARCH_FAST_PATH_V1 = "true"
# Staging trial: forward all valid hits returned by the ONE Cloudflare search (provider hard limit: 50).
SANTO_FORWARD_ALL_SEARCH_HITS_V1 = "true"
SANTO_ANKING_RIGHTS_CLEARED_V1 = "true"
SANTO_AI_SEARCH_INSTANCE_IDS = "amboss,usmle,passmedicine,pastest,one-examination-isolated"
SANTO_LIBRARY_READER_V1 = "true"

[env.staging.secrets]
required = ["INFRA_SMOKE_TOKEN", "SANTO_SESSION_SIGNING_KEY"]

[env.staging.ai]
binding = "AI"

[[env.staging.d1_databases]]
binding = "CONTROL_DB"
database_name = "santo-control-plane-staging"
database_id = "f875f14a-100a-4731-9e9e-1beed957fd16"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "santo-content-staging"

[env.staging.durable_objects]
bindings = [
  { name = "TENANT_METER", class_name = "TenantMeterDO" },
  { name = "CONVERSATION", class_name = "ConversationDO" },
]

[[env.staging.queues.producers]]
binding = "EVENT_QUEUE"
queue = "santo-events-staging"

[[env.staging.queues.consumers]]
queue = "santo-events-staging"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 2

[[env.staging.analytics_engine_datasets]]
binding = "USAGE_ANALYTICS"
dataset = "santo_usage_staging"

[[env.staging.ai_search_namespaces]]
binding = "AI_SEARCH"
namespace = "default"

# Production intentionally omits CONTROL_DB until the real production D1 UUID
# is provisioned. The remaining bindings are name-based and can be declared now.
[env.production]
name = "santo-api"

[env.production.vars]
SANTO_AI_SEARCH_INSTANCE_IDS = "amboss,usmle,passmedicine,pastest,one-examination-isolated"
SANTO_ENV = "production"
SANTO_SESSION_TTL_SECONDS = "900"
SANTO_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
SANTO_LUNA_PREVIEW = "false"
SANTO_COPILOT_ROUTING_V1 = "true"
SANTO_GENERAL_MEDICAL_FALLBACK = "true"
SANTO_LIBRARY_READER_V1 = "true"
WORKOS_CLIENT_ID = "client_01M43DQT18PKE9N4FF3MFEAYXG"
WORKOS_ISSUER = "https://api.workos.com/user_management/client_01M43DQT18PKE9N4FF3MFEAYXG"

[[env.production.d1_databases]]
binding = "CONTROL_DB"
database_name = "santo-control-plane"
database_id = "3c219fbd-b9a1-4891-9b5e-4b4396fcc41e"
migrations_dir = "migrations"

[env.production.ai]
binding = "AI"

[[env.production.r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "santo-content"

[env.production.durable_objects]
bindings = [
  { name = "TENANT_METER", class_name = "TenantMeterDO" },
  { name = "CONVERSATION", class_name = "ConversationDO" },
]

[[env.production.queues.producers]]
binding = "EVENT_QUEUE"
queue = "santo-events"

[[env.production.queues.consumers]]
queue = "santo-events"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 2

[[env.production.analytics_engine_datasets]]
binding = "USAGE_ANALYTICS"
dataset = "santo_usage"

[[env.production.ai_search_namespaces]]
binding = "AI_SEARCH"
namespace = "default"
