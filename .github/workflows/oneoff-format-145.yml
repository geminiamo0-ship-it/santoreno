name: One-off formatting issue 145
on:
  push:
    branches:
      - feat/staging-single-multi-instance-search-20261017
    paths:
      - .github/workflows/oneoff-format-145.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Format only the three changed files
        run: pnpm exec prettier --write docs/adr/0002-staging-single-multi-instance-search.md workers/api/src/ai/retrieval.ts workers/api/src/ai/retrieval.test.ts
      - name: Commit formatting on isolated PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/adr/0002-staging-single-multi-instance-search.md workers/api/src/ai/retrieval.ts workers/api/src/ai/retrieval.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(ai): format staging single-search code and tests"
            git push origin HEAD:feat/staging-single-multi-instance-search-20261017
          fi
