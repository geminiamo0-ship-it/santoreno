name: Temporary AI Search Isolation Format
on:
  push:
    branches:
      - fix/santo-ai-search-instance-isolation
    paths:
      - .github/workflows/format-ai-search-isolation-once.yml
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format changed AI Search files
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write workers/api/src/ai/library-catalog.ts workers/api/src/ai/handler.ts workers/api/src/ai/retrieval.test.ts workers/api/src/runtime/bindings.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/api/src/ai/library-catalog.ts workers/api/src/ai/handler.ts workers/api/src/ai/retrieval.test.ts workers/api/src/runtime/bindings.ts
            git commit -m "style(ai-search): format Santo library isolation"
            git push origin HEAD:refs/heads/fix/santo-ai-search-instance-isolation
          fi
