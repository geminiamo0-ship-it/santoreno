name: Verify Santo batch route
on:
  push:
    branches:
      - fix/staging-dispatch-image-batch-20261015
    paths:
      - .github/workflows/check-batch-route-20261015.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Format and commit entrypoint regression
        run: |
          pnpm exec prettier --write workers/api/src/index.ts workers/api/src/index.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/api/src/index.ts workers/api/src/index.test.ts
            git commit -m "style: format batch route regression"
            git push origin HEAD:refs/heads/fix/staging-dispatch-image-batch-20261015
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
