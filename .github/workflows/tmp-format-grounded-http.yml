name: Temporary grounded HTTP formatter

on:
  push:
    branches:
      - feat/issue-7-grounded-ai

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-7-grounded-ai
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write workers/api/src/ai/http.ts workers/api/src/ai/http.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- workers/api/src/ai/http.ts workers/api/src/ai/http.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/api/src/ai/http.ts workers/api/src/ai/http.test.ts
          git commit -m "style: format grounded AI HTTP layer"
          git push origin HEAD:feat/issue-7-grounded-ai
