name: Noor Development Staging — isolated D1 and Worker

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/noor-private-staging.yml
      - scripts/noor_private_staging.py
      - scripts/noor_source_gate.py
      - scripts/noor_report_staging.py
      - scripts/noor_notebook_staging.py
      - scripts/noor_quran_archive_staging.py
      - scripts/noor_classroom_staging.py
      - scripts/noor_livekit_staging.py
      - tests/test_noor_livekit_staging.py
      - tests/test_noor_source_gate.py
      - tests/test_noor_trial_staging.py
      - tests/test_noor_trial_reschedule_staging.py
      - tests/test_noor_subscription_ledger_staging.py
      - tests/test_noor_classroom_staging.py
      - tests/test_noor_quran_archive_staging.py
      - tests/test_noor_notebook_staging.py
      - tests/test_noor_report_staging.py
      - scripts/noor_staging_profile_browser.mjs
      - scripts/noor_staging_teacher_browser.mjs
      - scripts/noor_staging_livekit_browser.mjs
  workflow_dispatch:
    inputs:
      browser_qa:
        description: "Run targeted synthetic Chrome only when visual acceptance is required"
        required: false
        type: boolean
        default: false
      livekit_browser_qa:
        description: "Run two signed synthetic browsers with fake media and real LiveKit Dev"
        required: false
        type: boolean
        default: false
      noor_pr_number:
        description: "Optional same-repo reviewed Noor PR number; empty selects verified main"
        required: false
        type: string
        default: ""
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/noor-private-staging.yml
      - scripts/noor_private_staging.py
      - scripts/noor_source_gate.py
      - scripts/noor_report_staging.py
      - scripts/noor_notebook_staging.py
      - scripts/noor_quran_archive_staging.py
      - scripts/noor_classroom_staging.py
      - scripts/noor_livekit_staging.py
      - tests/test_noor_livekit_staging.py
      - tests/test_noor_source_gate.py
      - tests/test_noor_trial_staging.py
      - tests/test_noor_trial_reschedule_staging.py
      - tests/test_noor_subscription_ledger_staging.py
      - tests/test_noor_classroom_staging.py
      - tests/test_noor_quran_archive_staging.py
      - tests/test_noor_notebook_staging.py
      - tests/test_noor_report_staging.py
      - scripts/noor_staging_profile_browser.mjs
      - scripts/noor_staging_teacher_browser.mjs
      - scripts/noor_staging_livekit_browser.mjs

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: noor-private-staging-provision
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated Noor staging script without network or credentials
        run: python3 -m py_compile scripts/noor_private_staging.py scripts/noor_report_staging.py scripts/noor_notebook_staging.py scripts/noor_quran_archive_staging.py scripts/noor_classroom_staging.py scripts/noor_livekit_staging.py scripts/noor_source_gate.py
      - name: Unit test canonical staging source/identity gates offline
        run: |
          python3 -m unittest discover -s tests -p 'test_noor_canonical_staging.py' -v
          python3 -m unittest discover -s tests -p 'test_noor_report_staging.py' -v
          python3 -m unittest discover -s tests -p 'test_noor_notebook_staging.py' -v
          python3 -m unittest discover -s tests -p 'test_noor_quran_archive_staging.py' -v
          python3 -m unittest discover -s tests -p 'test_noor_classroom_staging.py' -v
          python3 -m unittest discover -s tests -p 'test_noor_livekit_staging.py' -v
          python3 -m unittest discover -s tests -p 'test_noor_source_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_noor_trial_staging.py' -v
          python3 -m unittest discover -s tests -p 'test_noor_trial_reschedule_staging.py' -v
          python3 -m unittest discover -s tests -p 'test_noor_subscription_ledger_staging.py' -v
          python3 -m unittest discover -s tests -p 'test_noor_dev_realtime.py' -v
      - name: Syntax check remote-staging browser acceptance
        run: |
          node --check scripts/noor_staging_profile_browser.mjs
          node --check scripts/noor_staging_teacher_browser.mjs
          node --check scripts/noor_staging_livekit_browser.mjs

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      NOOR_PR_NUMBER: ${{ (github.event_name == 'workflow_dispatch' && inputs.noor_pr_number) || '' }}
      WRANGLER_SEND_METRICS: "false"
      NOOR_STAGING_BROWSER_QA: ${{ ((github.event_name == 'workflow_dispatch' && inputs.browser_qa) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[noor-portal-e2e]'))) && 'true' || 'false' }}
      NOOR_STAGING_LIVEKIT_BROWSER_QA: ${{ (github.event_name == 'workflow_dispatch' && inputs.livekit_browser_qa && 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[noor-livekit-e2e]') && 'true') || 'false' }}
    steps:
      - name: Checkout scoped workflow repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve verified Noor main or independently reviewed PR head
        shell: bash
        run: |
          set -euo pipefail
          NOOR_SHA="$(python3 scripts/noor_source_gate.py)"
          echo "NOOR_SHA=$NOOR_SHA" >> "$GITHUB_ENV"
      - name: Checkout immutable verified Noor source SHA
        uses: actions/checkout@v4
        with:
          repository: geminiamo0-ship-it/nour-elquran
          ref: ${{ env.NOOR_SHA }}
          path: noor
          persist-credentials: false
      - name: Verify exact Noor checkout and private guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C noor rev-parse HEAD)" = "$NOOR_SHA"
          test "$(python3 scripts/noor_source_gate.py)" = "$NOOR_SHA"
          test -f noor/workers/site/src/staging-access.ts
          test -f noor/tests/staging-access.test.mjs
          test -f noor/docs/NOOR_STAGING_RUNBOOK.md
          grep -Fq 'stagingAccessGuard(request, env)' noor/workers/site/src/index.ts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build Noor account-enabled developer UI
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
          cd noor
          pnpm install --frozen-lockfile
          NEXT_PUBLIC_ACCOUNT_UI=true NEXT_PUBLIC_QURAN_PERSISTENCE_ENABLED=true NEXT_PUBLIC_TEACHER_READONLY_ENABLED=true NEXT_PUBLIC_NOOR_REALTIME_HINTS_ENABLED=true NEXT_PUBLIC_NOOR_REALTIME_PREVIEW_ENABLED=true pnpm --filter @noor/web build
      - name: Deploy open developer staging and verify application account security
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 scripts/noor_source_gate.py)" = "$NOOR_SHA"
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare GitHub secrets missing"; exit 1; }
          python3 scripts/noor_private_staging.py
      - name: Upload Noor synthetic staging Chrome screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-profile-remote-browser
          path: |
            artifacts/noor-staging-profile/*.png
            artifacts/noor-staging-teacher/*.png
            artifacts/noor-staging-livekit/*.png
          if-no-files-found: warn
