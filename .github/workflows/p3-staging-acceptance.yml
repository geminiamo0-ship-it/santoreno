name: P3 Staging Acceptance

on:
  push:
    branches:
      - feat/issue-4-server-credentials
  workflow_dispatch:

permissions:
  contents: read
  checks: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
  P2_WORKOS_STATE_PATH: /tmp/santo-p2-workos-state.json
  P3_CREDENTIAL_STATE_PATH: /tmp/santo-p3-credential-state.json
  GH_TOKEN: ${{ github.token }}
  NO_COLOR: "1"

jobs:
  p3-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Verify on this commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")"
            policy="$(jq -r '[.check_runs[] | select(.name == "repository-policy") | .conclusion] | map(select(. != null)) | .[0] // ""' <<<"$checks")"
            quality="$(jq -r '[.check_runs[] | select(.name == "code-quality") | .conclusion] | map(select(. != null)) | .[0] // ""' <<<"$checks")"
            if [[ "$policy" == "success" && "$quality" == "success" ]]; then
              echo "Verify is green for ${GITHUB_SHA}."
              exit 0
            fi
            for conclusion in "$policy" "$quality"; do
              case "$conclusion" in
                failure|cancelled|timed_out|action_required|startup_failure|stale)
                  echo "Verify failed: repository-policy=${policy}, code-quality=${quality}"
                  exit 1
                  ;;
              esac
            done
            sleep 5
          done
          echo "Timed out waiting for Verify."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load WorkOS staging config
        shell: bash
        run: |
          set -euo pipefail
          client_id="$(jq -r '.workos.clientId // empty' config/environments/staging.json)"
          environment_id="$(jq -r '.workos.environmentId // empty' config/environments/staging.json)"
          application_id="$(jq -r '.workos.applicationId // empty' config/environments/staging.json)"
          issuer="$(jq -r '.workos.issuer // empty' config/environments/staging.json)"
          test -n "$client_id"
          test -n "$environment_id"
          test -n "$application_id"
          test -n "$issuer"
          echo "WORKOS_CLIENT_ID=$client_id" >> "$GITHUB_ENV"
          echo "WORKOS_ENVIRONMENT_ID=$environment_id" >> "$GITHUB_ENV"
          echo "WORKOS_APPLICATION_ID=$application_id" >> "$GITHUB_ENV"
          echo "WORKOS_ISSUER=$issuer" >> "$GITHUB_ENV"

      - name: Validate Cloudflare and WorkOS credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${WORKOS_CLIENT_ID:-}"
          test -n "${WORKOS_ISSUER:-}"
          test -n "${WORKOS_API_KEY:-}"
          cd workers/api
          pnpm exec wrangler whoami

      - name: Apply P3 staging migrations
        shell: bash
        run: |
          set -euo pipefail
          cd workers/api
          pnpm exec wrangler d1 migrations apply CONTROL_DB --env staging --remote

      - name: Verify P3 tables exist remotely
        shell: bash
        run: |
          set -euo pipefail
          cd workers/api
          pnpm exec wrangler d1 execute CONTROL_DB --env staging --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('tenant_credentials','tenant_allowed_domains','tenant_security_audit') ORDER BY name;" \
            > /tmp/p3-tables.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/p3-tables.json', 'utf8'));
          const rows = payload.flatMap((entry) => entry?.results ?? entry?.result?.results ?? []);
          const names = new Set(rows.map((row) => row.name));
          for (const expected of ['tenant_allowed_domains', 'tenant_credentials', 'tenant_security_audit']) {
            if (!names.has(expected)) throw new Error(`Missing remote P3 table: ${expected}`);
          }
          console.log('Remote P3 credential tables verified.');
          NODE

      - name: Seed and authenticate WorkOS staging identities
        shell: bash
        run: node scripts/p2-live-acceptance.mjs seed

      - name: Deploy P3 staging Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          smoke_token="$(openssl rand -hex 32)"
          echo "::add-mask::$smoke_token"
          echo "INFRA_SMOKE_TOKEN=$smoke_token" >> "$GITHUB_ENV"
          jq -n \
            --arg smoke "$smoke_token" \
            --arg client "$WORKOS_CLIENT_ID" \
            --arg issuer "$WORKOS_ISSUER" \
            --arg admins "$SANTO_SUPER_ADMIN_USER_IDS" \
            '{
              INFRA_SMOKE_TOKEN: $smoke,
              WORKOS_CLIENT_ID: $client,
              WORKOS_ISSUER: $issuer,
              SANTO_SUPER_ADMIN_USER_IDS: $admins
            }' > /tmp/p3-secrets.json
          chmod 600 /tmp/p3-secrets.json
          trap 'rm -f /tmp/p3-secrets.json' EXIT
          cd workers/api
          pnpm exec wrangler deploy --env staging --secrets-file /tmp/p3-secrets.json | tee /tmp/p3-deploy.txt
          worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/p3-deploy.txt | tail -n 1)"
          test -n "$worker_url"
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Wait for P3 Worker readiness
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          health=""
          smoke_status=""
          for attempt in $(seq 1 45); do
            health="$(curl --silent --show-error "${WORKER_URL}/health" || true)"
            smoke_status="$(curl --silent --show-error \
              --output /tmp/p3-smoke.json \
              --write-out '%{http_code}' \
              -H "x-santo-infra-smoke-token: ${INFRA_SMOKE_TOKEN}" \
              "${WORKER_URL}/__infra/smoke" || true)"
            if jq -e '.service == "santo-api" and .status == "ok"' <<<"$health" >/dev/null 2>&1 && \
              [[ "$smoke_status" == "200" ]] && \
              jq -e '.environment == "staging" and .bindings.controlDatabase == "ok"' /tmp/p3-smoke.json >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          jq -e '.service == "santo-api" and .status == "ok"' <<<"$health" >/dev/null
          test "$smoke_status" = "200"
          jq -e '.environment == "staging" and .bindings.controlDatabase == "ok"' /tmp/p3-smoke.json >/dev/null

      - name: Create real P2 tenant fixtures
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: node scripts/p2-live-acceptance.mjs verify

      - name: Verify P3 server credentials live
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: node scripts/p3-live-acceptance.mjs verify

      - name: Verify P3 credential persistence and audit evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/p3-assertions.sql
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync(process.env.P3_CREDENTIAL_STATE_PATH, 'utf8'));
          const fields = [
            state.medparkTenantId,
            state.issued?.id,
            state.issued?.prefix,
            state.issued?.hash,
            state.rotated?.id,
            state.rotated?.prefix,
            state.rotated?.hash,
          ];
          for (const value of fields) {
            if (typeof value !== 'string' || !/^[A-Za-z0-9_-]+$/.test(value)) {
              throw new Error('Unsafe P3 state value for SQL assertion');
            }
          }
          const q = (value) => `'${value}'`;
          console.log(`SELECT id, tenant_id, key_prefix, secret_hash, status, last_used_at, revoked_at, rotated_from_id FROM tenant_credentials WHERE id IN (${q(state.issued.id)}, ${q(state.rotated.id)}) ORDER BY created_at;`);
          console.log(`SELECT action, COUNT(*) AS count FROM tenant_security_audit WHERE tenant_id = ${q(state.medparkTenantId)} GROUP BY action ORDER BY action;`);
          console.log(`SELECT domain FROM tenant_allowed_domains WHERE tenant_id = ${q(state.medparkTenantId)} ORDER BY domain;`);
          NODE
          cd workers/api
          pnpm exec wrangler d1 execute CONTROL_DB --env staging --remote --json --file /tmp/p3-assertions.sql > /tmp/p3-db-evidence.json
          cd ../..
          node <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync(process.env.P3_CREDENTIAL_STATE_PATH, 'utf8'));
          const payload = JSON.parse(fs.readFileSync('/tmp/p3-db-evidence.json', 'utf8'));
          const resultSets = payload.map((entry) => entry?.results ?? entry?.result?.results ?? []);
          if (resultSets.length < 3) throw new Error('P3 D1 evidence is missing result sets');
          const credentials = resultSets[0];
          const audits = resultSets[1];
          const domains = resultSets[2];
          if (credentials.length !== 2) throw new Error(`Expected 2 credential rows, got ${credentials.length}`);
          const byId = new Map(credentials.map((row) => [row.id, row]));
          const issued = byId.get(state.issued.id);
          const rotated = byId.get(state.rotated.id);
          if (!issued || !rotated) throw new Error('Expected credential rows were not found');
          if (issued.secret_hash !== state.issued.hash || issued.key_prefix !== state.issued.prefix) {
            throw new Error('Issued credential hash/prefix does not match the one-time secret');
          }
          if (rotated.secret_hash !== state.rotated.hash || rotated.key_prefix !== state.rotated.prefix) {
            throw new Error('Rotated credential hash/prefix does not match the one-time secret');
          }
          if (issued.status !== 'revoked' || rotated.status !== 'revoked') {
            throw new Error('Rotation/revocation state was not persisted');
          }
          if (!issued.last_used_at || !rotated.last_used_at) {
            throw new Error('last_used_at was not recorded for authenticated credentials');
          }
          if (rotated.rotated_from_id !== issued.id) {
            throw new Error('Rotation lineage was not persisted');
          }
          for (const row of credentials) {
            if (Object.values(row).some((value) => typeof value === 'string' && value.startsWith('santo_sk_'))) {
              throw new Error('Plaintext server secret was persisted in D1');
            }
          }
          const auditCounts = new Map(audits.map((row) => [row.action, Number(row.count)]));
          for (const action of ['credential.created', 'credential.rotated', 'credential.revoked', 'domains.updated']) {
            if (auditCounts.get(action) !== 1) throw new Error(`Expected one ${action} audit event`);
          }
          const domainValues = domains.map((row) => row.domain);
          if (JSON.stringify(domainValues) !== JSON.stringify(['app.medpark.com', 'medpark.com'])) {
            throw new Error('Allowed domains were not persisted as expected');
          }
          console.log('Remote D1 hash-only credential storage, last_used_at, domains, rotation, revocation, and audit evidence verified.');
          NODE

      - name: Record P3 staging summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          {
            echo "## P3 staging acceptance"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Worker: \`${WORKER_URL}\`"
            echo "- D1 migration 0003: applied"
            echo "- Remote P3 tables: verified"
            echo "- Real WorkOS-backed MedPark owner: verified"
            echo "- Server-secret issue/auth/isolation: passed"
            echo "- Rotation and revocation: passed"
            echo "- Allowed domains: passed"
            echo "- Hash-only D1 persistence: passed"
            echo "- last_used_at and security audit trail: passed"
            echo "- Plaintext secrets: masked and absent from persisted evidence"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Santo staging fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$P2_WORKOS_STATE_PATH" ]]; then
            exit 0
          fi
          node scripts/p2-live-acceptance.mjs cleanup-sql > /tmp/p3-cleanup.sql
          if [[ -s /tmp/p3-cleanup.sql ]]; then
            cd workers/api
            pnpm exec wrangler d1 execute CONTROL_DB --env staging --remote --file /tmp/p3-cleanup.sql
          fi

      - name: Cleanup WorkOS staging fixtures
        if: always()
        shell: bash
        run: node scripts/p2-live-acceptance.mjs cleanup-workos

      - name: Remove P3 staging state
        if: always()
        shell: bash
        run: rm -f "$P2_WORKOS_STATE_PATH" "$P3_CREDENTIAL_STATE_PATH" /tmp/p3-cleanup.sql /tmp/p3-secrets.json /tmp/p3-assertions.sql /tmp/p3-db-evidence.json
