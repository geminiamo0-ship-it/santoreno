name: P4 Harness Prettier Fix

on:
  push:
    branches:
      - feat/issue-5-session-exchange

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-5-session-exchange
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format P4 live harness
        run: pnpm exec prettier --write scripts/p4-live-acceptance.mjs
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p4-live-acceptance.mjs
          git commit -m "style: format P4 live acceptance harness"
          git push origin HEAD:feat/issue-5-session-exchange
