name: Temporary PROJECT_STATUS formatter

on:
  push:
    branches:
      - docs/activate-grounded-ai-slice

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/activate-grounded-ai-slice
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write PROJECT_STATUS.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- PROJECT_STATUS.md; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "docs: format PROJECT_STATUS"
          git push origin HEAD:docs/activate-grounded-ai-slice
