name: Temporary Santo Copilot Prettier
on:
  push:
    branches: [feat/91-royal-style-santo-copilot]
    paths: [".github/workflows/santo-copilot-format-once.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format feature changes with repository's pinned Prettier and commit
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            packages/contracts/src/ai.test.ts \
            packages/contracts/src/ai.ts \
            packages/widget/src/index.ts \
            packages/widget/src/medical-markdown.ts \
            packages/widget/src/medical-markdown.test.ts \
            packages/widget/src/styles.ts \
            workers/api/src/ai/handler.test.ts \
            workers/api/src/ai/prompt.ts \
            workers/api/src/ai/service.ts \
            workers/api/src/ai/model.ts \
            workers/api/src/ai/handler.ts \
            workers/api/src/runtime/bindings.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/contracts/src/ai* packages/widget/src workers/api/src/ai workers/api/src/runtime/bindings.ts
            git commit -m "style(santo): format Royal-parity copilot and fallback implementation"
            git push origin HEAD:refs/heads/feat/91-royal-style-santo-copilot
          fi
