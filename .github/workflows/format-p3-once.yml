name: Format P3 Once

on:
  push:
    branches:
      - feat/issue-4-server-credentials

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-4-server-credentials

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format P3 files
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            workers/api/src/app.ts \
            workers/api/src/credentials/repository.ts \
            workers/api/src/credentials/service.ts

      - name: Commit formatting if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "P3 files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/api/src/app.ts workers/api/src/credentials/repository.ts workers/api/src/credentials/service.ts
          git commit -m "style: format P3 credential files"
          git push origin HEAD:feat/issue-4-server-credentials
