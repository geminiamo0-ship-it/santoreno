name: P5 Format

on:
  push:
    branches:
      - feat/issue-6-atomic-quota
    paths:
      - .github/workflows/p5-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/issue-6-atomic-quota

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove unused import and format P5 files
        run: |
          sed -i '/type QuotaConfigureRequest,/d' workers/api/src/durable-objects/tenant-meter-core.ts
          pnpm exec prettier --write \
            packages/contracts/src/index.ts \
            workers/api/src/durable-objects/tenant-meter-core.ts \
            workers/api/src/durable-objects/tenant-meter.ts \
            workers/api/src/infrastructure/smoke.ts

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/src/index.ts \
            workers/api/src/durable-objects/tenant-meter-core.ts \
            workers/api/src/durable-objects/tenant-meter.ts \
            workers/api/src/infrastructure/smoke.ts
          if git diff --cached --quiet; then
            echo "No formatter changes needed"
          else
            git commit -m "style: format P5 quota core"
            git push origin HEAD:feat/issue-6-atomic-quota
          fi
