name: Temporary Project Status Formatter

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-format-project-status.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write PROJECT_STATUS.md
      - name: Commit formatted handoff and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git rm .github/workflows/temp-format-project-status.yml
          git commit -m "style: format Phase 7 project handoff"
          git push origin HEAD:main
