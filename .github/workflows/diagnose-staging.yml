name: Diagnose Staging

on:
  push:
    branches:
      - infra/issue-2-staging-provision
    paths:
      - .github/workflows/diagnose-staging.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect staging responses
        shell: bash
        run: |
          set -euo pipefail
          base="https://santo-api-staging.geminiamo0.workers.dev"
          for path in / /health; do
            echo "=== ${path} ==="
            curl --silent --show-error --dump-header - --output /tmp/body --write-out '\nHTTP_STATUS=%{http_code}\n' "${base}${path}" || true
            echo "--- body ---"
            cat /tmp/body
            echo
          done
