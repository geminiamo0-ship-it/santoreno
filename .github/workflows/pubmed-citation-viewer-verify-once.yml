name: Verify Internal PubMed Citation Viewer (No Deploy)
on:
  push:
    branches: [fix/pubmed-citation-internal-viewer-20261020]
    paths: [.github/workflows/pubmed-citation-viewer-verify-once.yml]
permissions:
  contents: write
jobs:
  verify-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format code changes only; never format workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write workers/api/src/library/research-article.ts workers/api/src/library/research-article.test.ts workers/api/src/library/handler.ts workers/api/src/index.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/api/src/library/research-article.ts workers/api/src/library/research-article.test.ts workers/api/src/library/handler.ts workers/api/src/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(research): format standalone PubMed article reader"
            git push origin HEAD:fix/pubmed-citation-internal-viewer-20261020
          fi
      - name: Verify Luna, Libraries and citation authorization tests
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pubmed-citation-viewer-verify-once.yml
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
          echo "CI verified. Staging and Production were not changed." >> "$GITHUB_STEP_SUMMARY"
