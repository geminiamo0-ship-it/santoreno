name: Santo Production AI Search and Auth Preflight
on:
  push:
    branches: [release/santo-medical-rich-prod-candidate-20261014]
    paths: [.github/workflows/santo-prod-index-secret-audit-once.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify production AI Search instance source, availability, and Worker secret names
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          code="$(curl -sS -o "$RUNNER_TEMP/instances.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/ai-search/namespaces/default/instances")"
          echo "AI_SEARCH_READ_HTTP=$code"
          python - <<'PY'
          import json,os,pathlib
          data=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'instances.json').read_text())
          instances=data.get('result') or []
          if not isinstance(instances,list):instances=[]
          wanted={'amboss','usmle','passmedicine','pastest','one-examination','one-examination-isolated'}
          for item in instances:
              if item.get('id') not in wanted:continue
              params=item.get('source_params') or {}
              print('AI_SEARCH_INSTANCE',item.get('id'),
                    'bucket=',item.get('source'),
                    'type=',item.get('type'),
                    'include=',params.get('include_items'))
          missing=wanted-set(x.get('id') for x in instances)
          print('AI_SEARCH_REQUIRED_INSTANCE_MISSING',sorted(missing))
          PY
          cd workers/api
          pnpm exec wrangler secret list --env production > "$RUNNER_TEMP/secret-names.json" 2>&1 || {
            echo 'Unable to list Worker secrets metadata'; tail -10 "$RUNNER_TEMP/secret-names.json"; exit 1;
          }
          python - <<'PY'
          import json,os,pathlib
          s=(pathlib.Path(os.environ['RUNNER_TEMP'])/'secret-names.json').read_text()
          try:
              start=s.index('[');end=s.rindex(']')+1
              names={x.get('name') for x in json.loads(s[start:end])}
          except Exception:
              print('WORKER_SECRET_LIST_UNPARSEABLE; no values printed')
              names=set()
          for key in ('SANTO_SESSION_SIGNING_KEY','WORKOS_CLIENT_ID','WORKOS_ISSUER','INFRA_SMOKE_TOKEN'):
              print('PRODUCTION_WORKER_SECRET_PRESENT',key, key in names)
          PY
      - if: always()
        run: rm -f "$RUNNER_TEMP/instances.json" "$RUNNER_TEMP/secret-names.json"
