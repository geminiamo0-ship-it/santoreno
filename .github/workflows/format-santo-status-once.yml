name: Format Santo status once

on:
  push:
    branches:
      - release/santo-medical-rich-prod-candidate-20261014
    paths:
      - .github/workflows/format-santo-status-once.yml

permissions:
  contents: write

jobs:
  format-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format project status
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write PROJECT_STATUS.md
          if ! git diff --quiet -- PROJECT_STATUS.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PROJECT_STATUS.md
            git commit -m "style(santo): apply canonical Prettier to project status"
            git push origin HEAD:refs/heads/release/santo-medical-rich-prod-candidate-20261014
          fi
