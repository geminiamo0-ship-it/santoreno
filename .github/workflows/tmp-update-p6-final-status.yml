name: Temporary P6 final status updater

on:
  push:
    branches:
      - feat/issue-7-grounded-ai-slice

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-7-grounded-ai-slice

      - name: Record exact clean-head P6 evidence
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('PROJECT_STATUS.md')
          text = path.read_text()

          expected = {
              'b942d02f0f60872216d6a0ea7930cb3252c8f0a9': 3,
              '37296076550 (#241)': 2,
              '37296070167 (#19)': 2,
          }
          for value, minimum in expected.items():
              if text.count(value) < minimum:
                  raise SystemExit(f'Expected at least {minimum} occurrences of {value!r}')

          text = text.replace(
              'b942d02f0f60872216d6a0ea7930cb3252c8f0a9',
              'fae800b04acf0a871310af086b11d496c87f8742',
          )
          text = text.replace('37296076550 (#241)', '37297555868 (#246)')
          text = text.replace('37296070167 (#19)', '37297549764 (#23)')
          text = text.replace('PR #25 clean candidate head', 'PR #25 clean implementation head')
          text = text.replace('Exact clean candidate', 'Exact clean implementation head')
          text = text.replace('Clean pre-doc candidate', 'Clean implementation head')

          path.write_text(text)
          PY

      - name: Remove updater and commit final handoff evidence
        run: |
          git rm .github/workflows/tmp-update-p6-final-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "docs: record final clean-head P6 evidence"
          git push origin HEAD:feat/issue-7-grounded-ai-slice
