name: Santo Research Worker Network Probe (One-Time)
on:
  push:
    branches: [feat/pubmed-research-mode-203]
    paths: [.github/workflows/research-worker-netprobe-once.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test biomedical APIs FROM Cloudflare Workers (not the GitHub runner)
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          PROBE_KEY="$(openssl rand -hex 24)"
          cat > workers/api/src/__research_netprobe_temp.mjs <<'JS'
          export default {
            async fetch(req, env) {
              if (req.headers.get("x-santo-probe") !== env.PROBE_KEY) return new Response("Not Found", {status: 404});
              const targets = [
                ["ncbi_search", "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=aortic%20stenosis&retmax=5&retmode=json&sort=relevance"],
                ["ncbi_fetch", "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=24623284&retmode=xml"],
                ["europe_pmc", "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=aortic%20stenosis&format=json&resultType=core&pageSize=5"],
                ["openalex", "https://api.openalex.org/works?filter=doi:10.1038/nature12373&per_page=1"]
              ];
              const probes = await Promise.all(targets.map(async ([name,url])=>{
                const started=Date.now();
                try {
                  const response=await fetch(url,{signal:AbortSignal.timeout(9500),headers:{accept:"application/json, application/xml"}});
                  const payload=await response.text();
                  let recognized=null;
                  if(name==="ncbi_search" && response.ok) {
                    try {const root=JSON.parse(payload);recognized=Array.isArray(root.esearchresult?.idlist)?root.esearchresult.idlist.length:"invalid_json"} catch {recognized="invalid_json"}
                  }
                  if(name==="europe_pmc" && response.ok) {
                    try {const root=JSON.parse(payload);recognized=Array.isArray(root.resultList?.result)?root.resultList.result.length:"invalid_json"} catch {recognized="invalid_json"}
                  }
                  return {name,http:response.status,elapsedMs:Date.now()-started,bytes:payload.length,recognized,edge:response.headers.get("cf-ray")?"cloudflare":null};
                }catch(e){return{name,http:null,elapsedMs:Date.now()-started,errorName:e?.name??"unknown",errorMessage:String(e?.message??e).slice(0,160)}}
              }));
              return Response.json({probes},{headers:{"Cache-Control":"no-store"}});
            }
          };
          JS
          cat > workers/api/research-netprobe.wrangler.toml <<'TOML'
          name = "santo-research-netprobe"
          main = "src/__research_netprobe_temp.mjs"
          compatibility_date = "2026-10-01"
          workers_dev = true
          TOML
          cd workers/api
          # --remote executes the script in Cloudflare's actual Worker runtime,
          # but exposes the probe ONLY on GitHub Actions loopback.
          pnpm exec wrangler dev --remote --config research-netprobe.wrangler.toml \
            --ip 127.0.0.1 --port 8787 --var "PROBE_KEY:$PROBE_KEY" \
            > /tmp/santo-research-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 35); do
            if curl --fail --silent --max-time 3 -H "x-santo-probe: $PROBE_KEY" \
                 "http://127.0.0.1:8787/" > /tmp/santo-research-probe.json; then
              jq . /tmp/santo-research-probe.json
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              tail -35 /tmp/santo-research-dev.log
              exit 1
            fi
            sleep 2
          done
          tail -45 /tmp/santo-research-dev.log
          exit 1
