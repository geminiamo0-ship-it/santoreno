name: Santo Isolated Medical Search Readiness
on:
  push:
    branches: [fix/90-medical-r2-isolated-search-pilot]
    paths: [".github/workflows/isolated-search-readiness.yml"]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect fresh physically isolated index without writes
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          base=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/ai-search/namespaces/default/instances/one-examination-isolated"
          head={"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"]}
          for path in ("","/stats","/jobs","/items?per_page=10&page=1"):
            try:
              with urlopen(Request(base+path,headers=head),timeout=40) as r:
                payload=json.load(r)
                if not payload.get("success"):raise RuntimeError("CF unsuccessful")
                value=payload.get("result")
                if path=="":
                  print("PILOT",value.get("id"),"bucket",value.get("source"),"type",value.get("type"))
                elif path=="/stats":
                  print("STATS",json.dumps({k:value.get(k) for k in ("completed","queued","running","error","skipped")}))
                elif path=="/jobs":
                  print("JOBS",[(x.get("id"),x.get("started_at"),x.get("ended_at")) for x in value[:3]])
                elif path.startswith("/items"):
                  print("SAMPLE_KEYS",[x.get("key") for x in value[:10]])
            except HTTPError as e:
              print("NOT_READY_YET",path,e.code)
          PY
