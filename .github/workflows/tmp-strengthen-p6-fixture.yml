name: Temporary P6 fixture updater

on:
  push:
    branches:
      - feat/issue-7-grounded-ai-slice

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-7-grounded-ai-slice
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Make P6 fixture deterministic and diagnostics safe
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/p6-live-acceptance.mjs')
          s = p.read_text()
          old_fixture = '  "The synthetic verification dose is exactly 17 micro-units.",'
          new_fixture = '  "According to the Santo P6 grounding acceptance fixture, the synthetic verification dose specified is exactly 17 micro-units.",'
          old_error = '  expect(first.status === 200, `Grounded AI request returned HTTP ${first.status}`);'
          new_error = '  expect(\n    first.status === 200,\n    `Grounded AI request returned HTTP ${first.status} (${String(first.body?.error ?? "unknown")})`,\n  );'
          if old_fixture not in s:
              raise SystemExit('expected fixture line not found')
          if old_error not in s:
              raise SystemExit('expected error line not found')
          s = s.replace(old_fixture, new_fixture, 1).replace(old_error, new_error, 1)
          p.write_text(s)
          PY
      - run: pnpm exec prettier --write scripts/p6-live-acceptance.mjs
      - name: Commit update if needed
        run: |
          if git diff --quiet -- scripts/p6-live-acceptance.mjs; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p6-live-acceptance.mjs
          git commit -m "test(ai): make P6 fixture retrieval deterministic"
          git push origin HEAD:feat/issue-7-grounded-ai-slice
