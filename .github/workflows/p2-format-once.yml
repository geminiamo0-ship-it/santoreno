# Temporary branch-only formatter. Remove immediately after it commits exact Prettier output.
name: P2 Format Once

on:
  push:
    branches:
      - feat/issue-3-tenant-auth
    paths:
      - scripts/p2-live-acceptance.mjs
      - .github/workflows/p2-format-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-3-tenant-auth

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier rules
        run: pnpm exec prettier scripts/p2-live-acceptance.mjs --write

      - name: Commit exact formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/p2-live-acceptance.mjs; then
            echo "No formatting changes required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p2-live-acceptance.mjs
          git commit -m "style: apply exact Prettier output"
          git push origin HEAD:feat/issue-3-tenant-auth
