name: One-Time Santo Rich Reader Format
on:
  push:
    branches: [feat/96-rich-reader-widget]
    paths: [.github/workflows/rich-reader-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/96-rich-reader-widget
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/widget/src/article-rich-html.ts packages/widget/src/article-rich-html.test.ts packages/widget/src/index.ts packages/contracts/src/library-reader.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/widget/src/article-rich-html.ts packages/widget/src/article-rich-html.test.ts packages/widget/src/index.ts packages/contracts/src/library-reader.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(widget): format gzip reader"
            git push origin HEAD:feat/96-rich-reader-widget
          fi
