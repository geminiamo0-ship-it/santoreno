name: Temporary Format AnKing Find More
on:
  push:
    branches:
      - feat/anking-card-data-viewer-20261018
    paths:
      - .github/workflows/anking-findmore-format-temp.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format only affected worker files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write workers/api/src/ai/anking-flashcards.ts workers/api/src/ai/anking-topic-finder.ts workers/api/src/ai/anking-topic-handler.ts workers/api/src/ai/anking-topic-finder.test.ts
          git add workers/api/src/ai/anking-flashcards.ts workers/api/src/ai/anking-topic-finder.ts workers/api/src/ai/anking-topic-handler.ts workers/api/src/ai/anking-topic-finder.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "style(anking): format R2 Find More endpoint and tests"
          git push origin HEAD:feat/anking-card-data-viewer-20261018
