name: Emit Prettier-Formatted Santo Index YAML
on:
  push:
    branches: [fix/92-santo-isolated-source-repoint]
    paths: [".github/workflows/print-medical-index-formatted-yaml.yml"]
permissions: {contents: read}
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Produce verified Prettier-formatted workflow texts
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          for f in .github/workflows/recreate-empty-usmle-isolated.yml .github/workflows/recreate-empty-amboss-passmedicine.yml .github/workflows/recreate-empty-pastest.yml; do
            pnpm exec prettier --write "$f" > /dev/null
            pnpm exec prettier --check "$f" > /dev/null
            echo "YAML_BEGIN:$f"
            base64 --wrap=0 "$f"
            echo
            echo "YAML_END:$f"
          done
