name: Temporary P6 fixture ID alignment

on:
  push:
    branches:
      - feat/issue-7-grounded-ai-slice

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-7-grounded-ai-slice
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Align isolated fixture ID between harness and Worker
        run: |
          python <<'PY'
          from pathlib import Path

          script_path = Path('scripts/p6-live-acceptance.mjs')
          script = script_path.read_text()
          old = 'body: { tenantId, externalUserId: EXTERNAL_USER_ID },'
          new = 'body: { tenantId, externalUserId: EXTERNAL_USER_ID, fixtureInstanceId: FIXTURE_INSTANCE_ID },'
          assert script.count(old) == 1, 'unexpected P6 setup request shape'
          script_path.write_text(script.replace(old, new, 1))

          runtime_path = Path('workers/api/src/infrastructure/p6-grounded-ai-acceptance.ts')
          runtime = runtime_path.read_text()

          replacements = [
              (
                  'const FIXTURE_INSTANCE_ID = "santo-p6-grounding-acceptance";',
                  'const FIXTURE_INSTANCE_ID_PATTERN = /^santo-p6-grounding-[0-9a-f]{12}$/;',
              ),
              (
                  'async function fixtureIsVisible(namespace: AiSearchNamespaceLike): Promise<boolean> {',
                  'async function fixtureIsVisible(\n  namespace: AiSearchNamespaceLike,\n  fixtureInstanceId: string,\n): Promise<boolean> {',
              ),
              (
                  'return listed.result.some((entry) => asRecord(entry)?.id === FIXTURE_INSTANCE_ID);',
                  'return listed.result.some((entry) => asRecord(entry)?.id === fixtureInstanceId);',
              ),
              (
                  '  const externalUserId = payload?.externalUserId;\n  if (',
                  '  const externalUserId = payload?.externalUserId;\n  const fixtureInstanceId = payload?.fixtureInstanceId;\n  if (',
              ),
              (
                  '    !isUuid(tenantId) ||\n    typeof externalUserId !== "string" ||',
                  '    !isUuid(tenantId) ||\n    typeof externalUserId !== "string" ||\n    typeof fixtureInstanceId !== "string" ||\n    !FIXTURE_INSTANCE_ID_PATTERN.test(fixtureInstanceId) ||',
              ),
              (
                  '    if (!(await fixtureIsVisible(env.AI_SEARCH))) {',
                  '    if (!(await fixtureIsVisible(env.AI_SEARCH, fixtureInstanceId))) {',
              ),
              (
                  '      instanceId: FIXTURE_INSTANCE_ID,',
                  '      instanceId: fixtureInstanceId,',
              ),
          ]

          for old_text, new_text in replacements:
              assert runtime.count(old_text) == 1, f'unexpected P6 runtime shape for: {old_text[:60]}'
              runtime = runtime.replace(old_text, new_text, 1)

          runtime_path.write_text(runtime)
          PY
          pnpm exec prettier --write scripts/p6-live-acceptance.mjs workers/api/src/infrastructure/p6-grounded-ai-acceptance.ts
      - name: Commit alignment
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p6-live-acceptance.mjs workers/api/src/infrastructure/p6-grounded-ai-acceptance.ts
          git diff --cached --quiet && { echo "No alignment change needed"; exit 0; }
          git commit -m "fix(ai): align isolated P6 fixture ID"
          git push origin HEAD:feat/issue-7-grounded-ai-slice
