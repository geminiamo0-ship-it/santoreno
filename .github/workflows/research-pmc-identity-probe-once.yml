name: Read-Only PMC JATS Identity Probe v2 (NO DEPLOY)

on:
  push:
    branches:
      - fix/research-pmc-fulltext-priority-20261021
    paths:
      - .github/workflows/research-pmc-identity-probe-once.yml

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect only public PMC XML metadata from both original providers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          python scripts/smoke_research_pmc_fulltext_staging.py > /tmp/pmc_identity.log 2>&1 || true
          {
            echo "Read-only PMC XML identity diagnostic (no deployment, no private content):"
            echo '~~~'
            tail -n 22 /tmp/pmc_identity.log
            echo '~~~'
          } > /tmp/pmc_identity_comment.md
          gh issue comment 203 --repo geminiamo0-ship-it/santoreno --body-file /tmp/pmc_identity_comment.md
