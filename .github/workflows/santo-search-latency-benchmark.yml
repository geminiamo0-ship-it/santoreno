name: Benchmark Seven-Index Santo Search Latency — Read Only
on:
  push:
    branches:
      - fix/santo-search-timeout-benchmark-staging-20261019
    paths:
      - .github/workflows/santo-search-latency-benchmark.yml
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure real Cloudflare catalog and three native 7-index no-reranker configurations across four medical topics
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          python3 scripts/benchmark_santo_one_search_staging.py
          echo "Read-only timing probes finished. No Worker deployed; Production unchanged." >> "$GITHUB_STEP_SUMMARY"
