name: Print formatted AnKing full staging workflow
on:
  push:
    branches:
      - feat/anking-cardiology-suggestions-staging-20261018
    paths:
      - .github/workflows/anking-full-format-temp.yml
permissions:
  contents: read
jobs:
  format-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Emit Prettier version, no repository writes
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write .github/workflows/anking-full-staging-ingest.yml >/dev/null
          echo "FORMATTED_FULL_YAML_BEGIN"
          base64 -w0 .github/workflows/anking-full-staging-ingest.yml
          echo
          echo "FORMATTED_FULL_YAML_END"
