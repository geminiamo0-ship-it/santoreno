name: Santo Qwen Planner Live Cloudflare Probe (NO DEPLOY)
on:
  push:
    branches:
      - feat/qwen-medical-search-planner-20261021
    paths:
      - .github/workflows/santo-qwen-planner-live-probe-once.yml
permissions:
  contents: read
  issues: write
concurrency:
  group: santo-qwen-planner-live-20261021
  cancel-in-progress: true
jobs:
  live-provider-smoke:
    if: github.repository == 'geminiamo0-ship-it/santoreno'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate credentials and test original Cloudflare Qwen / seven indexes
        id: live
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          python -u scripts/smoke_santo_qwen_search_planner_staging.py > /tmp/qwen_live.log 2>&1 || {
            cat /tmp/qwen_live.log
            exit 1
          }
          cat /tmp/qwen_live.log
      - name: Report read-only live test result to Issue 209
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
          LIVE_RESULT: ${{ steps.live.outcome }}
        run: |
          {
            echo "Live Qwen medical Search Planner candidate SHA $(git rev-parse HEAD): job=$JOB_RESULT; qwen_and_7_index_probe=$LIVE_RESULT."
            echo '~~~'
            tail -n 18 /tmp/qwen_live.log 2>/dev/null || echo "Probe did not produce a log"
            echo '~~~'
            echo "READ ONLY: no Staging or Production deployment; no student data or Santo quota consumed."
          } > /tmp/qwen_live_issue.md
          gh issue comment 209 --repo geminiamo0-ship-it/santoreno --body-file /tmp/qwen_live_issue.md
