name: Verify Luna Failure Reasons and Error Codes Once
on:
  push:
    branches:
      - fix/staging-luna-incomplete-reason-20261015
    paths:
      - .github/workflows/verify-luna-failure-reasons-once.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Format safe diagnostics and targeted regressions
        run: |
          set -euo pipefail
          pnpm exec prettier --write workers/api/src/ai/model.ts workers/api/src/ai/luna-event-stream.ts workers/api/src/ai/luna-event-stream.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/api/src/ai
            git commit -m "style(ai): format Luna incomplete-output diagnostics"
            git push origin HEAD:refs/heads/fix/staging-luna-incomplete-reason-20261015
          fi
      - name: Verify full Santo repository
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
