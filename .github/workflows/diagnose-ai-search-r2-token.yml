name: Diagnose Santo AI Search Service Token and Real R2 Object
on:
  push:
    branches: [diagnose/ai-search-r2-zero-files-20261014]
    paths: [".github/workflows/diagnose-ai-search-r2-token.yml"]
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify service token binding (never show token IDs or secrets)
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"];token=os.environ["CLOUDFLARE_API_TOKEN"]
          root=f"https://api.cloudflare.com/client/v4/accounts/{account}/ai-search"
          def get(url):
              try:
                  with urlopen(Request(url,headers={"Authorization":"Bearer "+token}),timeout=35) as res:
                      data=json.load(res)
                      return data.get("result") if data.get("success") else {"err":"response unsuccessful"}
              except HTTPError as e: return {"http":e.code}
          tokens=get(root+"/tokens")
          print("TOKENS_RESPONSE", type(tokens).__name__, "count",len(tokens) if isinstance(tokens,list) else str(tokens)[:120])
          for lib in ("amboss","usmle","passmedicine","pastest","one-examination"):
              inst=get(root+"/namespaces/default/instances/"+lib)
              token_id=inst.get("token_id") if isinstance(inst,dict) else None
              match=[t for t in tokens if isinstance(t,dict) and t.get("id")==token_id] if isinstance(tokens,list) else []
              print("SERVICE_TOKEN",lib,"configured",bool(token_id),"registered",bool(match),
                    "enabled",match[0].get("enabled") if match else None)
          PY
      - name: Read actual R2 catalog and a known real Markdown search object
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          cd workers/api
          d="$RUNNER_TEMP"
          pnpm exec wrangler r2 object get santo-content-staging/medical-library-catalog/v1/one-examination.json --remote --file="$d/listing.json" >/dev/null
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ["RUNNER_TEMP"],"listing.json")
          a=json.load(open(p))
          item=a["articles"][0]
          print("REAL_ARTICLE",item["id"],"LISTING_COUNT",len(a["articles"]))
          with open(os.path.join(os.environ["RUNNER_TEMP"],"article-id"),"w") as f:f.write(item["id"])
          PY
          id="$(cat "$d/article-id")"
          key="medical-search/v1/one-examination/$id/s-0001.md"
          pnpm exec wrangler r2 object get "santo-content-staging/$key" --remote --file="$d/section.md" >/dev/null
          echo "REAL_R2_MARKDOWN_READABLE=true key=$key bytes=$(wc -c < "$d/section.md")"
