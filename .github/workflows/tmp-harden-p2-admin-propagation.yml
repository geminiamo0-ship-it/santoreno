name: Temporary P2 admin propagation hardener

on:
  push:
    branches:
      - feat/issue-7-grounded-ai-slice

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-7-grounded-ai-slice
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Add bounded propagation retry
        run: |
          echo '' | base64 -d > /tmp/patch-p2.py
          python /tmp/patch-p2.py
          pnpm exec prettier --write scripts/p2-live-acceptance.mjs
      - name: Commit hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p2-live-acceptance.mjs
          git diff --cached --quiet && { echo "No hardening change needed"; exit 0; }
          git commit -m "fix(ci): tolerate Worker auth propagation"
          git push origin HEAD:feat/issue-7-grounded-ai-slice
