name: Professor Teaching Staging Deploy

# Verified staging-only rollout: private citation aliases with server-side verified source mapping.
# Ordinary main commits do not redeploy staging; manual reruns remain possible.
on:
  push:
    branches:
      - main
      - release/santo-medical-rich-prod-candidate-20261014
    paths:
      - .github/workflows/professor-teaching-staging-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: santo-pilot-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Verify on exact staging commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")"
            policy="$(jq -r '[.check_runs[] | select(.name == "repository-policy") | .conclusion] | map(select(. != null)) | .[0] // ""' <<<"$checks")"
            quality="$(jq -r '[.check_runs[] | select(.name == "code-quality") | .conclusion] | map(select(. != null)) | .[0] // ""' <<<"$checks")"
            if [[ "$policy" == "success" && "$quality" == "success" ]]; then
              echo "Verify green on ${GITHUB_SHA}"
              exit 0
            fi
            for state in "$policy" "$quality"; do
              case "$state" in
                failure|cancelled|timed_out|action_required|startup_failure|stale)
                  echo "Verify failed: repository-policy=${policy}, code-quality=${quality}"; exit 1;;
              esac
            done
            sleep 10
          done
          echo "Verify timed out"; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Deploy Santo Staging Worker with existing secrets and variables
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars

      - name: Health and unauthenticated-grounded-AI deny smoke
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$WORKER_URL/health")"
          jq -e '.service == "santo-api" and .status == "ok"' <<<"$health" > /dev/null
          html="$(curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$WORKER_URL/pilot/credentials")"
          grep -q 'Generate API Key' <<<"$html"
          grep -q 'Initialize Tenant Quota' <<<"$html"
          grep -q 'Find my Tenant ID' <<<"$html"
          config="$(curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$WORKER_URL/pilot/credentials/config")"
          jq -e '.clientId | strings | startswith("client_")' <<<"$config" > /dev/null
          code="$(curl --retry 5 --retry-delay 2 --silent --show-error --output /dev/null --write-out '%{http_code}' -X POST "$WORKER_URL/v1/ai/query" -H 'content-type: application/json' --data '{"query":"Explain heart failure","idempotency_key":"professor-staging-no-auth"}')"
          if [[ "$code" != '401' ]]; then
            echo "Unauthenticated AI path expected 401, got $code"; exit 1
          fi
          echo 'Staging health, pilot console and unauthenticated protection passed.'
          {
            echo '## Professor-grade teaching: Staging-only deployment'
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Worker: \`${WORKER_URL}\`"
            echo '- Existing secrets/vars preserved; production untouched'
            echo '- Health, console and unauthenticated access: passed'
            echo '- Real sourced medical-answer quality remains unverified until licensed corpus evaluation'
          } >> "$GITHUB_STEP_SUMMARY"
