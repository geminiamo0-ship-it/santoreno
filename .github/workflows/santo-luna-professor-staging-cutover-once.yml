name: Santo Luna + Professor Staging Cutover

on:
  push:
    branches: [feat/96-luna-fallback-professor-final-20261015]
    paths: [.github/workflows/santo-luna-professor-staging-cutover-once.yml]

permissions:
  contents: read

concurrency:
  group: santo-pilot-staging-deploy
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify exact source before staging deployment
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
          python -m unittest discover -s scripts -p 'test_medical_library_import.py'
          echo 'MODEL_FALLBACK_AND_PROMPT_BOUNDARY_TESTS_PASSED=true'
      - name: Funded Luna strict JSON live compatibility gate (no customer data)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" && test -n "${CLOUDFLARE_API_TOKEN:-}"
          cat > "$RUNNER_TEMP/luna-req.json" <<'JSON'
          {
            "model":"openai/gpt-6-luna",
            "input":"Synthetic medical education smoke: give one simple sentence saying which organ pumps blood. Cite no source.",
            "instructions":"For this synthetic uncited check return only JSON in the requested format.",
            "max_output_tokens":256,
            "reasoning":{"effort":"none"},
            "service_tier":"fast",
            "store":false,
            "text":{"format":{"type":"json_schema","name":"santo_grounded","strict":true,"schema":{"type":"object","properties":{"answer":{"type":"string"},"citation_ids":{"type":"array","items":{"type":"string"},"maxItems":5}},"required":["answer","citation_ids"],"additionalProperties":false}}}
          }
          JSON
          status="$(curl --silent --show-error --max-time 100 -o "$RUNNER_TEMP/luna-resp.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/luna-req.json" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/v1/responses")"
          echo "LUNA_PROVIDER_HTTP=$status"
          if [[ "$status" != "200" ]]; then
            jq -c '{error_type:(.error.type//.errors[0].code//"provider_unavailable")}' "$RUNNER_TEMP/luna-resp.json" || true
            exit 1
          fi
          jq -er '[.output[]? | select(.type=="message") | .content[]? | select(.type=="output_text") | .text] | first' "$RUNNER_TEMP/luna-resp.json" | jq -e '(.answer | type=="string") and (.citation_ids == [])' >/dev/null
          echo 'SYNTHETIC_LUNA_JSON_PASSED=true'
      - name: Deploy only existing Santo Staging Worker
        shell: bash
        run: |
          set -euo pipefail
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Smoke health and verified authentication perimeter
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            health="$(curl --silent --show-error "$WORKER_URL/health" || true)"
            if jq -e '.service=="santo-api" and .status=="ok"' <<<"$health" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          jq -e '.service=="santo-api" and .status=="ok"' <<<"$health" >/dev/null
          for path in /v1/libraries /v1/conversations/11111111-1111-4111-8111-111111111111/turns; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$WORKER_URL$path")"
            test "$status" = 401 || { echo "AUTH_PERIMETER_UNEXPECTED_STATUS=$status"; exit 1; }
          done
          printf 'STAGING_DEPLOY_SHA=%s\n' "$GITHUB_SHA"
          echo 'Live authenticated Royal chat, citation fidelity, native streaming, mobile QA require separate acceptance. Production Santo unchanged.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove synthetic request and output
        if: always()
        run: rm -f "$RUNNER_TEMP/luna-req.json" "$RUNNER_TEMP/luna-resp.json"
