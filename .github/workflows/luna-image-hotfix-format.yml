name: Format Luna Image Hotfix Branch
on:
  push:
    branches:
      - fix/luna-image-marker-visibility-diagnostics-20261016
permissions:
  contents: write
concurrency:
  group: luna-image-hotfix-format-once
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Prettier only changed files
        run: |
          pnpm exec prettier --write \
            workers/api/src/ai/plain-luna.ts \
            workers/api/src/ai/plain-luna.test.ts \
            workers/api/src/ai/medical-images.ts \
            workers/api/src/ai/service.ts \
            workers/api/src/ai/handler.test.ts \
            .github/workflows/luna-image-hotfix-format.yml
      - name: Commit format once
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/api/src/ai .github/workflows/luna-image-hotfix-format.yml
            git commit -m "style(staging): format Luna image visibility hotfix"
            git push origin HEAD:fix/luna-image-marker-visibility-diagnostics-20261016
          fi
