name: Remove Failed Research Probe Resources (One-Time)
on:
  push:
    branches:
      - feat/pubmed-research-mode-203
    paths:
      - ".github/workflows/research-probe-resources-cleanup-once.yml"
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Remove only R2 bucket and Queue auto-created by failed temporary Worker deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          bucket="santo-content-local"
          code="$(curl -sS --max-time 12 -o /tmp/probe-bucket.json -w '%{http_code}' -H "$auth" "$base/r2/buckets/$bucket")"
          if [[ "$code" == "200" ]] && jq -e --arg n "$bucket" '.result.name == $n' /tmp/probe-bucket.json >/dev/null; then
            removal="$(curl -sS --max-time 12 -o /tmp/delete-bucket.json -w '%{http_code}' -X DELETE -H "$auth" "$base/r2/buckets/$bucket")"
            echo "Temporary local R2 bucket deletion HTTP $removal"
          else
            echo "Temporary local R2 bucket was not found or could not be verified; left unchanged ($code)"
          fi
          code="$(curl -sS --max-time 12 -o /tmp/probe-queues.json -w '%{http_code}' -H "$auth" "$base/queues?per_page=100")"
          if [[ "$code" == "200" ]]; then
            queue_id="$(jq -r '[.result[]? | select(.queue_name=="santo-events-local") | .queue_id] | .[0] // empty' /tmp/probe-queues.json)"
            if [[ "$queue_id" =~ ^[0-9a-f-]{36}$ ]]; then
              # Delete only exact queue created by the failed one-time netprobe.
              removal="$(curl -sS --max-time 12 -o /tmp/delete-queue.json -w '%{http_code}' -X DELETE -H "$auth" "$base/queues/$queue_id")"
              echo "Temporary local queue deletion HTTP $removal"
            else
              echo "Temporary local queue not found or no verified ID; left unchanged"
            fi
          else
            echo "Cloudflare queue listing HTTP $code; no queue mutation attempted"
          fi
