name: Format Status Once

on:
  push:
    branches:
      - docs/finalize-p2-status

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/finalize-p2-status

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format PROJECT_STATUS.md
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write PROJECT_STATUS.md

      - name: Commit formatting if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- PROJECT_STATUS.md; then
            echo "PROJECT_STATUS.md already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "docs: format P2 handoff"
          git push origin HEAD:docs/finalize-p2-status
