name: Santo Gallery Readonly Diagnostic
on:
  push:
    branches: [feat/santo-gallery-sixth-search-staging-20261017]
    paths: [.github/workflows/santo-gallery-readonly-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests==2.32.3'
      - name: Read live isolated index status, failure IDs, and real search
        run: python scripts/inspect_santo_gallery.py
