name: Verify Provisional SSE Keepalive — Santo Staging
# Owner-confirmed AnKing index complete: rerun isolated CID lookup typecheck and R2 disease-facet smoke without reindexing.

on:
  push:
    branches:
      - fix/santo-sse-reliability-staging-20261019
    paths:
      - .github/workflows/santo-stream-keepalive-staging.yml

permissions:
  contents: write

concurrency:
  # Dedicated verified v12 staging rollout; old queued jobs fail exact-head SHA check.
  group: santo-staging-sse-keepalive-20261019
  # Supersede stale queued deploys from this branch, so they cannot later overwrite the verified full-index release.
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    if: github.repository == 'geminiamo0-ship-it/santoreno'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - name: Checkout verified candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace packages
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Format streaming keepalive and safe finalization tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write workers/api/src/ai/retrieval.ts workers/api/src/ai/retrieval.test.ts workers/api/src/ai/service.ts workers/api/src/ai/handler.ts workers/api/src/ai/amboss-adjacent.ts workers/api/src/ai/anking-topic-finder.ts workers/api/src/ai/anking-topic-finder.test.ts workers/api/src/ai/anking-topic-handler.ts workers/api/src/library/reader.ts workers/api/src/runtime/bindings.ts workers/api/src/ai/plain-luna.ts workers/api/src/ai/plain-luna.test.ts workers/api/src/conversation/native-stream.ts workers/api/src/conversation/native-stream.test.ts workers/api/src/conversation/handler.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/api/src/ai/retrieval.ts workers/api/src/ai/retrieval.test.ts workers/api/src/ai/service.ts workers/api/src/ai/handler.ts workers/api/src/ai/amboss-adjacent.ts workers/api/src/ai/anking-topic-finder.ts workers/api/src/ai/anking-topic-finder.test.ts workers/api/src/ai/anking-topic-handler.ts workers/api/src/library/reader.ts workers/api/src/runtime/bindings.ts workers/api/src/ai/plain-luna.ts workers/api/src/ai/plain-luna.test.ts workers/api/src/conversation/native-stream.ts workers/api/src/conversation/native-stream.test.ts workers/api/src/conversation/handler.ts
            git commit -m "style(staging): format isolated Anki CID search and licensed scientific citations"
            git push origin HEAD:fix/santo-sse-reliability-staging-20261019
          fi
          echo "Exact verified working commit: $(git rev-parse HEAD)"
      - name: Verify lint, typecheck, all tests, build and smoke before deploy
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
      - name: Require AnKing and AMBOSS source-only configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SANTO_ENV = "staging"' workers/api/wrangler.toml
          grep -Fq 'SANTO_ANKING_CARDS_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_ANKING_RIGHTS_CLEARED_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_AMBOSS_ADJACENT_R2_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_LUNA_UNIFIED_PROMPT_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'const ADJACENT_FILES = 10;' workers/api/src/ai/amboss-adjacent.ts
          grep -Fq 'const MAX_TOTAL_EVIDENCE = 15;' workers/api/src/ai/amboss-adjacent.ts
          grep -Fq 'LUNA_UNIFIED_MAX_INSTRUCTION_BYTES = 1_000' workers/api/src/ai/luna-unified-prompt.ts
          grep -Fq 'clinical reference for medical students and doctors' workers/api/src/ai/luna-unified-prompt.ts
          grep -Fq 'bold-led bullets' workers/api/src/ai/luna-unified-prompt.ts
          grep -Fq 'SANTO_ANKING_V12_FULL_SEARCH_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'const ANKING_FULL_V12_INSTANCE = "santo-anking-step-v12";' workers/api/src/ai/retrieval.ts
          grep -Fq 'const FULL_V12_SHARD_COUNT = 128;' workers/api/src/ai/anking-flashcards.ts
          grep -Fq 'const INDEX_KEY = "anking/v12/full/topic-index-v1.json";' workers/api/src/ai/anking-topic-finder.ts
          grep -Fq 'export const LUNA_MAX_OUTPUT_TOKENS = 3_000;' workers/api/src/ai/model.ts
          grep -Fq 'SANTO_AI_SEARCH_SINGLE_REQUEST_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_SEARCH_FAST_PATH_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'const STAGING_FAST_SEARCH_CANDIDATES = 30;' workers/api/src/ai/retrieval.ts
          grep -Fq 'enabled: !this.fastOneSearchV1' workers/api/src/ai/retrieval.ts
          grep -Fq 'const canonical = text.replace(' workers/api/src/ai/plain-luna.ts
          grep -Fq 'Number(number) <= allowed.length' workers/api/src/ai/plain-luna.ts
          grep -Fq 'commentKeepalive' workers/api/src/conversation/native-stream.ts
          grep -Fq 'santo-keepalive=comment' workers/api/src/conversation/handler.ts
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "$(git ls-remote origin refs/heads/fix/santo-sse-reliability-staging-20261019 | cut -f1)" = "$(git rev-parse HEAD)"
          echo "VERIFIED_DEPLOY_SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Verify existing full-v12 isolated CID index (read-only, no reindexing)
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir workers/api exec wrangler r2 object get "santo-content-staging/anking/v12/full/topic-index-v1.json" --file /tmp/anking-topic-readback.json --remote
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/anking-topic-readback.json", encoding="utf-8"))
          assert data["version"] == 2
          assert data["notes"] == 30477 and data["cards"] == 36896
          assert len(data["card_ids"]) == 30477
          print("FULL_V12_EXISTING_ANKI_TOPIC_INDEX_VERIFIED_READ_ONLY")
          PY
      - name: Test real treatment/diagnosis ranking and original CID pages without any model
        shell: bash
        env:
          SANTO_ANKING_TOPIC_INDEX_FILE: /tmp/anking-topic-readback.json
        run: |
          set -euo pipefail
          pnpm --dir workers/api exec vitest run src/ai/anking-topic-finder.test.ts
      - name: Setup Python for read-only Cloudflare full-index and search verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify four live clinical questions with 30-result native RRF and bounded duration
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install requests==2.32.3
          python scripts/smoke_santo_fast_search_staging.py
          echo 'Real one-call 30-result Hybrid/RRF fast route verified; no rerank, no source-index writes.'
      - name: Deploy Santo staging only, retaining secrets
        shell: bash
        run: |
          set -euo pipefail
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Verify Worker health and unauthorized request rejection
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$WORKER_URL/health")"
          jq -e '.service=="santo-api" and .status=="ok"' <<< "$health" >/dev/null
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/v1/ai/query" -H 'content-type: application/json' --data '{"query":"aortic stenosis","idempotency_key":"santo-anking-v12-unauth-smoke"}')"
          test "$status" = 401
          echo "SANTO_SSE_KEEPALIVE_STAGING_DEPLOYED" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Santo final citations now verify literal model aliases against server-provided sources; draft SSE hides aliases. Search, images and Production unchanged." >> "$GITHUB_STEP_SUMMARY"
