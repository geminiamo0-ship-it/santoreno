name: Verify Single-Pass Santo AI Staging
on:
  push:
    branches:
      - fix/staging-single-generation-budget-20261015
    paths:
      - .github/workflows/verify-single-pass-cost-once.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Format and commit changed files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write workers/api/src/ai/model.ts workers/api/src/ai/service.ts workers/api/src/ai/handler.ts workers/api/src/ai/model.test.ts workers/api/src/ai/handler.test.ts workers/api/src/runtime/bindings.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/api/src
            git commit -m "style(ai): format single-pass cost guard"
            git push origin HEAD:refs/heads/fix/staging-single-generation-budget-20261015
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
