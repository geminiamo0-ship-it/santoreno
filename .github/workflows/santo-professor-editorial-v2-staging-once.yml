name: Santo Professor Editorial Prompt v2 — Staging Cutover

on:
  push:
    branches: [feat/96-professor-editorial-prompt-v2-20261015]
    paths: [.github/workflows/santo-professor-editorial-v2-staging-once.yml]

permissions:
  contents: read

concurrency:
  group: santo-pilot-staging-deploy
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify editorial teaching contract and existing regressions
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxlint .
          pnpm exec prettier --check workers/api/src/ai/prompt.ts workers/api/src/ai/prompt.test.ts workers/api/src/ai/model.ts workers/api/src/ai/model.test.ts
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
          echo "PROFESSOR_EDITORIAL_FULL_SUITE=PASS"
      - name: Deploy Santo Staging only, keeping existing tenant credentials and bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Verify staging health and unauthenticated access denial
        shell: bash
        run: |
          set -euo pipefail
          health=""
          for attempt in $(seq 1 35); do
            health="$(curl --silent --show-error "$WORKER_URL/health" || true)"
            if jq -e '.service=="santo-api" and .status=="ok"' <<<"$health" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          jq -e '.service=="santo-api" and .status=="ok"' <<<"$health" >/dev/null
          status="$(curl --silent --show-error -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/v1/conversations/11111111-1111-4111-8111-111111111111/ask" -H 'Accept: text/event-stream' -H 'Content-Type: application/json' --data '{"idempotencyKey":"editorial-no-auth","expectedSequence":0,"text":"aortic stenosis"}')"
          test "$status" = 401
          echo "PROFESSOR_EDITORIAL_STAGING_DEPLOYED_SHA=$GITHUB_SHA"
          echo "Actual student medical response quality must be evaluated in authenticated Royal Bank." >> "$GITHUB_STEP_SUMMARY"
