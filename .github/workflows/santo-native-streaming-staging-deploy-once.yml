name: Santo Native Luna SSE Staging Deploy

on:
  push:
    branches: [feat/96-native-luna-sse-staging-20261015]
    paths: [.github/workflows/santo-native-streaming-staging-deploy-once.yml]

permissions:
  contents: read

concurrency:
  group: santo-pilot-staging-deploy
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Full exact source gates before any deployment
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
          test "$(sed -n '/\[env.staging.vars\]/,/\[env.staging.secrets\]/p' workers/api/wrangler.toml | grep -c 'SANTO_NATIVE_STREAMING_V1 = "true"')" = 1
          test "$(sed -n '/\[env.production.vars\]/,/\[\[env.production.d1_databases\]\]/p' workers/api/wrangler.toml | grep -c 'SANTO_NATIVE_STREAMING_V1')" = 0
      - name: Deploy only Santo Staging (preserve secrets)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Verify health and protected route boundaries
        shell: bash
        run: |
          set -euo pipefail
          health=""
          for attempt in $(seq 1 35); do
            health="$(curl -sS "$WORKER_URL/health" || true)"
            if jq -e '.service=="santo-api" and .status=="ok"' <<< "$health" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          jq -e '.service=="santo-api" and .status=="ok"' <<< "$health" >/dev/null
          for route in /v1/libraries /v1/conversations/11111111-1111-4111-8111-111111111111/turns; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$WORKER_URL$route")"
            test "$status" = 401
          done
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/v1/conversations/11111111-1111-4111-8111-111111111111/ask" -H 'Accept: text/event-stream' -H 'Content-Type: application/json' -d '{"idempotencyKey":"test","expectedSequence":0,"text":"test"}')"
          test "$status" = 401 || { echo "SSE_AUTH_FAILED_HTTP=$status"; exit 1; }
          echo "STAGING_NATIVE_SSE_DEPLOYED_SHA=$GITHUB_SHA"
          echo "Santo Worker upgraded on Staging only; real authenticated RAG and Royal UX QA still required." >> "$GITHUB_STEP_SUMMARY"
