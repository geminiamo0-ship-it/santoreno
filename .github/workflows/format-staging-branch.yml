name: Format Staging Branch

on:
  push:
    branches:
      - infra/issue-2-staging-provision
    paths:
      - .github/workflows/format-staging-branch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: infra/issue-2-staging-provision

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          workers/api/src/app.ts
          workers/api/src/app.test.ts
          workers/api/src/runtime/bindings.ts
          .github/workflows/provision-staging.yml

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/api/src/app.ts workers/api/src/app.test.ts workers/api/src/runtime/bindings.ts .github/workflows/provision-staging.yml
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: apply Prettier to staging provisioning changes"
          git push origin HEAD:infra/issue-2-staging-provision
