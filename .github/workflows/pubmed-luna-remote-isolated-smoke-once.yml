name: Isolated PubMed to Real Luna Smoke (No Santo Deployment)
on:
  push:
    branches:
      - feat/pubmed-on-working-luna-20261020
    paths:
      - ".github/workflows/pubmed-luna-remote-isolated-smoke-once.yml"
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Call actual PubMed and actual Luna in isolated remote Cloudflare runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          corepack enable
          pnpm install --frozen-lockfile
          cat > workers/api/src/__research_luna_isolated_smoke.ts <<'TS'
          import type { SantoBindings } from "./runtime/bindings";
          import { PubMedResearchRetrieval } from "./ai/research-retrieval";
          import { createGroundedModel } from "./ai/model";
          import { buildGroundedPrompt } from "./ai/prompt";
          import { validateGroundedCitations } from "./ai/citations";

          export default {
            async fetch(request: Request, env: SantoBindings) {
              if (new URL(request.url).pathname !== "/run") return Response.json({healthy:true});
              const started = Date.now();
              try {
                const question = "What does randomized trial evidence say about severe aortic stenosis treatments?";
                const evidence = (await new PubMedResearchRetrieval().retrieve({
                  query: "aortic stenosis randomized controlled trial",
                  libraryId: null,
                  sourceMode: "research",
                })).slice(0, 5);
                if (evidence.length < 1) throw new Error("NO_PUBMED_EVIDENCE");
                const ids = evidence.map(e => e.sourceId);
                if (ids.some(id => !/^pubmed:\d+$/.test(id))) throw new Error("INVALID_PMID");
                const model = createGroundedModel(env);
                const output = await model.generate(buildGroundedPrompt(question, evidence, "markdown", true), undefined, ids);
                const citations = validateGroundedCitations(output, evidence);
                return Response.json({
                  success: true,
                  sourceCount: evidence.length,
                  citationsVerified: citations.length,
                  provider: "openai/gpt-6-luna",
                  answerCharacters: output.answer.length,
                  totalMs: Date.now() - started,
                });
              } catch (cause) {
                const error = cause as { code?: string; name?: string };
                return Response.json({
                  success: false,
                  code: error.code ?? "INTEGRATION_FAILED",
                  name: error.name ?? "Error",
                  totalMs: Date.now() - started,
                });
              }
            },
          };
          TS
          cat > workers/api/wrangler.pubmed-luna-isolated-smoke.toml <<'CFG'
          name = "santo-pubmed-luna-isolated-probe"
          main = "src/__research_luna_isolated_smoke.ts"
          compatibility_date = "2026-10-01"
          workers_dev = false
          [ai]
          binding = "AI"
          [vars]
          SANTO_ENV = "staging"
          SANTO_LUNA_PREVIEW = "true"
          SANTO_SINGLE_PASS_GENERATION_V1 = "true"
          SANTO_COMPACT_CITATION_ALIASES_V1 = "true"
          SANTO_PLAIN_TEXT_LUNA_V1 = "true"
          CFG
          cd workers/api
          pnpm exec wrangler dev --remote --config wrangler.pubmed-luna-isolated-smoke.toml --ip 127.0.0.1 --port 8799 > /tmp/luna-isolated.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8799/health > /dev/null 2>&1; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then tail -35 /tmp/luna-isolated.log; exit 1; fi
            sleep 2
          done
          echo "Running one real PubMed → GPT-6 Luna → verified PMID smoke, with no user quota..."
          curl --fail-with-body --silent --show-error --max-time 170 http://127.0.0.1:8799/run > /tmp/luna-isolated-result.json
          jq -c '{success,sourceCount,citationsVerified,provider,answerCharacters,totalMs,code,name}' /tmp/luna-isolated-result.json
          jq -e '.success == true and .provider == "openai/gpt-6-luna" and .sourceCount >= 1 and .citationsVerified >= 1 and .answerCharacters > 20' /tmp/luna-isolated-result.json
          echo "Isolated research + Luna success; shared Santo Staging / DO / R2 / user quota not touched." >> "$GITHUB_STEP_SUMMARY"
      - name: Delete ephemeral files from runner
        if: always()
        shell: bash
        run: rm -f workers/api/src/__research_luna_isolated_smoke.ts workers/api/wrangler.pubmed-luna-isolated-smoke.toml /tmp/luna-isolated.log /tmp/luna-isolated-result.json
