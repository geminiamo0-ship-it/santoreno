name: PubMed on Luna — Safe Staging Deployment (One-Time)
on:
  push:
    branches:
      - feat/pubmed-on-working-luna-20261020
    paths:
      - ".github/workflows/pubmed-luna-safe-stage-deploy-once.yml"
permissions:
  contents: read
concurrency:
  group: santo-luna-staging-research-gated
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGE_URL: https://santo-api-staging.geminiamo0.workers.dev
      STABLE_SHA: 738f225ce35c21f233fb93605a3241a6bae816a2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Full verification before changing shared staging
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -Fq 'openai/gpt-6-luna' workers/api/src/ai/model.ts
          grep -Fq 'SANTO_LUNA_PREVIEW = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_SINGLE_PASS_GENERATION_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_PLAIN_TEXT_LUNA_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_RESEARCH_ENABLED = "true"' workers/api/wrangler.toml
          corepack enable
          pnpm install --frozen-lockfile
          # These test-only workflows are not part of the Worker source and are
          # removed only in this runner checkout prior to repo-wide prettier.
          rm -f .github/workflows/pubmed-luna-integration-verify-once.yml
          rm -f .github/workflows/pubmed-luna-remote-isolated-smoke-once.yml
          rm -f .github/workflows/pubmed-luna-safe-stage-deploy-once.yml
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
      - name: Deploy candidate only to Santo Staging
        shell: bash
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/DEPLOY_STARTED"
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Health, authorization and Luna configuration post-deploy checks
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-delay 3 --retry-all-errors --fail --silent "$STAGE_URL/health" |
            jq -e '.service=="santo-api" and .status=="ok"'
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$STAGE_URL/v1/ai/query" -H "content-type: application/json" --data '{"query":"aortic stenosis","idempotency_key":"safe-staging-unauthorized-research","source_mode":"research"}')"
          echo "Unauthenticated Research returns HTTP $code"
          test "$code" = 401
          echo "STAGING_RESEARCH_LUNA_DEPLOY_SUCCESS" >> "$GITHUB_STEP_SUMMARY"
          echo "Includes candidate Research mode and exactly the existing Luna model implementation. Production unchanged." >> "$GITHUB_STEP_SUMMARY"
      - name: Automatically restore working Luna if deployment or smoke fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/DEPLOY_STARTED" ]; then
            echo "Pre-deployment validation failed; existing staging untouched."
            exit 0
          fi
          echo "Staging post-deploy check failed; restoring last verified Luna $STABLE_SHA"
          git fetch origin "$STABLE_SHA" || git fetch origin fix/santo-sse-reliability-staging-20261019
          git reset --hard "$STABLE_SHA"
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
          echo "WORKING_LUNA_ROLLBACK_DEPLOYED" >> "$GITHUB_STEP_SUMMARY"
