name: P33 Probe Temporary Formatter

on:
  push:
    branches:
      - feat/issue-33-global-search-catalog

permissions:
  contents: write

concurrency:
  group: p33-probe-temp-formatter
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-33-global-search-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/p33-global-search-live-acceptance.mjs workers/api/src/infrastructure/p33-global-search-acceptance.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p33-global-search-live-acceptance.mjs workers/api/src/infrastructure/p33-global-search-acceptance.ts
          git commit -m "style(ai): format P33 search readiness probe"
          git push origin HEAD:feat/issue-33-global-search-catalog
