name: Verify PMC full text and Deploy Santo Research Staging Only

on:
  push:
    branches:
      - fix/research-pmc-fulltext-priority-20261021
    paths:
      - .github/workflows/research-pmc-staging-deploy-once.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: santo-research-pmc-staging-20261021
  cancel-in-progress: true

jobs:
  verify-deploy:
    if: github.repository == 'geminiamo0-ship-it/santoreno'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - name: Checkout exact Research/PMC candidate
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned workspace
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify Lint TypeScript Unit Tests Build Smoke
        id: tests
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
      - name: Guard independent Research mode and existing Luna/Library paths
        run: |
          set -euo pipefail
          grep -Fq 'SANTO_ENV = "staging"' workers/api/wrangler.toml
          grep -Fq 'SANTO_RESEARCH_ENABLED = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_LUNA_PREVIEW = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_SINGLE_PASS_GENERATION_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_PLAIN_TEXT_LUNA_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SourceModeRetrieval' workers/api/src/ai/research-retrieval.ts
          grep -Fq 'PubMedResearchRetrieval' workers/api/src/ai/handler.ts
          grep -Fq 'selectPmcTeachingPassages' workers/api/src/ai/research-retrieval.ts
          grep -Fq 'MAX_RESEARCH_EVIDENCE_CHARS = 16_000;' workers/api/src/ai/prompt.ts
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test actual PMC12444256 article content (read only, zero model calls)
        id: real_pmc
        run: |
          set -euo pipefail
          python scripts/smoke_research_pmc_fulltext_staging.py
      - name: Confirm exact current branch SHA
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/research-pmc-fulltext-priority-20261021 | cut -f1)" = "$(git rev-parse HEAD)"
          echo "RESEARCH_DEPLOY_SHA=$(git rev-parse HEAD)"
      - name: Deploy Santo STAGING only and preserve secrets
        id: deploy
        run: |
          set -euo pipefail
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Verify Staging Worker health and unauthorized request denial
        id: health
        run: |
          set -euo pipefail
          health="$(curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$WORKER_URL/health")"
          jq -e '.service=="santo-api" and .status=="ok"' <<< "$health" >/dev/null
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/v1/ai/query" -H 'content-type: application/json' --data '{"query":"DKA management special conditions","idempotency_key":"research-fulltext-unauth-smoke"}')"
          test "$status" = 401
          echo "SANTO_RESEARCH_PMC_FULLTEXT_STAGING_DEPLOYED" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Production unchanged; signed-in Royal Preview Research mode remains pending." >> "$GITHUB_STEP_SUMMARY"
      - name: Record result in Research issue even when blocked
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          PMC_RESULT: ${{ steps.real_pmc.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          HEALTH_RESULT: ${{ steps.health.outcome }}
        run: |
          gh issue comment 203 --repo geminiamo0-ship-it/santoreno \
            --body "Research PMC full-text-first Staging rollout SHA $(git rev-parse HEAD): job=$JOB_RESULT, full_tests=$TEST_RESULT, live_original_PMC=$PMC_RESULT, staging_deploy=$DEPLOY_RESULT, health_auth=$HEALTH_RESULT. Luna/Library/Production unchanged. Authenticated Research source-depth/browser acceptance still pending."
