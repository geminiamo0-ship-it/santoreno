name: Clarification and Figures Format
on:
  push:
    branches: [feat/qwen-clarify-luna-more-figures-staging-20261016]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            workers/api/src/ai/medical-query-rewrite.ts \
            workers/api/src/ai/medical-query-rewrite.test.ts \
            workers/api/src/ai/medical-images.ts \
            workers/api/src/ai/medical-images.test.ts \
            workers/api/src/ai/plain-luna.ts \
            workers/api/src/ai/handler.test.ts \
            workers/api/src/ai/service.ts \
            PROJECT_STATUS.md
      - name: Commit formatting to candidate only
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/api/src/ai/medical-query-rewrite.ts workers/api/src/ai/medical-query-rewrite.test.ts workers/api/src/ai/medical-images.ts workers/api/src/ai/medical-images.test.ts workers/api/src/ai/plain-luna.ts workers/api/src/ai/handler.test.ts workers/api/src/ai/service.ts PROJECT_STATUS.md
            git commit -m "style(staging): format Qwen clarification and medical image patch"
            git push origin HEAD:feat/qwen-clarify-luna-more-figures-staging-20261016
          fi
