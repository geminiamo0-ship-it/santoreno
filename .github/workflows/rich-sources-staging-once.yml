name: Santo Rich Sources — Branch Staging Acceptance

on:
  push:
    branches:
      - feat/96-rich-reader-widget
    paths:
      - .github/workflows/rich-sources-staging-once.yml

permissions:
  contents: read

concurrency:
  group: santo-pilot-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy Santo Staging only
    if: github.repository == 'geminiamo0-ship-it/santoreno'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Enforce full exact-branch verification before deployment
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
          python -m unittest discover -s scripts -p 'test_medical_library_import.py'
      - name: Deploy ONLY Cloudflare staging, never production
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Verify health and deny unauthenticated licensed source access
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --retry 12 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$WORKER_URL/health")"
          jq -e '.service == "santo-api" and .status == "ok"' <<< "$health" >/dev/null
          for path in /v1/libraries /v1/libraries/amboss/articles; do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$WORKER_URL$path")"
            test "$code" = 401 || { echo "Anonymous library access returned $code"; exit 1; }
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/v1/sources/article" -H 'content-type: application/json' --data '{}')"
          test "$code" = 401
          {
            echo "## Santo Rich Sources — Staging"
            echo "- Source SHA: \`$GITHUB_SHA\`"
            echo "- Deployed only to \`$WORKER_URL\`"
            echo "- Workspace CI, health and anonymous source denial: PASSED"
            echo "- Source article HTML in R2 still requires licensed-data re-export"
            echo "- No customer production or Santo production changes"
          } >> "$GITHUB_STEP_SUMMARY"
