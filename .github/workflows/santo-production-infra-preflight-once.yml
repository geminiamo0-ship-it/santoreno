name: Santo Production Infrastructure Preflight
on:
  push:
    branches: [feat/96-luna-professor-staging]
    paths: [.github/workflows/santo-production-infra-preflight-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    name: Read-only Cloudflare production infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit actual Production D1, private R2, queue and worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" && test -n "${CLOUDFLARE_API_TOKEN:-}"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          request() {
            local suffix="$1" output="$2"
            curl -sS -L --max-time 35 -o "$output" -w "%{http_code}" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$base/$suffix"
          }
          for pair in "d1/database|d1" "r2/buckets|r2" "queues|queues"; do
            endpoint="${pair%%|*}"
            label="${pair##*|}"
            code="$(request "$endpoint" "$RUNNER_TEMP/santo-$label.json")"
            echo "$label Cloudflare API status: $code"
          done
          code="$(curl -sS -I --max-time 35 -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/scripts/santo-api")"
          echo "production script metadata status: $code"
          python - <<'PY'
          import os, json, pathlib
          tmp=pathlib.Path(os.environ["RUNNER_TEMP"])
          def load(name):
              try: return json.loads((tmp/f"santo-{name}.json").read_text())
              except Exception: return {}
          d1=load("d1")
          r2=load("r2")
          queue=load("queues")
          d1_items=d1.get("result") or []
          if isinstance(d1_items,dict): d1_items=d1_items.get("databases") or []
          d1matches=[{"name":x.get("name"),"uuid":x.get("uuid")} for x in d1_items
                      if x.get("name") in ("santo-control-plane", "santo-control-plane-production")]
          b=r2.get("result") or {}
          buckets=b.get("buckets",[]) if isinstance(b,dict) else b if isinstance(b,list) else []
          rb=[x.get("name") for x in buckets if x.get("name")=="santo-content"]
          q=queue.get("result") or []
          if isinstance(q,dict): q=q.get("queues") or []
          qt=[x.get("queue_name") or x.get("name") for x in q
              if (x.get("queue_name") or x.get("name"))=="santo-events"]
          result={"d1ApiAccess":d1.get("success"),"productionControlDb":d1matches,
                  "r2ApiAccess":r2.get("success"),"productionContentBucketPresent":bool(rb),
                  "queuesApiAccess":queue.get("success"),"productionEventsQueuePresent":bool(qt)}
          print("PRODUCTION_INFRA_PREFLIGHT",json.dumps(result))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Santo Production Infra: Read Only\n")
              f.write("No infra was created or mutated.\n")
              f.write("Production D1 (name, ID): "+str(d1matches)+"\n")
              f.write("Private production R2 bucket present: "+str(bool(rb))+"\n")
              f.write("Production event queue present: "+str(bool(qt))+"\n")
              f.write("No server credential values were retrieved.\n")
          PY
      - name: Delete Cloudflare response caches
        if: always()
        run: rm -f "$RUNNER_TEMP"/santo-{d1,r2,queues}.json
