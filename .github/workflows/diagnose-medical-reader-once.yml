name: Diagnose Staging Medical Article Reader (One-Time)
on:
  push:
    branches: [feat/pubmed-research-mode-203]
    paths: [".github/workflows/diagnose-medical-reader-once.yml"]
permissions:
  contents: read
jobs:
  read-only-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read only private staging R2 catalog and representative articles
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          corepack enable
          pnpm install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/reader-audit"
          cd workers/api
          pnpm exec wrangler r2 object get "santo-content-staging/medical-library-catalog/v1/amboss.json" --remote --file="$RUNNER_TEMP/reader-audit/catalog.json" >/dev/null
          python3 - <<'PY'
          import json,os,subprocess,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"reader-audit"
          data=json.loads((root/"catalog.json").read_text())
          rows=data.get("articles",[])
          print("Catalog entries:",len(rows))
          for n,entry in enumerate(rows[:3]):
              aid=entry.get("id")
              if not isinstance(aid,str) or not aid.replace("-","").isalnum():continue
              out=root/f"article{n}.json"
              cmd=["pnpm","exec","wrangler","r2","object","get",
                   f"santo-content-staging/medical-articles/v1/amboss/{aid}.json",
                   "--remote",f"--file={out}"]
              proc=subprocess.run(cmd,capture_output=True,text=True,timeout=35)
              print("Article",n,"fetch_success",proc.returncode==0)
              if proc.returncode:continue
              a=json.loads(out.read_text())
              sections=a.get("sections")
              print("Keys:",sorted(a.keys()),"schemaVersion:",a.get("schemaVersion"),
                "libraryId:",a.get("libraryId"),"articleId_matches:",a.get("articleId")==aid,
                "section_count:",len(sections) if isinstance(sections,list) else None)
              if isinstance(sections,list):
                  bad=[{"pos":i,"keys":sorted(s.keys()),
                      "heading_type":type(s.get("heading")).__name__,
                      "text_type":type(s.get("text")).__name__,
                      "image_count":len(s.get("images",[])) if isinstance(s.get("images"),list) else None}
                       for i,s in enumerate(sections) if not isinstance(s,dict) or
                          any(x not in s for x in ("id","heading","text","images"))]
                  print("Malformed section samples:",bad[:3])
                  images=[x for s in sections if isinstance(s,dict) for x in s.get("images",[]) if isinstance(x,dict)]
                  print("Images:",len(images),"media_hosts:",sorted(set(
                     str(x.get("src","")).split("/")[2] for x in images if str(x.get("src","")).startswith("https://"))),
                     "non_https:",sum(not str(x.get("src","")).startswith("https://") for x in images))
          PY
      - name: Remove private data from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/reader-audit"
