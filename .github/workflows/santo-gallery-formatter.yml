name: Santo Gallery Candidate Format
on:
  push:
    branches:
      - feat/santo-gallery-sixth-search-staging-20261017
    paths:
      - .github/workflows/santo-gallery-formatter.yml
permissions:
  contents: write
jobs:
  format-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format candidate only
        run: |
          pnpm exec prettier --write .github/workflows/santo-medical-gallery-staging.yml PROJECT_STATUS.md workers/api/src/ai/handler.ts workers/api/src/ai/image-gallery.ts workers/api/src/ai/image-gallery.test.ts workers/api/src/ai/service.ts
          pnpm exec prettier --write .github/workflows/santo-gallery-index-provision-staging.yml
          echo "BEGIN_FORMATTED_INDEX_YAML"
          cat .github/workflows/santo-gallery-index-provision-staging.yml
          echo "END_FORMATTED_INDEX_YAML"
          echo "BEGIN_FORMATTED_STAGING_YAML"
          cat .github/workflows/santo-medical-gallery-staging.yml
          echo "END_FORMATTED_STAGING_YAML"
      - name: Commit format to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add PROJECT_STATUS.md workers/api/src/ai/handler.ts workers/api/src/ai/image-gallery.ts workers/api/src/ai/image-gallery.test.ts workers/api/src/ai/service.ts
            git commit -m 'style(staging): format sixth gallery search candidate'
            git push origin HEAD:feat/santo-gallery-sixth-search-staging-20261017
          fi
