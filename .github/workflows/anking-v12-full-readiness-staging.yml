name: Check Full AnKing v12 Index Readiness — Staging
on:
  push:
    branches:
      - feat/anking-v12-single-search-staging-20261019
    paths:
      - .github/workflows/anking-v12-full-readiness-staging.yml
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read-only completed/indexing stats for full AnKing v12
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          root="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai-search/namespaces/default"
          response="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$root/instances/santo-anking-step-v12/stats")"
          jq -e '.success == true and (.result | type=="object")' <<< "$response" >/dev/null
          jq -c '.result | {completed,queued,running,error,skipped,degraded}' <<< "$response"
          jq -e '(.result.completed >= 30477) and (.result.queued == 0) and (.result.running == 0)' <<< "$response" > /dev/null
          echo "ANKING_V12_FULL_INDEX_READY"
