name: Temporary Medical Ingest Docs Format
on:
  push:
    branches:
      - feat/85-github-actions-private-corpus-import
    paths:
      - .github/workflows/medical-docs-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format medical ingest runbook
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write docs/GITHUB_MEDICAL_LIBRARY_IMPORT.md
          if ! git diff --quiet -- docs/GITHUB_MEDICAL_LIBRARY_IMPORT.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/GITHUB_MEDICAL_LIBRARY_IMPORT.md
            git commit -m 'style(ingest): format GitHub Actions runbook'
            git push origin HEAD:refs/heads/feat/85-github-actions-private-corpus-import
          fi
