name: P2 Format Status Once

on:
  push:
    branches:
      - feat/issue-3-tenant-auth

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/issue-3-tenant-auth

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format project status
        run: pnpm exec prettier --write PROJECT_STATUS.md

      - name: Commit formatted status if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- PROJECT_STATUS.md; then
            echo "PROJECT_STATUS.md already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "docs: format P2 project status"
          git push origin HEAD:feat/issue-3-tenant-auth
