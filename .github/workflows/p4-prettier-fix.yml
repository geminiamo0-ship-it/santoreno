name: P4 Prettier Fix

on:
  push:
    branches:
      - feat/issue-5-session-exchange

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-5-session-exchange
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format P4 files
        run: >-
          pnpm exec prettier --write
          workers/api/src/app.ts
          workers/api/src/session/service.ts
          workers/api/src/session/session.test.ts
          workers/api/src/session/token.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/api/src/app.ts workers/api/src/session/service.ts workers/api/src/session/session.test.ts workers/api/src/session/token.ts
          git commit -m "style: format P4 session exchange files"
          git push origin HEAD:feat/issue-5-session-exchange
