name: P2 Finalize Status Once

on:
  push:
    branches:
      - feat/issue-3-tenant-auth

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/issue-3-tenant-auth

      - name: Update handoff
        run: python scripts/p2-finalize-status.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format handoff
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write PROJECT_STATUS.md

      - name: Commit handoff if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- PROJECT_STATUS.md; then
            echo "PROJECT_STATUS.md already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "docs: record successful P2 live acceptance"
          git push origin HEAD:feat/issue-3-tenant-auth
