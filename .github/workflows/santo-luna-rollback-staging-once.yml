name: Restore Luna — Santo Staging Only

on:
  push:
    branches:
      - hotfix/santo-staging-restore-luna-20261020
    paths:
      - .github/workflows/santo-luna-rollback-staging-once.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: santo-staging-luna-rollback-20261020
  cancel-in-progress: true

jobs:
  verify-rollback-deploy:
    if: github.repository == 'geminiamo0-ship-it/santoreno'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - name: Checkout exact rollback candidate
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned workspace
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify full repository
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
      - name: Verify Luna and source-preserving Staging flags
        run: |
          set -euo pipefail
          grep -Fq 'SANTO_ENV = "staging"' workers/api/wrangler.toml
          grep -Fq 'SANTO_LUNA_PREVIEW = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_GLM_47_FLASH_V1 = "false"' workers/api/wrangler.toml
          grep -Fq 'SANTO_SINGLE_PASS_GENERATION_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_PLAIN_TEXT_LUNA_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_LUNA_UNIFIED_PROMPT_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_FORWARD_ALL_SEARCH_HITS_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_ANKING_V12_FULL_SEARCH_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'export const MAX_GROUNDED_CITATIONS = 60' packages/contracts/src/ai.ts
          grep -Fq 'openai/gpt-6-luna' workers/api/src/ai/model.ts
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
      - name: Verify immutable source SHA
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/hotfix/santo-staging-restore-luna-20261020 | cut -f1)" = "$(git rev-parse HEAD)"
          echo "ROLLBACK_SHA=$(git rev-parse HEAD)"
      - name: Deploy Santo STAGING only with existing secrets
        id: deploy
        run: |
          set -euo pipefail
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Confirm staging worker health and authentication barrier
        id: health
        run: |
          set -euo pipefail
          health="$(curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$WORKER_URL/health")"
          jq -e '.service=="santo-api" and .status=="ok"' <<< "$health" >/dev/null
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/v1/ai/query" -H 'content-type: application/json' --data '{"query":"aortic stenosis","idempotency_key":"luna-restore-unauth-test"}')"
          test "$status" = 401
          echo "SANTO_LUNA_STAGING_ROLLBACK_VERIFIED" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Santo/Royal Production unchanged." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish exact deployment outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          HEALTH_RESULT: ${{ steps.health.outcome }}
        run: |
          gh issue comment 199 --repo geminiamo0-ship-it/santoreno \
            --body "Owner requested IMMEDIATE LUNA RESTORE. Staging rollback source SHA $(git rev-parse HEAD): full_verification_and_job=$JOB_RESULT, deploy=$DEPLOY_RESULT, health_auth=$HEALTH_RESULT. Staging GLM flag=false; single-pass Luna openai/gpt-6-luna restored. Production unchanged. Signed-in Royal Preview confirmation still pending."
