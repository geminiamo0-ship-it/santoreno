name: Deploy Verified 60-Source Citations — Santo Staging Only

on:
  push:
    branches:
      - fix/santo-all-hits-citation-contract-staging-20261020
    paths:
      - .github/workflows/santo-60-source-staging-deploy-once.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: santo-staging-citations-60-20261020
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    if: github.repository == 'geminiamo0-ship-it/santoreno'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - name: Checkout exact Staging citation fix
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Full lint TypeScript unit tests build smoke
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
      - name: Verify full-result search citation and Staging-only guards
        run: |
          set -euo pipefail
          grep -Fq 'SANTO_ENV = "staging"' workers/api/wrangler.toml
          grep -Fq 'SANTO_FORWARD_ALL_SEARCH_HITS_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_SEARCH_FAST_PATH_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_LUNA_UNIFIED_PROMPT_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_PLAIN_TEXT_LUNA_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'export const MAX_GROUNDED_CITATIONS = 60;' packages/contracts/src/ai.ts
          grep -Fq 'citations: z.array(GroundedAiCitationSchema).max(MAX_GROUNDED_CITATIONS),' packages/contracts/src/ai.ts
          grep -Fq 'sources: z.array(TrustedSourceMetadataSchema).min(1).max(MAX_GROUNDED_CITATIONS),' packages/contracts/src/source.ts
          grep -Fq 'citations.length > MAX_GROUNDED_CITATIONS' workers/api/src/ai/citations.ts
          grep -Fq 'SANTO_REF_N (1-60)' workers/api/src/ai/luna-unified-prompt.ts
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Existing one-call 50-hit Staging AI Search smoke (READ ONLY)
        id: search
        run: |
          set -euo pipefail
          python -m pip install requests==2.32.3
          python scripts/smoke_santo_all_results_staging.py
      - name: Verify immutable exact deployment source
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/santo-all-hits-citation-contract-staging-20261020 | cut -f1)" = "$(git rev-parse HEAD)"
          echo "DEPLOY_CANDIDATE_SHA=$(git rev-parse HEAD)"
      - name: Deploy Cloudflare Santo STAGING (NO PRODUCTION)
        id: deploy
        run: |
          set -euo pipefail
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Verify Worker health 200 and unauthorized AI 401
        id: health
        run: |
          set -euo pipefail
          health="$(curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$WORKER_URL/health")"
          jq -e '.service=="santo-api" and .status=="ok"' <<< "$health" >/dev/null
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/v1/ai/query" -H 'content-type: application/json' --data '{"query":"aortic stenosis","idempotency_key":"santo-citations-60-unauth-smoke"}')"
          test "$status" = 401
          echo "SANTO_CITATIONS_60_STAGING_DEPLOYED" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish per-stage proof in Issue 195
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SEARCH_STATUS: ${{ steps.search.outcome }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
          HEALTH_STATUS: ${{ steps.health.outcome }}
        run: |
          set -euo pipefail
          gh issue comment 195 --repo geminiamo0-ship-it/santoreno \
            --body "Santo STAGING 60-citation contract rollout $(git rev-parse HEAD): job=$JOB_STATUS, one_call_50_hit_search=$SEARCH_STATUS, deploy=$DEPLOY_STATUS, health_auth=$HEALTH_STATUS. Production unchanged. This addresses the observed 15-source CITATION_INVALID. Authenticated Royal answer verification remains outstanding."
