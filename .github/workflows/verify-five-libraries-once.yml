name: Verify Five-Library Retrieval
on:
  push:
    branches:
      - feat/staging-one-source-per-five-libraries-20261015
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Ensure repository code formatting
        run: |
          set -e
          pnpm exec prettier --write workers/api/src/ai/retrieval.ts workers/api/src/ai/retrieval.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/api/src/ai/retrieval.ts workers/api/src/ai/retrieval.test.ts
            git commit -m "style(retrieval): format five-library search"
            git push origin HEAD:refs/heads/feat/staging-one-source-per-five-libraries-20261015
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
