name: Format P1 temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format P1 files
        run: >-
          pnpm exec prettier --write
          docs/CLOUDFLARE_FOUNDATION.md
          packages/contracts/src/index.ts
          scripts/smoke.mjs
          workers/api/src/runtime/bindings.ts

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "P1 files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CLOUDFLARE_FOUNDATION.md packages/contracts/src/index.ts scripts/smoke.mjs workers/api/src/runtime/bindings.ts
          git commit -m "style: format P1 foundation files"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
