name: med2 Anatomy 3D — isolated R2 and Worker

on:
  push:
    paths:
      - ".github/workflows/med2-isolated-3d-deploy.yml"
      - "scripts/med2-r2-oidc-worker.mjs"
      - "wrangler.med2-3d.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: med2-anatomy-isolated-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Provision isolated R2 and OIDC-authenticated asset Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: santo-medical-ingest-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
      BUCKET: med2-anatomy-assets-20261102
      WORKER: med2-anatomy-viewer-v1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify dedicated scope and Cloudflare secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Cloudflare account secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Cloudflare API secret"; exit 1; }
          test "$BUCKET" = "med2-anatomy-assets-20261102"
          test "$WORKER" = "med2-anatomy-viewer-v1"
          test -s scripts/med2-r2-oidc-worker.mjs
          test -s wrangler.med2-3d.toml

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.46.0

      - name: Provision only dedicated med2 bucket and confirm ownership
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'med2-anatomy-20261102-owned-by-this-workflow' > "$RUNNER_TEMP/med2-owner.txt"
          if wrangler r2 bucket info "$BUCKET" --json > /dev/null 2>&1; then
            echo "Dedicated bucket exists; verifying marker before touching it"
            wrangler r2 object get "$BUCKET/__med2_owner.txt" --file "$RUNNER_TEMP/existing-med2-owner.txt"
            cmp -s "$RUNNER_TEMP/med2-owner.txt" "$RUNNER_TEMP/existing-med2-owner.txt" || {
              echo "Ownership marker mismatch; refusing to access pre-existing bucket"; exit 1;
            }
          else
            wrangler r2 bucket create "$BUCKET"
            wrangler r2 object put "$BUCKET/__med2_owner.txt" --file "$RUNNER_TEMP/med2-owner.txt"
          fi

      - name: Deploy only new med2 Worker with ONLY new R2 binding
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy --config wrangler.med2-3d.toml

      - name: Verify live Worker access control and publish its URL
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')"
          test -n "$SUBDOMAIN"
          URL="https://$WORKER.$SUBDOMAIN.workers.dev"
          UNAUTH="$(curl --silent --show-error -X PUT -H 'Content-Type: application/octet-stream' \
            --data-binary 'test' -o /dev/null -w '%{http_code}' \
            "$URL/__upload/202510141308/test.dat")"
          test "$UNAUTH" = "401" || { echo "Refusing insecure Worker deployment (upload not protected)"; exit 1; }
          echo "Dedicated med2 Worker: $URL"
          {
            echo "### med2 Cloudflare infrastructure"
            echo "- Worker: $URL"
            echo "- Dedicated R2 bucket: $BUCKET"
            echo "- No cross-project secrets copied; uploads require signed GitHub Actions OIDC for the private med2 repo"
            echo "- Unauthorized PUT rejected with HTTP 401"
            echo "- No other Cloudflare resources touched"
            echo "- Static assets are uploaded by the separate med2 Actions workflow"
          } >> "$GITHUB_STEP_SUMMARY"
