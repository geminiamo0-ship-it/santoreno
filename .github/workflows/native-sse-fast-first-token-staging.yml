name: Verify Native First-Token Performance — Santo Staging
# Parallelize ten adjacent R2 reads without changing the ranked search evidence

on:
  push:
    branches:
      - feat/native-sse-fast-first-token-staging-20261019
    paths:
      - .github/workflows/native-sse-fast-first-token-staging.yml

permissions:
  contents: write

concurrency:
  group: santo-staging-anking-viewer-rollout
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: github.repository == 'geminiamo0-ship-it/santoreno'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - name: Checkout verified candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace packages
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Persist formatting on isolated unified Luna branch
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write workers/api/src/ai/amboss-adjacent.ts workers/api/src/ai/amboss-adjacent.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/api/src/ai/amboss-adjacent.ts workers/api/src/ai/amboss-adjacent.test.ts
            git commit -m "style(staging): format fast AMBOSS R2 prefetch"
            git push origin HEAD:feat/native-sse-fast-first-token-staging-20261019
          fi
          echo "Exact verified working commit: $(git rev-parse HEAD)"
      - name: Verify lint, typecheck, all tests, build and smoke before deploy
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
      - name: Require AnKing and AMBOSS source-only configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SANTO_ENV = "staging"' workers/api/wrangler.toml
          grep -Fq 'SANTO_ANKING_CARDS_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_ANKING_RIGHTS_CLEARED_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_AMBOSS_ADJACENT_R2_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'SANTO_LUNA_UNIFIED_PROMPT_V1 = "true"' workers/api/wrangler.toml
          grep -Fq 'const ADJACENT_FILES = 10;' workers/api/src/ai/amboss-adjacent.ts
          grep -Fq 'const MAX_TOTAL_EVIDENCE = 15;' workers/api/src/ai/amboss-adjacent.ts
          grep -Fq 'LUNA_UNIFIED_MAX_INSTRUCTION_BYTES = 1_000' workers/api/src/ai/luna-unified-prompt.ts
          grep -Fq 'comprehensive' workers/api/src/ai/luna-unified-prompt.ts
          grep -Fq '3,000 output tokens when helpful' workers/api/src/ai/luna-unified-prompt.ts
          grep -Fq 'SANTO_AI_SEARCH_SINGLE_REQUEST_V1 = "true"' workers/api/wrangler.toml
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "$(git ls-remote origin refs/heads/feat/native-sse-fast-first-token-staging-20261019 | cut -f1)" = "$(git rev-parse HEAD)"
          echo "VERIFIED_DEPLOY_SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Deploy Santo staging only, retaining secrets
        shell: bash
        run: |
          set -euo pipefail
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Verify Worker health and unauthorized request rejection
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$WORKER_URL/health")"
          jq -e '.service=="santo-api" and .status=="ok"' <<< "$health" >/dev/null
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WORKER_URL/v1/ai/query" -H 'content-type: application/json' --data '{"query":"aortic stenosis","idempotency_key":"santo-fast-sse-unauth-smoke"}')"
          test "$status" = 401
          echo "SANTO_NATIVE_SSE_FAST_FIRST_TOKEN_STAGING_DEPLOYED" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "No Production deployment. Live authenticated answer/source-card acceptance remains pending." >> "$GITHUB_STEP_SUMMARY"
