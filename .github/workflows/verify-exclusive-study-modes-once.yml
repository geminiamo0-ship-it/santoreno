name: Verify Exclusive Santo Study Modes v2 (NO DEPLOY)
on:
  push:
    branches:
      - feat/santo-source-modes-single-search-20261021
    paths:
      - .github/workflows/verify-exclusive-study-modes-once.yml
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Format candidate in ephemeral checkout
        run: |
          pnpm exec prettier --write workers/api/src/ai/exclusive-source-modes.ts workers/api/src/ai/retrieval.ts workers/api/src/ai/retrieval.test.ts workers/api/src/ai/handler.ts workers/api/src/ai/service.ts workers/api/src/runtime/bindings.ts packages/contracts/src/library-reader.ts workers/api/src/library/reader.ts PROJECT_STATUS.md .github/workflows/verify-exclusive-study-modes-once.yml
      - name: Run full lint, TypeScript, unit, build and smoke
        id: checks
        run: |
          set -euo pipefail
          for step in lint typecheck test build smoke; do
            echo "TEST_STAGE=$step"
            if ! pnpm "$step" > /tmp/santo_selected.log 2>&1; then
              echo "$step" >/tmp/failure_stage
              tail -n 90 /tmp/santo_selected.log
              exit 1
            fi
          done
      - name: Upload test diagnostics to workflow summary
        if: always()
        run: |
          echo "Santo exclusive library modes SHA $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Checks: ${{ steps.checks.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if test -f /tmp/failure_stage; then
            echo "Stage: $(cat /tmp/failure_stage)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 35 /tmp/santo_selected.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "No deploy (Production and Staging unchanged)." >> "$GITHUB_STEP_SUMMARY"
