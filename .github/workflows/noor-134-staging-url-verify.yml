name: Noor #134 — verify deployed staging preview URL

on:
  push:
    branches: [feat/noor-134-staging-review-a5f4424]
    paths:
      - .github/workflows/noor-134-staging-url-verify.yml

permissions:
  contents: read

jobs:
  verify-preview-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Resolve Cloudflare account subdomain and verify live classroom
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          if not account or not token:
              raise RuntimeError("Missing Cloudflare staging reader credentials")
          req=urllib.request.Request(
              "https://api.cloudflare.com/client/v4/accounts/"+account+"/workers/subdomain",
              headers={"Authorization":"Bearer "+token})
          with urllib.request.urlopen(req,timeout=20) as response:
              payload=json.load(response)
          subdomain=payload.get("result",{}).get("subdomain")
          if not payload.get("success") or not subdomain:
              raise RuntimeError("No verified Cloudflare account subdomain")
          origin="https://noor-site-staging."+subdomain+".workers.dev"
          for path in ["/classroom/","/classroom/?view=teacher","/classroom/?view=student"]:
              with urllib.request.urlopen(origin+path,timeout=25) as response:
                  body=response.read().decode("utf-8")
                  if response.status!=200 or 'data-quran-layout="viewport-fit"' not in body:
                      raise RuntimeError("Staging classroom route/renderer did not pass live HTTP check")
          print("VERIFIED_NOOR_STAGING_URL="+origin+"/classroom/?view=teacher")
          print("VERIFIED_NOOR_STUDENT_URL="+origin+"/classroom/?view=student")
          print("VERIFIED exact isolated Cloudflare staging: HTTPS 200, canonical mushaf marker, 3 classroom routes")
          PY
