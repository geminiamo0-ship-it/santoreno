name: Format 60-Source Citation Regression — Candidate Only

on:
  push:
    branches:
      - fix/santo-all-hits-citation-contract-staging-20261020
    paths:
      - .github/workflows/santo-60-source-format-once.yml

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Format citation regression test
        run: |
          set -euo pipefail
          pnpm exec prettier --write workers/api/src/ai/plain-luna.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/api/src/ai/plain-luna.test.ts
            git commit -m "style(staging): format 60-source citation regression"
            git push origin HEAD:fix/santo-all-hits-citation-contract-staging-20261020
          fi
      - name: Complete test suite (NO DEPLOY)
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
