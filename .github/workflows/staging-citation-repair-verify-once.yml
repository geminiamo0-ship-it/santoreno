name: Santo Citation Integrity Repair — Staging Verify

on:
  push:
    branches: [feat/96-draft-disappears-diagnosis-20261015]
    paths:
      - .github/workflows/staging-citation-repair-verify-once.yml
      - workers/api/src/ai/model.ts
      - workers/api/src/ai/model.test.ts
      - workers/api/src/ai/service.ts
      - workers/api/src/ai/types.ts

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify changed code formatting, lint, types, tests, build and smoke
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxlint .
          pnpm exec prettier --check workers/api/src/ai/types.ts workers/api/src/ai/model.ts workers/api/src/ai/service.ts workers/api/src/ai/model.test.ts
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
      - name: Funded strict-JSON citation enum compatibility on synthetic clinical facts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          cat > "$RUNNER_TEMP/citation-schema.json" <<'JSON'
          {"model":"openai/gpt-6-luna","input":"Synthetic medical teaching check: aortic stenosis is narrowing of the aortic valve. Briefly explain this given sentence and cite the supplied evidence exactly as training:valve-1; do not add unprovided medical claims.","instructions":"You are a synthetic citation contract test, not a patient care assistant. Use only the supplied evidence and return JSON adhering to the strict schema.","max_output_tokens":700,"reasoning":{"effort":"none"},"service_tier":"fast","store":false,"text":{"format":{"type":"json_schema","name":"santo_grounded","strict":true,"schema":{"type":"object","properties":{"answer":{"type":"string"},"citation_ids":{"type":"array","items":{"type":"string","enum":["training:valve-1"]},"minItems":1,"maxItems":5}},"required":["answer","citation_ids"],"additionalProperties":false}}}}
          JSON
          http="$(curl --silent --show-error --max-time 90 --output "$RUNNER_TEMP/citation-response.json" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/citation-schema.json" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/v1/responses")"
          echo "CITATION_ENUM_PROVIDER_HTTP=$http"
          if [[ "$http" != 200 ]]; then
            jq -c '{code:(.error.code // .errors[0].code // "provider_error")}' "$RUNNER_TEMP/citation-response.json" || true
            exit 1
          fi
          jq -er '[.output[]? | select(.type=="message") | .content[]? | select(.type=="output_text") | .text] | first' "$RUNNER_TEMP/citation-response.json" | jq -e '.citation_ids == ["training:valve-1"] and (.answer | type=="string")' >/dev/null
          echo "CITATION_ENUM_PROVIDER_PASS=true"
      - name: Remove synthetic provider requests and responses
        if: always()
        run: rm -f "$RUNNER_TEMP/citation-schema.json" "$RUNNER_TEMP/citation-response.json"
