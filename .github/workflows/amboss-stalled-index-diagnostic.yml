name: Diagnose AMBOSS Index Final Status
on:
  push:
    branches:
      - diagnostic/amboss-stalled-index-20261015
    paths:
      - .github/workflows/amboss-stalled-index-diagnostic.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Safe read-only AMBOSS index and sync job inspection
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,re,collections
          a=os.environ.get('CF_ACCOUNT')
          t=os.environ.get('CF_TOKEN')
          if not a or not t: raise SystemExit('Cloudflare credentials unavailable')
          base=f'https://api.cloudflare.com/client/v4/accounts/{a}/ai-search/namespaces/default/instances/amboss'
          def read(url):
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+t,'Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=30) as response: payload=json.load(response)
              if not payload.get('success'):
                print('API_FAILURE',url.split('/')[-1], [(e.get('code')) for e in payload.get('errors',[])][:3])
                return None
              return payload.get('result')
            except urllib.error.HTTPError as e:
              print('HTTP_STATUS',url.split('/')[-1],e.code)
              return None
          stats=read(base+'/stats')
          if isinstance(stats,dict):
            print('INDEX_COUNTS',json.dumps({k:stats.get(k) for k in ('completed','queued','running','error','skipped','outdated','degraded','last_activity')}))
            for field in ('index_source_errors','file_embed_errors'):
              errors=stats.get(field)
              if isinstance(errors,dict): print('INDEX_ERROR_CODES',field,sorted(errors.keys())[:15])
          cfg=read(base)
          if isinstance(cfg,dict):
            fields=('enable','paused','sync_interval','source','r2_bucket','path_filter','path_filters','engine_version','created_at','modified_at','last_synced_at','data_source','source_type','token_id')
            safe={}
            for k in fields:
              v=cfg.get(k)
              if k=='token_id': safe['token_id_present']=bool(v)
              elif isinstance(v,(str,int,float,bool)) or v is None: safe[k]=v
              elif isinstance(v,dict): safe[k+'_keys']=sorted(v.keys())[:15]
              elif isinstance(v,list): safe[k+'_count']=len(v)
            print('INDEX_CONFIG',json.dumps(safe))
          jobs=read(base+'/jobs?per_page=15')
          if isinstance(jobs,list):
            print('JOB_COUNT',len(jobs))
            for job in jobs[:10]:
              if not isinstance(job,dict): continue
              print('JOB',json.dumps({k:job.get(k) for k in ('id','source','status','started_at','ended_at','last_seen_at','end_reason')}))
            for job in jobs[:3]:
              if not isinstance(job,dict) or not job.get('id'):continue
              log=read(base+'/jobs/'+str(job['id'])+'/logs?per_page=150')
              if isinstance(log,list):
                buckets=collections.Counter()
                # Never output licensed content, filenames or error text.
                for entry in log:
                  m=str(entry.get('message','')).lower()
                  cats=('rate limit','429','timeout','timed out','unauthorized','403','401','token','permission','embed','quota','size','large','invalid','failed','error','index','sync','completed','cancel','pause','queue','exceeded','r2')
                  cat=next((key for key in cats if key in m),'other')
                  buckets[(entry.get('message_type'),cat)]+=1
                print('JOB_LOG_CATEGORIES',str(job['id']),buckets.most_common(20))
          PY
