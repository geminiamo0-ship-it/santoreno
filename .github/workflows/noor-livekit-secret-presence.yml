name: Noor Dev LiveKit secrets — read-only name check
on:
  push:
    branches:
      - main
    paths:
      - scripts/noor_livekit_secret_presence.py
      - .github/workflows/noor-livekit-secret-presence.yml
      - tests/test_noor_livekit_secret_presence.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Strict offline metadata/target tests
        run: |
          python3 -m unittest discover -s tests -p 'test_noor_livekit_secret_presence.py' -v
      - name: Read only names on exact Noor Dev worker — never values
        run: python3 scripts/noor_livekit_secret_presence.py
