name: Temporary P6 indexing hardener

on:
  push:
    branches:
      - feat/issue-7-grounded-ai-slice

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-7-grounded-ai-slice
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Harden P6 indexing fixture
        run: python -c "import base64;exec(base64.b64decode(''))"
      - run: pnpm exec prettier --write scripts/p6-live-acceptance.mjs
      - name: Commit update if needed
        run: |
          if git diff --quiet -- scripts/p6-live-acceptance.mjs; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p6-live-acceptance.mjs
          git commit -m "test(ai): isolate P6 AI Search indexing fixtures"
          git push origin HEAD:feat/issue-7-grounded-ai-slice
