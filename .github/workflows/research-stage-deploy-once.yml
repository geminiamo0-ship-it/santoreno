name: Research Mode Staging Deployment (One-Time)
on:
  push:
    branches:
      - feat/pubmed-research-mode-203
    paths:
      - ".github/workflows/research-stage-deploy-once.yml"
permissions:
  contents: read
  checks: read
concurrency:
  group: santo-research-staging-only
  cancel-in-progress: false
jobs:
  staged-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Require exact commit verification
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 50); do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")"
            policy="$(jq -r '[.check_runs[] | select(.name == "repository-policy") | .conclusion] | map(select(. != null)) | .[0] // ""' <<< "$checks")"
            quality="$(jq -r '[.check_runs[] | select(.name == "code-quality") | .conclusion] | map(select(. != null)) | .[0] // ""' <<< "$checks")"
            if [[ "$policy" == success && "$quality" == success ]]; then exit 0; fi
            case "$policy:$quality" in
              *failure*|*cancelled*|*timed_out*|*action_required*|*startup_failure*|*stale*)
                echo "Exact commit failed verification: $policy $quality"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Exact commit verification timed out"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy existing Santo Worker to staging only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          corepack enable
          pnpm install --frozen-lockfile
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Validate staging health and authenticated boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 3 --retry-all-errors --fail --silent "$WORKER_URL/health" | jq -e '.service == "santo-api" and .status == "ok"'
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST "$WORKER_URL/v1/ai/query" -H 'content-type: application/json' --data '{"query":"Aortic stenosis clinical trials","idempotency_key":"research-no-session-smoke","source_mode":"research"}')"
          test "$code" = 401
          echo "Staging health and unauthenticated Research Mode denial OK" >> "$GITHUB_STEP_SUMMARY"
          echo "Provider-authenticated and browser medical QA still required" >> "$GITHUB_STEP_SUMMARY"
          echo "Production unchanged" >> "$GITHUB_STEP_SUMMARY"
