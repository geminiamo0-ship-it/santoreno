name: Temporary Professor Teaching Format
on:
  push:
    branches:
      - feat/77-professor-grade-grounded-teaching
    paths:
      - .github/workflows/professor-teaching-format-once.yml
permissions:
  contents: write
jobs:
  format-docs-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply repository pinned Prettier formatting
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write workers/api/src/ai/prompt.ts workers/api/src/ai/model.ts workers/api/src/ai/prompt.test.ts workers/api/src/ai/model.test.ts docs/prompts/SANTO_MEDICAL_EDUCATION_COPILOT_V1.md docs/PROFESSOR_GRADE_TEACHING.md PROJECT_STATUS.md
          if ! git diff --quiet -- workers/api/src/ai/prompt.ts workers/api/src/ai/model.ts workers/api/src/ai/prompt.test.ts workers/api/src/ai/model.test.ts docs/prompts/SANTO_MEDICAL_EDUCATION_COPILOT_V1.md docs/PROFESSOR_GRADE_TEACHING.md PROJECT_STATUS.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add workers/api/src/ai/prompt.ts workers/api/src/ai/model.ts workers/api/src/ai/prompt.test.ts workers/api/src/ai/model.test.ts docs/prompts/SANTO_MEDICAL_EDUCATION_COPILOT_V1.md docs/PROFESSOR_GRADE_TEACHING.md PROJECT_STATUS.md
            git commit -m 'style(ai): format professor teaching source/tests/docs with Prettier'
            git push origin HEAD:refs/heads/feat/77-professor-grade-grounded-teaching
          fi
