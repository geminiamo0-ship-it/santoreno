name: Research Mode - One-Time Formatting
on:
  push:
    branches:
      - feat/pubmed-research-mode-203
    paths:
      - ".github/workflows/research-mode-format-once.yml"
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format research feature files and push branch
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            packages/contracts/src/ai.ts \
            packages/contracts/src/conversation.ts \
            packages/contracts/src/source.ts \
            workers/api/src/ai/types.ts \
            workers/api/src/ai/service.ts \
            workers/api/src/ai/research-retrieval.ts \
            workers/api/src/ai/handler.ts \
            workers/api/src/ai/model.ts \
            workers/api/src/ai/prompt.ts \
            workers/api/src/ai/citations.ts \
            workers/api/src/conversation/ask-service.ts \
            workers/api/src/durable-objects/conversation-turn-core.ts \
            workers/api/src/runtime/bindings.ts \
            workers/api/src/sources/service.ts \
            packages/widget/src/ui-state.ts \
            packages/widget/src/conversation-client.ts \
            packages/widget/src/index.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src workers/api/src/ai workers/api/src/conversation/ask-service.ts workers/api/src/durable-objects/conversation-turn-core.ts workers/api/src/runtime/bindings.ts workers/api/src/sources/service.ts packages/widget/src
          if ! git diff --cached --quiet; then
            git commit -m "style(research): format source mode integration"
            git push origin HEAD:feat/pubmed-research-mode-203
          fi
