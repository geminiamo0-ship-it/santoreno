name: PubMed Provider Diagnostic (One-Time)
on:
  push:
    branches: [feat/pubmed-research-mode-203]
    paths: [.github/workflows/research-provider-diagnostic-once.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe fixed clinical query without credentials or user data
        shell: bash
        run: |
          set -euo pipefail
          esearch_url="https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=aortic%20stenosis&retmax=60&retmode=json&sort=relevance"
          echo "PubMed ESearch:"
          status="$(curl -sS --max-time 12 -o /tmp/ncbi-esearch.json -w '%{http_code} %{time_total}' "$esearch_url" || true)"
          echo "HTTP and seconds: $status, bytes: $(wc -c < /tmp/ncbi-esearch.json)"
          jq -r '.esearchresult.idlist | "PMIDs: " + (length | tostring)' /tmp/ncbi-esearch.json || true
          ids="$(jq -r '.esearchresult.idlist | join(",")' /tmp/ncbi-esearch.json)"
          test -n "$ids"
          efetch_url="https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=$ids&retmode=xml"
          echo "PubMed batch EFetch:"
          status="$(curl -sS --max-time 12 -o /tmp/ncbi-efetch.xml -w '%{http_code} %{time_total}' "$efetch_url" || true)"
          echo "HTTP and seconds: $status, bytes: $(wc -c < /tmp/ncbi-efetch.xml)"
          python3 - <<'PY'
          from xml.etree import ElementTree
          try:
              root=ElementTree.parse("/tmp/ncbi-efetch.xml").getroot()
              print("Valid XML records:",len(root.findall("PubmedArticle")))
          except Exception as e:
              print("XML failure type:",type(e).__name__)
          PY
