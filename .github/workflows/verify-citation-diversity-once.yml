name: Verify medical citation diversity candidate (recheck)

on:
  push:
    branches:
      - fix/staging-grounded-multilibrary-citation-coverage-20261015
    paths:
      - .github/workflows/verify-citation-diversity-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Full code quality
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
