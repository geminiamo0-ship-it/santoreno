name: Noor Development Staging — isolated D1 and Worker

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/noor-private-staging.yml
      - scripts/noor_private_staging.py
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/noor-private-staging.yml
      - scripts/noor_private_staging.py

permissions:
  contents: read
  actions: read

concurrency:
  group: noor-private-staging-provision
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated Noor staging script without network or credentials
        run: python3 -m py_compile scripts/noor_private_staging.py
      - name: Unit test canonical staging source/identity gates offline
        run: python3 -m unittest discover -s tests -p 'test_noor_canonical_staging.py' -v
      - name: Syntax check remote-staging browser acceptance
        run: node --check scripts/noor_staging_profile_browser.mjs
      - name: Temporary formatter diagnostic for scoped new browser script
        run: |
          corepack enable
          corepack prepare pnpm@10.34.6 --activate
          pnpm install --frozen-lockfile
          echo NOOR_FORMATTER_BEGIN
          pnpm exec prettier scripts/noor_staging_profile_browser.mjs
          echo NOOR_FORMATTER_END

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout scoped workflow repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout verified public Noor main
        uses: actions/checkout@v4
        with:
          repository: geminiamo0-ship-it/nour-elquran
          ref: main
          path: noor
          persist-credentials: false
      - name: Verify exact Noor main SHA and private guard
        shell: bash
        run: |
          set -euo pipefail
          NOOR_SHA="$(git -C noor rev-parse HEAD)"
          test -f noor/workers/site/src/staging-access.ts
          test -f noor/tests/staging-access.test.mjs
          test -f noor/docs/NOOR_STAGING_RUNBOOK.md
          grep -Fq 'stagingAccessGuard(request, env)' noor/workers/site/src/index.ts
          COUNT="$(gh api "repos/geminiamo0-ship-it/nour-elquran/actions/runs?head_sha=$NOOR_SHA&per_page=20" --jq '[.workflow_runs[] | select(.name == "Verify" and .event == "push" and .conclusion == "success")] | length')"
          test "$COUNT" -ge 1 || { echo "Noor main Verify not successful for exact checkout SHA"; exit 1; }
          echo "NOOR_SHA=$NOOR_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build Noor account-enabled developer UI
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
          cd noor
          pnpm install --frozen-lockfile
          NEXT_PUBLIC_ACCOUNT_UI=true NEXT_PUBLIC_QURAN_PERSISTENCE_ENABLED=true pnpm --filter @noor/web build
      - name: Deploy open developer staging and verify application account security
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare GitHub secrets missing"; exit 1; }
          python3 scripts/noor_private_staging.py
      - name: Upload Noor synthetic staging Chrome screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-profile-remote-browser
          path: artifacts/noor-staging-profile/*.png
          if-no-files-found: warn
