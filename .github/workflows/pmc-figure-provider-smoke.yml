name: PMC Figure Provider Read-Only Preflight
on:
  push:
    branches: [feat/pmc-cited-figures-staging-20261025]
    paths: [.github/workflows/pmc-figure-provider-smoke.yml]
permissions:
  contents: read
jobs:
  real-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify 2026 official PMC S3 metadata and existing image object
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          base='https://pmc-oa-opendata.s3.amazonaws.com'
          url=base+'/metadata/PMC10009416.1.json'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Santo-PMC-Pilot/1.0'}),timeout=12) as r:
              data=json.loads(r.read(500000))
          assert data['pmcid']=='PMC10009416'
          assert data.get('version') == 1
          media=data.get('media_urls') or []
          assert isinstance(media,list) and len(media)>0, 'No sample media URLs'
          jpgs=[u for u in media if '.jpg' in u.lower() or '.png' in u.lower()]
          assert jpgs, 'No actual image media declared'
          original=jpgs[0]
          parsed=urllib.parse.urlsplit(original)
          assert parsed.scheme=='s3' and parsed.netloc=='pmc-oa-opendata'
          public=base+parsed.path
          if parsed.query: public+='?'+parsed.query
          req=urllib.request.Request(public,headers={'Range':'bytes=0-511','User-Agent':'Santo-PMC-Pilot/1.0'})
          with urllib.request.urlopen(req,timeout=15) as r:
              sample=r.read(512)
              assert r.status in (200,206)
              assert len(sample)>16
          import re
          xml_url=data.get('xml_url')
          assert isinstance(xml_url,str) and xml_url.startswith('s3://pmc-oa-opendata/PMC10009416.1/')
          resolved_xml=base+xml_url[len('s3://pmc-oa-opendata'):]
          with urllib.request.urlopen(urllib.request.Request(resolved_xml,headers={'User-Agent':'Santo-PMC-Pilot/1.0'}),timeout=15) as response:
              xml=response.read(1500001).decode('utf-8')
          assert len(xml)<1500000
          refs=re.findall(r'<graphic\\b[^>]*\\bxlink:href=["\\']([^"\\']+)["\\']',xml,re.I)
          candidates={urllib.parse.urlsplit(media).path.rsplit('/',1)[-1].lower() for media in jpgs}
          matching=[name for name in refs if name.lower() in candidates or any(x.rsplit('.',1)[0]==name.lower() for x in candidates)]
          assert matching, 'Source XML Figure xlink references are not resolvable to declared PMC media URLs'
          print('REAL_PMC_FIGURE_XML_TO_MEDIA_MATCH',{'pmcid':data['pmcid'],'figure_references':len(refs),'matched_figures':len(matching)})
          print('REAL_PMC_METADATA_MEDIA_AVAILABLE', {'pmcid':data['pmcid'],'license_code':data.get('license_code'),'media_count':len(media),'first_file':parsed.path.split('/')[-1],'image_bytes_received':len(sample),'media_http':r.status})
          PY
