name: MedPark Luna — Read-only Cloudflare Library Audit
on:
  push:
    branches:
      - audit/luna-cloudflare-20261106
    paths:
      - ".github/workflows/luna-medpark-readonly-audit.yml"

permissions:
  contents: read

jobs:
  library-audit:
    name: AI Search + private R2 article metadata (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check authorization without revealing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$GITHUB_REF" = "refs/heads/audit/luna-cloudflare-20261106"

      - name: Inspect five live AI Search instances and canonical source paths
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          base = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"]
          headers = {"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]}
          libs = {"amboss":"amboss", "usmle":"usmle", "passmedicine":"passmedicine",
                  "pastest":"pastest", "one-examination-isolated":"one-examination"}
          targets = []
          accessible = 0
          def get(path):
              try:
                  with urlopen(Request(base + path, headers=headers), timeout=25) as response:
                      data = json.load(response)
                  return (data.get("result") if data.get("success") else None, "ok" if data.get("success") else "api_rejected")
              except HTTPError as exc:
                  return (None, "http_" + str(exc.code))
              except (URLError, TimeoutError, ValueError):
                  return (None, "unavailable")
          for instance, library in libs.items():
              root = "/ai-search/namespaces/default/instances/" + instance
              details, detailStatus = get(root)
              stats, statStatus = get(root + "/stats")
              items, itemStatus = get(root + "/items?per_page=25&page=1")
              if detailStatus == "ok": accessible += 1
              source = details.get("source") if isinstance(details, dict) else None
              if isinstance(source, dict):
                  source = source.get("bucket_name") or source.get("bucket") or "structured"
              if not isinstance(source, str): source = "unknown"
              source = re.sub("[^A-Za-z0-9._-]", "", source)[:90] or "unknown"
              counts = {}
              if isinstance(stats, dict):
                  for k in ("completed","queued","running","error","skipped"):
                      if isinstance(stats.get(k), int): counts[k] = stats[k]
              expected = re.compile(r"^medical-search/v1/" + re.escape(library) + r"/([a-z0-9][a-z0-9-]{0,90})/(s-[0-9]{4})[.]md$")
              sampleKeys = [i.get("key") for i in items if isinstance(i, dict)] if isinstance(items, list) else []
              matched = [expected.fullmatch(key) for key in sampleKeys if isinstance(key, str)]
              matched = [m for m in matched if m]
              if matched:
                  m = matched[0]
                  targets.append({"library":library, "article":m.group(1), "section":m.group(2)})
              print("AI_SEARCH", json.dumps({"instance":instance, "sourceBucket":source,
                  "detail":detailStatus, "stats":statStatus, "items":itemStatus,
                  "counts":counts, "sampled":len(sampleKeys), "canonicalSampleMatches":len(matched),
                  "sampleArticleAvailable":bool(matched)}, sort_keys=True))
          buckets, status = get("/r2/buckets?per_page=100")
          names = []
          if isinstance(buckets, dict): buckets = buckets.get("buckets")
          if isinstance(buckets, list):
              names = sorted(b.get("name","") for b in buckets if isinstance(b, dict) and
                             str(b.get("name","")).startswith("santo-"))
          print("R2_BUCKET_INVENTORY",json.dumps({"status":status,"santoBucketNames":names}))
          Path(os.environ["RUNNER_TEMP"]).joinpath("luna-audit-targets.json").write_text(json.dumps(targets))
          print("AUDIT",json.dumps({"accessibleInstances":accessible,"canonicalExampleArticles":len(targets)}))
          if accessible == 0: raise SystemExit("No instance metadata was readable")
          PY

      - name: Probe actual AI Search REST retrieval contract (metadata only)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          api = ("https://api.cloudflare.com/client/v4/accounts/" +
                 os.environ["CLOUDFLARE_ACCOUNT_ID"] + "/ai-search/namespaces/default/search")
          payload = {"messages":[{"role":"user","content":"What causes aortic valve stenosis?"}],
                     "ai_search_options":{
                       "instance_ids":["amboss","usmle"],
                       "retrieval":{"retrieval_type":"hybrid","match_threshold":0.4,
                                    "max_num_results":4,"return_on_failure":True},
                       "query_rewrite":{"enabled":False}}}
          req = Request(api, data=json.dumps(payload).encode("utf8"), method="POST",
                        headers={"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"],
                                 "Content-Type":"application/json"})
          try:
              with urlopen(req, timeout=45) as response:
                  data = json.load(response)
              outer = data.get("result") if isinstance(data, dict) else None
              chunks = outer.get("chunks") if isinstance(outer, dict) else None
              print("LIVE_SEARCH_SHAPE", json.dumps({
                  "status":"ok", "success":data.get("success"),
                  "resultKeys":list(outer.keys())[:16] if isinstance(outer,dict) else [],
                  "chunksAreArray":isinstance(chunks,list),
                  "chunkCount":len(chunks) if isinstance(chunks,list) else None,
                  "firstChunkKeys":list(chunks[0].keys())[:18] if isinstance(chunks,list) and
                                   chunks and isinstance(chunks[0],dict) else [],
                  "firstItemKeys":list(chunks[0].get("item",{}).keys())[:12]
                    if isinstance(chunks,list) and chunks and isinstance(chunks[0],dict)
                    and isinstance(chunks[0].get("item"),dict) else [],
                  "instanceTypes":sorted(set(type(c.get("instance_id")).__name__
                       for c in chunks[:4] if isinstance(c,dict))) if isinstance(chunks,list) else [],
              }))
          except HTTPError as e:
              print("LIVE_SEARCH_SHAPE",json.dumps({"status":"http_"+str(e.code)}))
          except (URLError, ValueError, TimeoutError):
              print("LIVE_SEARCH_SHAPE",json.dumps({"status":"unavailable"}))
          PY

      - name: Verify Cloudflare API Bearer can GET existing private R2 article (no content logging)
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          targets = json.loads((Path(os.environ["RUNNER_TEMP"]) / "luna-audit-targets.json").read_text())
          if not targets:
              print("R2_REST_READER",json.dumps({"status":"no_index_target"}))
              raise SystemExit(0)
          article = targets[0]
          key = "medical-articles/v1/{}/{}.json".format(article["library"],article["article"])
          endpoint = ("https://api.cloudflare.com/client/v4/accounts/" +
                      os.environ["CLOUDFLARE_ACCOUNT_ID"] +
                      "/r2/buckets/santo-content-staging/objects/" + key)
          try:
              with urlopen(Request(endpoint,headers={
                  "Authorization":"Bearer " + os.environ["CLOUDFLARE_API_TOKEN"],
              }),timeout=25) as response:
                  data=json.load(response)
              print("R2_REST_READER",json.dumps({"status":"ok",
                  "validIdentity":data.get("articleId")==article["article"] and
                                  data.get("libraryId")==article["library"],
                  "hasOriginalHtml":isinstance(data.get("contentHtml"),str) and
                                    len(data.get("contentHtml"))>100}))
          except HTTPError as e:
              print("R2_REST_READER",json.dumps({"status":"http_"+str(e.code)}))
          except (URLError,ValueError,TimeoutError):
              print("R2_REST_READER",json.dumps({"status":"unavailable"}))
          PY

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Wrangler (only for read-only object GET)
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Inspect a matching private R2 article per indexed library without printing content
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          from pathlib import Path
          targets = json.loads((Path(os.environ["RUNNER_TEMP"]) / "luna-audit-targets.json").read_text())
          bucket = "santo-content-staging"
          for t in targets:
              key = "medical-articles/v1/{}/{}.json".format(t["library"],t["article"])
              with tempfile.TemporaryDirectory() as tmp:
                  dest = Path(tmp) / "article.json"
                  command = ["pnpm", "exec", "wrangler", "r2", "object", "get",
                             bucket + "/" + key, "--remote", "--file", str(dest)]
                  try:
                      run = subprocess.run(command, cwd="workers/api",
                          capture_output=True, text=True, timeout=50, check=False)
                      if run.returncode != 0 or not dest.is_file():
                          print("R2_ARTICLE",json.dumps({"library":t["library"],"status":"not_readable",
                              "indexSection":t["section"]}))
                          continue
                      data = json.loads(dest.read_text(encoding="utf-8"))
                      sections = data.get("sections") if isinstance(data,dict) else None
                      if not isinstance(sections,list): sections=[]
                      matching = any(isinstance(s,dict) and s.get("id") == t["section"] for s in sections)
                      images = sum(len(s.get("images",[])) for s in sections if isinstance(s,dict) and
                                  isinstance(s.get("images"),list))
                      import re
                      html_fields = {k: len(data[k]) for k in ("contentHtml","content_html","html")
                                     if isinstance(data.get(k),str) and data[k]}
                      html_value = next((data[k] for k in ("contentHtml","content_html","html")
                                         if isinstance(data.get(k),str) and data[k]), "")
                      named_anchor = re.search(r"""(?:id|name)\s*=\s*["']""" +
                        re.escape(t["section"]) + r"""["']""", html_value, re.IGNORECASE)
                      heading_tags = len(re.findall(r"<h[1-6]\b", html_value, re.IGNORECASE))
                      scripts = len(re.findall(r"<script\b", html_value, re.IGNORECASE))
                      from html.parser import HTMLParser
                      class ArticleText(HTMLParser):
                          def __init__(self):
                              super().__init__(convert_charrefs=True)
                              self.text_parts = []
                              self.heading_depth = 0
                              self.heading_parts = []
                              self.headings = []
                          def handle_starttag(self, tag, attrs):
                              if re.fullmatch(r"h[1-6]", tag):
                                  self.heading_depth += 1
                                  self.heading_parts = []
                          def handle_data(self, data):
                              self.text_parts.append(data)
                              if self.heading_depth: self.heading_parts.append(data)
                          def handle_endtag(self, tag):
                              if re.fullmatch(r"h[1-6]", tag) and self.heading_depth:
                                  self.heading_depth -= 1
                                  self.headings.append(" ".join("".join(self.heading_parts).split()).casefold())
                      parser = ArticleText()
                      parser.feed(html_value)
                      normalize = lambda txt: " ".join(str(txt).split()).casefold()
                      heading_unique = sum(1 for sec in sections if isinstance(sec,dict) and
                          normalize(sec.get("heading","")) and
                          parser.headings.count(normalize(sec.get("heading",""))) == 1)
                      plain_text = normalize("".join(parser.text_parts))
                      prefix_uniques = 0
                      for sec in sections:
                          if not isinstance(sec,dict): continue
                          prefix = normalize(sec.get("text",""))[:75].strip()
                          if len(prefix) >= 35 and plain_text.count(prefix) == 1:
                              prefix_uniques += 1
                      print("R2_SECTION_MATCH",json.dumps({"library":t["library"],
                          "sectionCount":len(sections),"uniqueExactHeadingMatches":heading_unique,
                          "uniqueTextPrefixMatches":prefix_uniques,
                          "htmlHeadingsParsed":len(parser.headings)}))
                      print("R2_MEDIA_MARKUP",json.dumps({"library":t["library"],
                          "htmlImgTags":len(re.findall(r"<img\\b",html_value,re.IGNORECASE)),
                          "htmlFigures":len(re.findall(r"<figure\\b",html_value,re.IGNORECASE)),
                          "htmlTableTags":len(re.findall(r"<table\\b",html_value,re.IGNORECASE)),
                          "lazyImageAttributes":len(re.findall(r"\\bdata-(?:src|original|lazy-src)\\s*=",html_value,re.IGNORECASE))}))
                      print("R2_HTML",json.dumps({"library":t["library"],"fields":html_fields,
                           "htmlHeadingCount":heading_tags,"anchorForIndexedSection":bool(named_anchor),
                           "scriptTags":scripts}))
                      print("R2_ARTICLE",json.dumps({"library":t["library"],"status":"read",
                          "identityMatches":data.get("articleId")==t["article"] and
                            data.get("libraryId")==t["library"],
                          "sectionExists":matching, "schema":data.get("schemaVersion"),
                          "sections":len(sections),"images":images,
                          "hasOriginalHtml":any(isinstance(data.get(k),str) and bool(data[k])
                                                 for k in ("contentHtml","content_html","html"))}))
                  except (subprocess.TimeoutExpired, OSError, ValueError, TypeError):
                      print("R2_ARTICLE",json.dumps({"library":t["library"],"status":"not_readable"}))
          PY
