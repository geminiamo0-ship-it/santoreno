name: Pilot Credential Formatting (Temporary)
on:
  push:
    branches:
      - feat/pilot-credential-button
    paths:
      - .github/workflows/pilot-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pilot-credential-button
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write workers/api/src/app.ts workers/api/src/pilot/credential-console.test.ts
      - name: Commit formatted source on this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git add workers/api/src/app.ts workers/api/src/pilot/credential-console.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(pilot): apply pinned Prettier formatting"
          git push origin HEAD:feat/pilot-credential-button
