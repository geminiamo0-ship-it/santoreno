name: Research Error Audit (One-Time)
on:
  push:
    branches:
      - feat/pubmed-research-mode-203
    paths:
      - .github/workflows/research-error-audit-once.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Query staging aggregated AI failure codes without personal data
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          query="SELECT blob2 AS outcome, blob6 AS code, COUNT() AS requests FROM santo_usage_staging WHERE timestamp > now() - INTERVAL '3' HOUR AND blob1 = 'ai.query' GROUP BY outcome, code ORDER BY requests DESC LIMIT 30"
          curl -sS --fail-with-body "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/analytics_engine/sql" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data "$query" > /tmp/result.json
          jq '{data: (.data // []), errorCount:(.errors|length?)}' /tmp/result.json
          echo "Only aggregate code/count values printed. No user IDs, emails, queries, tokens or per-event data." >> "$GITHUB_STEP_SUMMARY"
