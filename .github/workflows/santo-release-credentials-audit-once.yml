name: Santo release credential readiness
on:
  push:
    branches: [feat/96-luna-professor-staging]
    paths: [.github/workflows/santo-release-credentials-audit-once.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_SANTO_LIBRARY_SOURCE_READ_TOKEN: ${{ secrets.SANTO_LIBRARY_SOURCE_READ_TOKEN != '' }}
      HAS_SANTO_DRIVE_ZIP_FILE_ID: ${{ secrets.SANTO_DRIVE_ZIP_FILE_ID != '' }}
      HAS_AI_SEARCH_R2_SERVICE_TOKEN_ID: ${{ secrets.AI_SEARCH_R2_SERVICE_TOKEN_ID != '' }}
    steps:
      - name: Confirm which deploy connectors exist without showing values
        shell: bash
        run: |
          set -euo pipefail
          echo '## Secure release connectivity (secret presence only)' >> "$GITHUB_STEP_SUMMARY"
          echo 'CLOUDFLARE_API_TOKEN: ' "$HAS_CLOUDFLARE_API_TOKEN" >> "$GITHUB_STEP_SUMMARY"
          echo 'SANTO_LIBRARY_SOURCE_READ_TOKEN: ' "$HAS_SANTO_LIBRARY_SOURCE_READ_TOKEN" >> "$GITHUB_STEP_SUMMARY"
          echo 'SANTO_DRIVE_ZIP_FILE_ID: ' "$HAS_SANTO_DRIVE_ZIP_FILE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo 'AI_SEARCH_R2_SERVICE_TOKEN_ID: ' "$HAS_AI_SEARCH_R2_SERVICE_TOKEN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo 'No credentials read or printed.' >> "$GITHUB_STEP_SUMMARY"
