name: Santo Gallery Candidate Format
on:
  push:
    branches:
      - feat/santo-gallery-sixth-search-staging-20261017
    paths:
      - .github/workflows/santo-gallery-formatter.yml
permissions:
  contents: write
jobs:
  format-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format status and retained gallery code
        run: |
          pnpm exec prettier --write PROJECT_STATUS.md workers/api/src/ai/handler.ts workers/api/src/ai/image-gallery.ts workers/api/src/ai/image-gallery.test.ts workers/api/src/ai/service.ts workers/api/src/ai/retrieval.ts workers/api/src/ai/retrieval.test.ts
      - name: Commit formatting only to gallery feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add PROJECT_STATUS.md workers/api/src/ai/handler.ts workers/api/src/ai/image-gallery.ts workers/api/src/ai/image-gallery.test.ts workers/api/src/ai/service.ts workers/api/src/ai/retrieval.ts workers/api/src/ai/retrieval.test.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(staging): format sixth image search and project handoff'
            git push origin HEAD:feat/santo-gallery-sixth-search-staging-20261017
          fi
