name: P2 Staging Acceptance

on:
  push:
    branches:
      - feat/issue-3-tenant-auth

permissions:
  contents: read
  checks: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
  P2_WORKOS_STATE_PATH: /tmp/santo-p2-workos-state.json
  GH_TOKEN: ${{ github.token }}
  NO_COLOR: "1"

jobs:
  p2-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Verify on this commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")"
            policy="$(jq -r '[.check_runs[] | select(.name == "repository-policy") | .conclusion] | map(select(. != null)) | .[0] // ""' <<<"$checks")"
            quality="$(jq -r '[.check_runs[] | select(.name == "code-quality") | .conclusion] | map(select(. != null)) | .[0] // ""' <<<"$checks")"
            if [[ "$policy" == "success" && "$quality" == "success" ]]; then
              echo "Verify is green for ${GITHUB_SHA}."
              exit 0
            fi
            for conclusion in "$policy" "$quality"; do
              case "$conclusion" in
                failure|cancelled|timed_out|action_required|startup_failure|stale)
                  echo "Verify failed: repository-policy=${policy}, code-quality=${quality}"
                  exit 1
                  ;;
              esac
            done
            sleep 5
          done
          echo "Timed out waiting for Verify."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load WorkOS staging config
        shell: bash
        run: |
          set -euo pipefail
          client_id="$(jq -r '.workos.clientId // empty' config/environments/staging.json)"
          environment_id="$(jq -r '.workos.environmentId // empty' config/environments/staging.json)"
          application_id="$(jq -r '.workos.applicationId // empty' config/environments/staging.json)"
          issuer="$(jq -r '.workos.issuer // empty' config/environments/staging.json)"
          test -n "$client_id"
          test -n "$environment_id"
          test -n "$application_id"
          test -n "$issuer"
          echo "WORKOS_CLIENT_ID=$client_id" >> "$GITHUB_ENV"
          echo "WORKOS_ENVIRONMENT_ID=$environment_id" >> "$GITHUB_ENV"
          echo "WORKOS_APPLICATION_ID=$application_id" >> "$GITHUB_ENV"
          echo "WORKOS_ISSUER=$issuer" >> "$GITHUB_ENV"

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          cd workers/api
          pnpm exec wrangler whoami

      - name: Validate WorkOS staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WORKOS_CLIENT_ID:-}"
          test -n "${WORKOS_ISSUER:-}"
          test -n "${WORKOS_API_KEY:-}"

      - name: Apply P2 staging migrations
        shell: bash
        run: |
          set -euo pipefail
          cd workers/api
          pnpm exec wrangler d1 migrations apply CONTROL_DB --env staging --remote

      - name: Verify tenancy tables exist remotely
        shell: bash
        run: |
          set -euo pipefail
          cd workers/api
          pnpm exec wrangler d1 execute CONTROL_DB --env staging --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('tenants','tenant_members') ORDER BY name;" \
            > /tmp/p2-tables.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/p2-tables.json', 'utf8'));
          const rows = payload.flatMap((entry) => entry?.results ?? entry?.result?.results ?? []);
          const names = new Set(rows.map((row) => row.name));
          for (const expected of ['tenant_members', 'tenants']) {
            if (!names.has(expected)) throw new Error(`Missing remote table: ${expected}`);
          }
          console.log('Remote P2 tenancy tables verified.');
          NODE

      - name: Seed and authenticate WorkOS staging identities
        shell: bash
        run: node scripts/p2-live-acceptance.mjs seed

      - name: Deploy P2 staging Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          smoke_token="$(openssl rand -hex 32)"
          echo "::add-mask::$smoke_token"
          echo "INFRA_SMOKE_TOKEN=$smoke_token" >> "$GITHUB_ENV"
          jq -n \
            --arg smoke "$smoke_token" \
            --arg client "$WORKOS_CLIENT_ID" \
            --arg issuer "$WORKOS_ISSUER" \
            --arg admins "$SANTO_SUPER_ADMIN_USER_IDS" \
            '{
              INFRA_SMOKE_TOKEN: $smoke,
              WORKOS_CLIENT_ID: $client,
              WORKOS_ISSUER: $issuer,
              SANTO_SUPER_ADMIN_USER_IDS: $admins
            }' > /tmp/p2-secrets.json
          chmod 600 /tmp/p2-secrets.json
          trap 'rm -f /tmp/p2-secrets.json' EXIT
          cd workers/api
          pnpm exec wrangler deploy --env staging --secrets-file /tmp/p2-secrets.json | tee /tmp/p2-deploy.txt
          worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/p2-deploy.txt | tail -n 1)"
          test -n "$worker_url"
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Verify P2 staging runtime
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            health="$(curl --silent --show-error "${WORKER_URL}/health" || true)"
            if jq -e '.service == "santo-api" and .status == "ok"' <<<"$health" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          jq -e '.service == "santo-api" and .status == "ok"' <<<"$health" >/dev/null

          status="$(curl --silent --output /tmp/p2-auth.json --write-out '%{http_code}' "${WORKER_URL}/v1/portal/context")"
          test "$status" = "401"
          jq -e '.error == "AUTH_REQUIRED"' /tmp/p2-auth.json >/dev/null

          smoke_status=""
          for attempt in $(seq 1 45); do
            smoke_status="$(curl --silent --show-error \
              --output /tmp/p2-smoke.json \
              --write-out '%{http_code}' \
              -H "x-santo-infra-smoke-token: ${INFRA_SMOKE_TOKEN}" \
              "${WORKER_URL}/__infra/smoke" || true)"
            if [[ "$smoke_status" == "200" ]] && \
              jq -e '.environment == "staging" and .bindings.controlDatabase == "ok"' /tmp/p2-smoke.json >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          test "$smoke_status" = "200"
          jq -e '.environment == "staging" and .bindings.controlDatabase == "ok"' /tmp/p2-smoke.json >/dev/null

          {
            echo "## P2 staging acceptance"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Worker: \`${WORKER_URL}\`"
            echo "- D1 migration 0002: applied"
            echo "- Remote tenants/tenant_members tables: verified"
            echo "- /health: passed"
            echo "- unauthenticated /v1/portal/context: 401 AUTH_REQUIRED"
            echo "- D1 runtime binding: passed"
            echo "- infra smoke token: rotated, masked, and propagation-verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify real WorkOS auth and tenant isolation
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: node scripts/p2-live-acceptance.mjs verify

      - name: Cleanup Santo staging fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$P2_WORKOS_STATE_PATH" ]]; then
            exit 0
          fi
          node scripts/p2-live-acceptance.mjs cleanup-sql > /tmp/p2-cleanup.sql
          if [[ -s /tmp/p2-cleanup.sql ]]; then
            cd workers/api
            pnpm exec wrangler d1 execute CONTROL_DB --env staging --remote --file /tmp/p2-cleanup.sql
          fi

      - name: Cleanup WorkOS staging fixtures
        if: always()
        shell: bash
        run: node scripts/p2-live-acceptance.mjs cleanup-workos

      - name: Remove P2 staging state
        if: always()
        shell: bash
        run: rm -f "$P2_WORKOS_STATE_PATH" /tmp/p2-cleanup.sql /tmp/p2-secrets.json
