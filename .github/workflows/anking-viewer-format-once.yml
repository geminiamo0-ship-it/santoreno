name: Format AnKing Viewer Branch Once
on:
  push:
    branches:
      - feat/anking-card-data-viewer-20261018
    paths:
      - .github/workflows/anking-viewer-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format affected app and inherited status doc
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write packages/contracts/src/ai.ts workers/api/src/ai/anking-flashcards.ts PROJECT_STATUS.md
          git add packages/contracts/src/ai.ts workers/api/src/ai/anking-flashcards.ts PROJECT_STATUS.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "style(anking): format contracts, R2 viewer and repository status"
          git push origin HEAD:feat/anking-card-data-viewer-20261018
