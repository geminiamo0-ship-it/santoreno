name: Research PMC Full-Text Candidate Verification (NO DEPLOY)

on:
  push:
    branches:
      - fix/research-pmc-fulltext-priority-20261021

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Format only changed Research files
        run: |
          set -euo pipefail
          pnpm exec prettier --write workers/api/src/ai/research-fulltext.ts workers/api/src/ai/research-fulltext.test.ts workers/api/src/ai/research-retrieval.ts workers/api/src/ai/prompt.ts workers/api/src/ai/prompt.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/api/src/ai/research-fulltext.ts workers/api/src/ai/research-fulltext.test.ts workers/api/src/ai/research-retrieval.ts workers/api/src/ai/prompt.ts workers/api/src/ai/prompt.test.ts
            git commit -m "style(research): format PMC full-text priority and regression tests"
            git push origin HEAD:fix/research-pmc-fulltext-priority-20261021
          fi
      - name: Lint TypeScript tests build and smoke (no deployment)
        id: verify
        run: |
          set -euo pipefail
          for command in lint typecheck test build smoke; do
            echo "VERIFY_STAGE=$command"
            if ! pnpm "$command" > /tmp/research_verify.log 2>&1; then
              cp /tmp/research_verify.log /tmp/research_failed.log
              printf '%s\n' "$command" > /tmp/research_failed_stage
              tail -n 85 /tmp/research_failed.log
              exit 1
            fi
            tail -n 4 /tmp/research_verify.log
          done
      - name: Publish exact verification result to Research issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ steps.verify.outcome }}
          JOB_RESULT: ${{ job.status }}
        run: |
          gh issue comment 203 --repo geminiamo0-ship-it/santoreno \
            --body "PMC full-text-first Research verification on SHA $(git rev-parse HEAD): test=$TEST_RESULT job=$JOB_RESULT. Staging/Production NOT deployed. CI details: https://github.com/geminiamo0-ship-it/santoreno/actions/workflows/research-pmc-verify-once.yml"
      - name: Publish failed stage diagnostics to Research issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "PMC Research failed verification on SHA $(git rev-parse HEAD), stage $(cat /tmp/research_failed_stage 2>/dev/null || echo unknown):"
            echo '~~~'
            tail -n 65 /tmp/research_failed.log 2>/dev/null || echo "No diagnostic log captured"
            echo '~~~'
            echo "Production/Staging remain unchanged."
          } > /tmp/research_issue.md
          gh issue comment 203 --repo geminiamo0-ship-it/santoreno --body-file /tmp/research_issue.md
      - name: Record tested SHA
        run: |
          echo "RESEARCH_FULLTEXT_TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare Worker NOT deployed." >> "$GITHUB_STEP_SUMMARY"
