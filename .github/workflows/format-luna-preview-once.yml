name: Format Santo Luna Preview Once
on:
  push:
    branches:
      - feat/96-luna-professor-staging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'geminiamo0-ship-it/santoreno'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/96-luna-professor-staging
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/SANTO_LUNA_STAGING_PREVIEW.md workers/api/src/ai/model.test.ts
      - name: Commit format-only adjustments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SANTO_LUNA_STAGING_PREVIEW.md workers/api/src/ai/model.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(ai): format Luna staging preview"
            git push origin HEAD:feat/96-luna-professor-staging
          fi
