name: PubMed Failover — Staging Redeploy (One-Time)
on:
  push:
    branches:
      - feat/pubmed-research-mode-203
    paths:
      - ".github/workflows/research-failover-staging-deploy-once.yml"
permissions:
  contents: read
  checks: read
concurrency:
  group: santo-research-redeploy-staging
  cancel-in-progress: false
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm exact commit has passed Verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 50); do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")"
            policy="$(jq -r '[.check_runs[] | select(.name == "repository-policy") | .conclusion] | map(select(. != null)) | .[0] // ""' <<< "$checks")"
            quality="$(jq -r '[.check_runs[] | select(.name == "code-quality") | .conclusion] | map(select(. != null)) | .[0] // ""' <<< "$checks")"
            if [[ "$policy" == success && "$quality" == success ]]; then exit 0; fi
            case "$policy:$quality" in
              *failure*|*cancelled*|*timed_out*|*action_required*|*startup_failure*|*stale*)
                echo "Verified gate failed: policy=$policy quality=$quality"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Exact SHA gate timed out"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy to Santo staging ONLY
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          corepack enable
          pnpm install --frozen-lockfile
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Smoke check staged Worker and anonymous authorization
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 3 --retry-all-errors --fail --silent "$WORKER_URL/health" | jq -e '.service == "santo-api" and .status == "ok"'
          code="$(curl --silent --output /tmp/santo-anonymous-smoke.json --write-out '%{http_code}' -X POST "$WORKER_URL/v1/ai/query" -H 'content-type: application/json' --data '{"query":"Aortic stenosis treatment evidence","idempotency_key":"staging-anonymous-check","source_mode":"research"}')"
          echo "Anonymous Research endpoint status: $code"
          test "$code" = 401
          echo "Staging deployed; health and anonymous authorization verified. Live authenticated PubMed/PMC QA still required." >> "$GITHUB_STEP_SUMMARY"
