name = "santo-api"
main = "src/index.ts"
compatibility_date = "2026-09-14"

[dev]
port = 8787

[vars]
SANTO_ENV = "local"
SANTO_SESSION_TTL_SECONDS = "900"

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "santo-control-plane-local"
database_id = "00000000-0000-0000-0000-000000000001"
preview_database_id = "CONTROL_DB"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "santo-content-local"
preview_bucket_name = "santo-content-local"

[durable_objects]
bindings = [
  { name = "TENANT_METER", class_name = "TenantMeterDO" },
  { name = "CONVERSATION", class_name = "ConversationDO" },
]

[exports.TenantMeterDO]
type = "durable-object"
storage = "sqlite"

[exports.ConversationDO]
type = "durable-object"
storage = "sqlite"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "santo-events-local"

[[queues.consumers]]
queue = "santo-events-local"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 2

[[analytics_engine_datasets]]
binding = "USAGE_ANALYTICS"
dataset = "santo_usage_local"

[env.staging]
name = "santo-api-staging"
workers_dev = true

[env.staging.vars]
SANTO_ENV = "staging"
SANTO_SESSION_TTL_SECONDS = "900"
SANTO_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

[env.staging.secrets]
required = ["INFRA_SMOKE_TOKEN", "SANTO_SESSION_SIGNING_KEY"]

[env.staging.ai]
binding = "AI"

[[env.staging.d1_databases]]
binding = "CONTROL_DB"
database_name = "santo-control-plane-staging"
database_id = "f875f14a-100a-4731-9e9e-1beed957fd16"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "santo-content-staging"

[env.staging.durable_objects]
bindings = [
  { name = "TENANT_METER", class_name = "TenantMeterDO" },
  { name = "CONVERSATION", class_name = "ConversationDO" },
]

[[env.staging.queues.producers]]
binding = "EVENT_QUEUE"
queue = "santo-events-staging"

[[env.staging.queues.consumers]]
queue = "santo-events-staging"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 2

[[env.staging.analytics_engine_datasets]]
binding = "USAGE_ANALYTICS"
dataset = "santo_usage_staging"

[[env.staging.ai_search_namespaces]]
binding = "AI_SEARCH"
namespace = "default"

# Production intentionally omits CONTROL_DB until the real production D1 UUID
# is provisioned. The remaining bindings are name-based and can be declared now.
[env.production]
name = "santo-api"

[env.production.vars]
SANTO_ENV = "production"
SANTO_SESSION_TTL_SECONDS = "900"
SANTO_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

[env.production.ai]
binding = "AI"

[[env.production.r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "santo-content"

[env.production.durable_objects]
bindings = [
  { name = "TENANT_METER", class_name = "TenantMeterDO" },
  { name = "CONVERSATION", class_name = "ConversationDO" },
]

[[env.production.queues.producers]]
binding = "EVENT_QUEUE"
queue = "santo-events"

[[env.production.queues.consumers]]
queue = "santo-events"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 2

[[env.production.analytics_engine_datasets]]
binding = "USAGE_ANALYTICS"
dataset = "santo_usage"

[[env.production.ai_search_namespaces]]
binding = "AI_SEARCH"
namespace = "default"
