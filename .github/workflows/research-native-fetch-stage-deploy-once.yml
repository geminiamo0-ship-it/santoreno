name: Research Native Fetch Fix - Staging Deploy Once
on:
  push:
    branches:
      - feat/pubmed-research-mode-203
    paths:
      - ".github/workflows/research-native-fetch-stage-deploy-once.yml"
permissions:
  contents: read
  checks: read
concurrency:
  group: santo-research-staging-native-fetch-fix
  cancel-in-progress: false
jobs:
  staging-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      WORKER_URL: https://santo-api-staging.geminiamo0.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Require repository Verify checks for this exact commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")"
            policy="$(jq -r '[.check_runs[] | select(.name == "repository-policy") | .conclusion] | map(select(. != null)) | .[0] // ""' <<< "$checks")"
            quality="$(jq -r '[.check_runs[] | select(.name == "code-quality") | .conclusion] | map(select(. != null)) | .[0] // ""' <<< "$checks")"
            if [[ "$policy" == success && "$quality" == success ]]; then
              echo "Exact head passed repository Verify"; exit 0
            fi
            case "$policy:$quality" in
              *failure*|*cancelled*|*timed_out*|*action_required*|*startup_failure*|*stale*)
                echo "Exact head Verify failed: $policy:$quality"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for exact SHA Verify"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Santo staging only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          corepack enable
          pnpm install --frozen-lockfile
          cd workers/api
          pnpm exec wrangler deploy --env staging --keep-vars
      - name: Smoke checks without user tokens or quota charges
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 3 --retry-all-errors --fail --silent "$WORKER_URL/health" |
            jq -e '.service == "santo-api" and .status == "ok"'
          code="$(curl --silent --output /tmp/research-unauthenticated.json --write-out '%{http_code}' -X POST "$WORKER_URL/v1/ai/query" -H "content-type: application/json" --data '{"query":"Aortic stenosis","idempotency_key":"native-fetch-fixed-anon","source_mode":"research"}')"
          test "$code" = 401
          echo "Staging is deployed and health/auth gates pass. Production unchanged." >> "$GITHUB_STEP_SUMMARY"
