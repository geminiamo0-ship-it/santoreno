name: Format Citation Fix Status Note — Once

on:
  push:
    branches:
      - fix/santo-all-hits-citation-contract-staging-20261020
    paths:
      - .github/workflows/santo-citations-status-format-once.yml

permissions:
  contents: write

jobs:
  format-status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Format living handoff
        run: |
          set -euo pipefail
          pnpm exec prettier --write PROJECT_STATUS.md
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PROJECT_STATUS.md
            git commit -m "docs(staging): format verified citations deployment handoff"
            git push origin HEAD:fix/santo-all-hits-citation-contract-staging-20261020
          fi
      - name: Full validation (NO DEPLOY)
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
