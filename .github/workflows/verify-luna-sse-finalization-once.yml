name: Verify Luna SSE Finalization Once
on:
  push:
    branches:
      - fix/staging-luna-sse-finalization-20261015
    paths:
      - .github/workflows/verify-luna-sse-finalization-once.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Format changed stream and regression tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write workers/api/src/ai/luna-event-stream.ts workers/api/src/ai/luna-event-stream.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/api/src/ai/luna-event-stream.ts workers/api/src/ai/luna-event-stream.test.ts
            git commit -m "style(ai): format robust Luna SSE parser"
            git push origin HEAD:refs/heads/fix/staging-luna-sse-finalization-20261015
          fi
      - name: Full Santo verification
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
