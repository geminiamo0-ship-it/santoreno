name: Santo Native Streaming Strict Verify (No Deployment)
on:
  push:
    branches: [feat/96-native-luna-sse-staging-20261015]
    paths: [.github/workflows/santo-native-streaming-verify-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Full model/provisional stream safety checks (no deploy)
        run: |
          set -euo pipefail
          echo 'STREAM_PRETTIER_DIFF_BEGIN'
          for file in packages/contracts/src/conversation.ts workers/api/src/ai/luna-event-stream.ts workers/api/src/ai/luna-event-stream.test.ts workers/api/src/ai/model.ts workers/api/src/ai/service.ts workers/api/src/ai/handler.ts workers/api/src/ai/types.ts workers/api/src/conversation/ask-service.ts workers/api/src/conversation/handler.ts workers/api/src/conversation/native-stream.ts workers/api/src/conversation/native-stream.test.ts workers/api/src/runtime/bindings.ts; do
            pnpm exec prettier "$file" | diff -u "$file" - || true
          done
          echo 'STREAM_PRETTIER_DIFF_END'
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm smoke
