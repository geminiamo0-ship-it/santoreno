name: Santo Gallery Candidate Verify
on:
  push:
    branches:
      - feat/santo-gallery-sixth-search-staging-20261017
permissions:
  contents: read
jobs:
  candidate-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository-pinned dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Static analysis
        run: |
          pnpm lint
          pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build and smoke
        run: |
          pnpm build
          pnpm smoke
      - name: Dry-run actual owner Drive ZIP ingestion without Cloudflare writes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'gdown==5.2.0' 'requests==2.32.3'
          python - <<'PY'
          import gdown, os, pathlib
          dst=pathlib.Path(os.environ['RUNNER_TEMP'])/'santo_medical_images.zip'
          f=gdown.download(id='1ZR-EGLrKS4szarRqZ8wfuhp_EQqUI2u3',output=str(dst),quiet=False)
          if not f or not dst.exists():
              raise SystemExit('Owner Drive ZIP not publicly readable by GitHub Actions')
          PY
          python scripts/ingest_santo_medical_gallery.py --archive "$RUNNER_TEMP/santo_medical_images.zip" --output "$RUNNER_TEMP/santo-gallery"
      - name: Gallery ingestion source syntax
        run: python -m py_compile scripts/ingest_santo_medical_gallery.py
