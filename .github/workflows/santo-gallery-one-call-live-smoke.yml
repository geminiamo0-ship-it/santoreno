name: Santo Gallery Six-Index One-Call Live Smoke
on:
  push:
    branches:
      - feat/santo-gallery-sixth-search-staging-20261017
    paths:
      - .github/workflows/santo-gallery-one-call-live-smoke.yml
permissions:
  contents: read
jobs:
  verify-six-index-one-call:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned HTTP client
        run: python -m pip install "requests==2.32.3"
      - name: One real namespace-level search across six indexes
        run: python scripts/smoke_santo_six_index.py
