name: Santo Staging Model Provider Inventory (One-Time)
on:
  push:
    branches: [feat/pubmed-research-mode-203]
    paths: [.github/workflows/research-model-provider-inventory-once.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          cd workers/api
          pnpm exec wrangler secret list --env staging > /tmp/santo-secret-names.json
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/santo-secret-names.json"))
          names=[x.get("name","") for x in data if isinstance(x,dict)]
          relevant=[n for n in names if any(t in n.upper() for t in ("LUNA","OPENROUTER","MODEL","PROVIDER","API_KEY"))]
          print("Staging AI-provider secret NAMES ONLY:",sorted(relevant))
          print("Any Luna/OpenRouter credential present:",any("LUNA" in n.upper() or "OPENROUTER" in n.upper() for n in names))
          PY
          rm -f /tmp/santo-secret-names.json
